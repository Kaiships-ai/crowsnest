<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude idea</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#F0EEE6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:ui-sans-serif,system-ui,sans-serif;color:#3d3d3a}
  .stage{display:flex;align-items:center;justify-content:center;min-height:230px}
  svg{width:180px;height:auto;overflow:visible}
  .caption{font-size:13px;opacity:.55;max-width:38ch;text-align:center}
  a{color:#b7623f}
</style>
</head>
<body>
  <div class="stage">
    <svg id="scene" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <rect class="ldot" x="47" y="28" width="7" height="7" fill="#C15E45"/>
      <rect class="ldot" x="56" y="28" width="7" height="7" fill="#C15E45"/>
      <rect class="ldot" x="65" y="28" width="7" height="7" fill="#C15E45"/>
      <g id="bulb" opacity="0">
        <rect class="ray" x="57" y="-2" width="4" height="8" fill="#F2B705"/>
        <rect class="ray" x="41" y="8" width="8" height="4" fill="#F2B705"/>
        <rect class="ray" x="69" y="8" width="8" height="4" fill="#F2B705"/>
        <rect class="ray" x="44" y="-2" width="5" height="4" fill="#F2B705" transform="rotate(-45 46 0)"/>
        <rect class="ray" x="69" y="-2" width="5" height="4" fill="#F2B705" transform="rotate(45 72 0)"/>
        <rect x="52" y="6" width="14" height="14" fill="#FFD34E"/>
        <rect x="54" y="4" width="10" height="4" fill="#FFD34E"/>
        <rect x="55" y="20" width="8" height="4" fill="#9a948a"/>
        <rect x="56" y="24" width="6" height="3" fill="#7c776b"/>
      </g>
      <g id="claude" transform="translate(6,52)"><rect x="11" y="60" width="11" height="26" fill="#DD775B"/><rect x="32" y="60" width="11" height="26" fill="#DD775B"/><rect x="64" y="60" width="11" height="26" fill="#DD775B"/><rect x="85" y="60" width="11" height="26" fill="#DD775B"/><g id="body"><rect id="bdy" x="11" y="0" width="85" height="65" fill="#DD775B"/><rect id="hand-r" x="85" y="21" width="22" height="23" fill="#DD775B"/><rect id="hand-l" x="0" y="21" width="22" height="23" fill="#DD775B"/><g id="eyes"><rect x="21" y="11" width="11" height="11" fill="black"/><rect x="75" y="11" width="11" height="11" fill="black"/></g></g></g>
    </svg>
  </div>
  <p class="caption">Loading, then an idea. Dots pulse, then a lightbulb pops over the head with rays and wide eyes.</p>
  <p class="caption"><a href="gallery.html">back to all</a></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  window.addEventListener("load", () => {
    const svg = document.querySelector("#scene");
    const q = s => svg.querySelector(s);
    const qa = s => [...svg.querySelectorAll(s)];
    const dots=qa(".ldot"), bulb=q("#bulb"), rays=qa(".ray"), eyes=q("#eyes"), claude=q("#claude");
    gsap.set(dots,{transformOrigin:"50% 50%"});
    const EYES_O="59 68", BULB_O="59 13";
    const master=gsap.timeline({repeat:-1});
    master.set(dots,{opacity:1});
    for(let round=0; round<2; round++){
      dots.forEach((d,i)=>{
        master.to(d,{scale:1.5,opacity:1,duration:0.18,ease:"power1.out"},round*0.9+i*0.18)
              .to(d,{scale:0.7,opacity:0.4,duration:0.18,ease:"power1.in"},round*0.9+i*0.18+0.18);
      });
    }
    master.to(dots,{opacity:0,duration:0.15},"+=0.1")
      .fromTo(bulb,{opacity:0,scale:0,svgOrigin:BULB_O},{opacity:1,scale:1,duration:0.4,ease:"back.out(2.2)"})
      .fromTo(rays,{scale:0,svgOrigin:BULB_O},{scale:1,duration:0.25,ease:"back.out(3)"},"<")
      .to(eyes,{scaleY:1.35,scaleX:1.1,duration:0.18,svgOrigin:EYES_O},"<")
      .to(claude,{y:-5,duration:0.15,ease:"power2.out"},"<")
      .to(claude,{y:0,duration:0.2,ease:"bounce.out"})
      .to(bulb,{opacity:0.75,duration:0.35,repeat:3,yoyo:true,ease:"sine.inOut"})
      .to(eyes,{scaleY:1,scaleX:1,duration:0.2,svgOrigin:EYES_O})
      .to(bulb,{opacity:0,scale:0.4,duration:0.25,svgOrigin:BULB_O},"+=0.2")
      .set(dots,{scale:1,opacity:0})
      .to({},{duration:0.4});
  });
  </script>
</body>
</html>
