  <p class="caption">Stomping with confetti. One 8 frame stomp loop plus two confetti bursts timed to land on specific stomps.</p>
  <p class="caption"><a href="gallery.html">back to all four</a></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  window.addEventListener("load", () => {
    const svg = document.querySelector("#stage svg");
    // author's confetti effect (module 926067), verbatim logic
    const stomp = [...svg.querySelectorAll('g[id^="l0"]')];  // 8 stomp body frames l001..l008
    const topG = [...svg.querySelectorAll(":scope > g")];
    const leftC = topG[8], rightC = topG[9];                 // the two confetti burst containers
    const leftF = [...leftC.querySelectorAll(":scope > g")]; // 8 particle frames each
    const rightF = [...rightC.querySelectorAll(":scope > g")];
    const yoff = [-65,-72,-76,-70,-58,-42,-22,0];

    const f = gsap.timeline({ repeat: -1 });                 // stomp cycle
    for (let t = 0; t < 8; t++) {
      const at = 0.125 * t;
      stomp.forEach((el, h) => f.set(el, { display: h === t ? "inline" : "none" }, at));
    }
    const n = gsap.timeline({ repeat: -1, delay: 0.125 });   // first burst, fires 1 frame in
    n.set(leftC, { display: "inline" }, 0);
    for (let t = 0; t < 8; t++) {
      const at = 0.125 * t;
      n.set(leftC, { attr: { transform: `translate(90, ${yoff[t]})` } }, at);
      leftF.forEach((el, h) => n.set(el, { display: h === t ? "inline" : "none" }, at));
    }
    const wv = gsap.timeline({ repeat: -1, delay: 0.75 });   // second burst, fires 6 frames in
    wv.set(rightC, { display: "inline" }, 0);
    for (let t = 0; t < 8; t++) {
      const at = 0.125 * t;
      wv.set(rightC, { attr: { transform: `translate(40, ${yoff[t]}) scale(-1, 1)` } }, at);
      rightF.forEach((el, h) => wv.set(el, { display: h === t ? "inline" : "none" }, at));
    }
  });
  </script>
