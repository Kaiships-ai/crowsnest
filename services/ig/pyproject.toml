[project]
name = "crowsnest-ig"
version = "0.1.0"
description = "Localhost-only instagrapi sidecar for Crowsnest"
requires-python = "==3.12.*"
dependencies = [
    "instagrapi==2.18.9",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.41.0",
    "pydantic>=2.12.5,<2.14",
]

# This sidecar only ever runs on the developer's machine (macOS/Linux).
# Pinning the resolution environment keeps instagrapi's android-only pydantic
# pin from making the lock unsolvable.
[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crowsnest_ig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
