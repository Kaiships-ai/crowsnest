:root{
  --bg:#f6f5f8;--surface:#fff;--ink:#1f1b29;--muted:#6b6577;--faint:#a8a3b1;
  --line:rgba(40,30,60,.08);--hover:rgba(40,30,60,.045);--shape:rgba(40,30,60,.07);
  --signal:#ff8f6b;--signal-ink:#b4512c;--signal-wash:rgba(255,143,107,.13);--ok:#2f8f68;
  --scrim:rgba(40,34,52,.22);--shadow:0 1px 2px rgba(40,30,60,.05),0 24px 60px -28px rgba(40,30,60,.28);
  --dock:#ecebf0;--dock-ink:#3d3848;--dock-muted:#7b7586;
  --reel:#201c2b;--reel-ink:#fff;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-sheet:cubic-bezier(.32,.72,0,1);
  --font:Onest,-apple-system,"SF Pro Text",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141318;--surface:#1c1b22;--ink:#f3f0f7;--muted:#a6a0b0;--faint:#6f6979;
  --line:rgba(255,255,255,.075);--hover:rgba(255,255,255,.05);--shape:rgba(255,255,255,.075);
  --signal:#ff9f7c;--signal-ink:#ffb08f;--signal-wash:rgba(255,159,124,.12);--ok:#7dd6ab;
  --scrim:rgba(5,4,9,.5);--shadow:0 1px 2px rgba(0,0,0,.3),0 24px 60px -28px rgba(0,0,0,.7);
  --dock:#0e0d12;--dock-ink:#d8d4de;--dock-muted:#8a8494;--reel:#26222f;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141318;--surface:#1c1b22;--ink:#f3f0f7;--muted:#a6a0b0;--faint:#6f6979;
  --line:rgba(255,255,255,.075);--hover:rgba(255,255,255,.05);--shape:rgba(255,255,255,.075);
  --signal:#ff9f7c;--signal-ink:#ffb08f;--signal-wash:rgba(255,159,124,.12);--ok:#7dd6ab;
  --scrim:rgba(5,4,9,.5);--shadow:0 1px 2px rgba(0,0,0,.3),0 24px 60px -28px rgba(0,0,0,.7);
  --dock:#0e0d12;--dock-ink:#d8d4de;--dock-muted:#8a8494;--reel:#26222f;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
h1,h2,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}

/* ---- the app ---- */
#app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rail{flex:none;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;gap:8px}
.me{display:flex;align-items:center;gap:6px;justify-self:start;min-width:0;height:44px;border-radius:12px;padding-right:6px}
.me .slot{width:44px;height:44px;flex:none}
.me-label{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-label b{font-weight:500;color:var(--ink)}
@media (hover:hover){.me.has-job:hover{background:var(--hover)}}
.words{display:flex;gap:2px}
.words button{position:relative;height:34px;padding:0 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14px}

#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{max-width:680px;margin:0 auto;padding:clamp(28px,7vh,72px) 20px 72px}
.page.wide{max-width:880px}
.fade{animation:fade .11s linear}
@keyframes fade{from{opacity:0}}

h1{font-size:34px;line-height:1.14;letter-spacing:-.024em;font-weight:600;text-wrap:balance}
.sub{margin-top:10px;font-size:16px;color:var(--muted);max-width:56ch;text-wrap:pretty}
h2{font-size:13px;font-weight:550;color:var(--muted);margin:44px 0 6px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:24px}

.btn{height:40px;padding:0 16px;border-radius:11px;font-weight:550;font-size:14.5px;white-space:nowrap;transition:transform .12s var(--ease-out),background-color .12s linear,opacity .12s linear}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.quiet{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{height:32px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
@media (hover:hover){.btn.primary:not(:disabled):hover{opacity:.88}.btn.quiet:not(:disabled):hover{background:var(--hover)}}

/* the one status shape: sentence, detail, YOU CAN, IF YOU WAIT, button */
.status{display:grid;grid-template-columns:88px minmax(0,1fr);gap:0 22px;align-items:start}
.status>.slot{width:88px;height:88px;margin-top:-10px}
.status.big{display:block;text-align:center}
.status.big>.slot{width:min(260px,60vw);height:min(260px,60vw);margin:0 auto 4px}
.status.big .sub{margin-inline:auto}
.status.big .acts{justify-content:center}
.status.big dl{text-align:left;max-width:460px;margin-inline:auto}
.hand{margin-top:22px;display:grid;gap:8px}
.hand>div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px}
.hand dt{font-size:11px;line-height:22px;letter-spacing:.07em;text-transform:uppercase;font-weight:550;color:var(--muted)}
.hand dd{font-size:14.5px}
@media (max-width:560px){.status{grid-template-columns:60px minmax(0,1fr);gap:0 12px}.status>.slot{width:60px;height:60px;margin-top:-4px}.hand>div{grid-template-columns:78px minmax(0,1fr)}h1{font-size:28px}}

/* rows */
.rows>li,.row{display:grid;align-items:center;gap:12px;min-height:50px;padding:10px 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}

.chain .v{font-weight:550;text-align:right;font-feature-settings:"tnum"}
.chain .m{font-size:13px;color:var(--muted);text-align:right}
.chain .drop .m{color:var(--signal-ink)}
.chain .older{font-size:13px;color:var(--signal-ink)}
.kw>li{grid-template-columns:minmax(0,1fr) 72px 72px}
.kw .n{text-align:right;font-feature-settings:"tnum"}
.kw .m{font-size:13px;color:var(--muted);text-align:right}
.week>li{grid-template-columns:40px minmax(0,1fr) auto}
.week .d{font-size:13px;color:var(--muted);font-weight:500}
.week .tt{min-width:0;text-align:left;display:block;width:100%}
.week .tt b{display:block;font-weight:500}
.week .tt small{display:block;font-size:13px;color:var(--muted)}
.week .open .tt b{color:var(--faint);font-weight:400}
.word{font-size:13px;color:var(--muted);white-space:nowrap}
.word.live{color:var(--signal-ink)}
.word.ok{color:var(--ok)}
.take>li{grid-template-columns:minmax(0,1fr) auto}
.take b{display:block;font-weight:500}
.take small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.take a{color:inherit;text-underline-offset:2px}
.tabs{display:flex;gap:4px;margin-bottom:28px}
.tabs button{height:30px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--hover);color:var(--ink)}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.field{height:40px;flex:1;min-width:170px;padding:0 13px;border-radius:11px;border:0;background:var(--hover);outline-offset:0}
.field::placeholder{color:var(--muted)}
.line-link{color:var(--muted);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
@media (hover:hover){.line-link:hover{color:var(--ink)}}

/* the reel's path on Today */
.path{display:flex;gap:4px;margin-top:48px}
.path li{flex:1;min-width:0;font-size:12.5px;color:var(--faint)}
.path li::before{content:"";display:block;height:3px;border-radius:2px;background:var(--line);margin-bottom:7px}
.path .done{color:var(--muted)}.path .done::before{background:var(--ink)}
.path .now{color:var(--ink);font-weight:550}.path .now::before{background:var(--signal)}

/* cook */
.cook{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:44px;align-items:start}
@media (max-width:760px){.cook{grid-template-columns:1fr;gap:28px}.cook .reel{width:150px}}
.steps{margin-top:30px;display:grid;gap:7px}
.steps li{display:grid;grid-template-columns:18px auto minmax(0,1fr);gap:10px;align-items:center;font-size:14.5px;color:var(--faint)}
.steps .mark{width:18px;height:18px;display:grid;place-items:center}
.steps .mark::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.steps .done{color:var(--muted)}
.steps .done .mark::before{content:"";width:9px;height:5px;background:none;border-radius:0;border-left:1.8px solid var(--ink);border-bottom:1.8px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.steps .now{color:var(--ink);font-weight:550}
.steps .now .mark::before{background:var(--signal);width:8px;height:8px;animation:breathe 1.6s ease-in-out infinite}
.steps .stuck .mark::before{background:var(--signal);animation:none;width:8px;height:8px}
.steps .stuck{color:var(--ink);font-weight:550}
@keyframes breathe{50%{opacity:.35}}
.steps small{font-size:12.5px;color:var(--muted);font-weight:400}
.reel{container-type:inline-size;aspect-ratio:9/16;width:100%;border-radius:16px;background:var(--shape);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.reel .art{position:absolute;inset:0;background:var(--reel);color:var(--reel-ink);padding:8cqw;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .4s linear}
.reel.has .art{opacity:1}
.reel .hook{font-size:10cqw;line-height:1.14;font-weight:650;letter-spacing:-.015em}
.reel .cap{align-self:center;font-size:6.2cqw;font-weight:600;padding:.3em .6em;white-space:nowrap;border-radius:6px;background:var(--signal);color:#201c2b}
.reel .scrub{height:3px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.reel .scrub i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:scrub 12s linear infinite}
@keyframes scrub{from{transform:scaleX(0)}}
.reel .wm{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12.5px;color:var(--muted);padding:0 12px}

/* first-visit fill: same DOM, so the shape is reserved by construction */
.filling .t,.filling h1 .t{color:transparent!important;background:var(--shape);border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.filling .btn{color:transparent!important;background:var(--shape)!important;box-shadow:none}
.filling a,.filling small,.filling .word,.filling .m,.filling .d{color:transparent!important}
.t{transition:color .18s linear,background-color .18s linear}

/* live sentence */
.swap{animation:swap .2s var(--ease-out)}
@keyframes swap{from{opacity:0;transform:translateY(3px)}}

/* sheets: open out of the row that asked, the rest fades */
#scrim{position:absolute;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:clamp(16px,7vh,64px) 16px 16px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .16s linear}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{width:100%;max-width:600px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px;transform:scale(.97) translateY(6px);opacity:0;transition:transform .14s var(--ease-out),opacity .12s linear}
#sheet.wide{max-width:800px}
#scrim.on #sheet{transform:none;opacity:1;transition:transform .24s var(--ease-sheet),opacity .14s linear}
#sheet h1{font-size:26px}
#sheet .status>.slot{width:72px;height:72px;margin-top:-6px}
#sheet .status{grid-template-columns:72px minmax(0,1fr);gap:0 16px}
#sheet .status.big{display:block}
#sheet .status.big>.slot{width:180px;height:180px;margin:0 auto}
#sheet .sub{font-size:15px}
.x{position:absolute;right:14px;top:14px}
#sheet{position:relative;outline:0}
.change>li{grid-template-columns:24px minmax(0,1fr);align-items:start}
.change input{appearance:none;width:20px;height:20px;margin:1px 0 0;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--faint);cursor:pointer;display:grid;place-items:center;transition:background-color .1s linear}
.change input:checked{background:var(--ink);box-shadow:none}
.change input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.change input:disabled{opacity:.4;cursor:default}
.change b{display:block;font-weight:500}
.change small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.change .flag{color:var(--signal-ink)}
.g2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:640px){.g2{grid-template-columns:1fr}.g2 .reel{width:140px}#sheet{padding:22px 18px}}
.ticks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:5px 0;font-size:14.5px}
.tick{width:18px;height:18px;display:grid;place-items:center}
.tick::before{content:"";width:9px;height:5px;border-left:1.8px solid var(--ok);border-bottom:1.8px solid var(--ok);transform:rotate(-45deg) translate(1px,-1px)}
.tick.warn::before{width:7px;height:7px;border:0;border-radius:50%;background:var(--signal);transform:none}
.caption{font-size:14.5px;padding:12px 14px;border-radius:12px;background:var(--hover);margin-top:14px}
.setrow{grid-template-columns:18px minmax(0,1fr) auto}
.setrow small{display:block;font-size:13.5px;color:var(--muted)}
.setrow b{font-weight:500;display:block}

/* drawer: the workspace lives behind this one door */
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);z-index:55;background:var(--surface);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .2s var(--ease-out);display:flex;flex-direction:column;visibility:hidden}
#drawer.on{transform:none;visibility:visible;transition:transform .26s var(--ease-sheet)}
#drawer header{display:flex;align-items:center;padding:10px 12px 10px 16px;gap:6px}
#drawer .tabs{margin:0;flex:1}
.dbody{flex:1;overflow:auto;padding:6px 18px 18px;font-size:14.5px}
.dbody .said{padding:8px 0;border-top:1px solid var(--line)}
.dbody .said:first-child{border:0}
.dbody .who{font-size:12px;color:var(--muted);font-weight:550;display:block}
.term{font:12.5px/1.55 var(--mono);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.term b{color:var(--ink);font-weight:400}
.dform{display:flex;gap:8px;padding:12px 16px 16px}

/* mascot: one character that moves between places */
#mascot{position:fixed;left:0;top:0;z-index:5;pointer-events:none;transform-origin:0 0;will-change:transform}
#mascot.fly{transition:transform .38s var(--ease-sheet)}
#mascot.grab{pointer-events:auto;cursor:pointer}
html.no3d #mascot{display:none}
html.no3d .slot{border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffd69e,#ff8fa5);transform:scale(.6)}

/* ---- walkthrough dock: not part of the app ---- */
#dock{flex:none;z-index:90;background:var(--dock);color:var(--dock-ink);padding:9px 16px 10px;display:grid;gap:7px;font-size:13px;position:relative;border-top:1px solid var(--line)}
.dk{display:flex;align-items:center;gap:10px;min-width:0}
.lab{font:10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--dock-muted);flex:none}
#play{height:30px;padding:0 13px 0 10px;border-radius:9px;background:var(--dock-ink);color:var(--dock);font-weight:600;display:inline-flex;align-items:center;gap:7px;flex:none}
#play svg{width:11px;height:11px}
.stepb{width:28px;height:28px;border-radius:8px;font-size:17px;line-height:1;flex:none}
@media (hover:hover){.stepb:hover{background:var(--hover)}}
#dots{display:flex;gap:4px;flex:none}
#dots button{width:7px;height:7px;border-radius:9px;background:var(--dock-muted);opacity:.35}
#dots button.seen{opacity:.7}
#dots button.on{width:18px;opacity:1;background:var(--signal)}
#more{display:none;height:30px;padding:0 10px;border-radius:8px;background:var(--hover);align-items:center;flex:none;font-size:12.5px}
#cap{flex:1;min-width:0;font:14px/1.35 -apple-system,"SF Pro Text","Segoe UI",sans-serif}
.pick{height:30px;border-radius:8px;border:0;background:var(--hover);color:inherit;font:inherit;padding:0 6px;flex:none;max-width:190px}
.pills{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;min-width:0}
.pills::-webkit-scrollbar{display:none}
.pills button{height:24px;padding:0 8px;border-radius:7px;font-size:12.5px;white-space:nowrap;color:var(--dock-muted);flex:none}
.pills button[aria-pressed="true"]{background:var(--dock-ink);color:var(--dock)}
.pills button:disabled{opacity:.35;cursor:default}
.sep{width:1px;height:16px;background:var(--line);flex:none}
.grow{flex:1}
@media (max-width:820px){

}

.jobline b{font-weight:500;color:var(--ink)}
@media (max-width:560px){body[data-job="1"] .jobline{display:flex}}

/* fake cursor */
#cursor{position:fixed;left:0;top:0;z-index:100;pointer-events:none;width:22px;height:22px;opacity:0;transition:opacity .2s linear,transform .62s var(--ease-sheet);transform:translate(50vw,40vh)}

#cursor svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}

@keyframes tap{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.2)}}

  #cursor{transition:opacity .01ms}
}

const VS = `
attribute vec3 dir;
uniform float uTime, uWobble;
varying vec3 vDir, vN, vV;
void main(){

uniform vec3 uTop, uMid, uBottom, uRim;
uniform sampler2D uFace;
uniform float uFaceOn, uGlow;
varying vec3 vDir, vN, vV;
void main(){

    this.magnifier.visible = pose === 'finding';
    if (this.magnifier.visible) this.magnifier.position.y = 0.18 + (R ? 0 : 0.04 * Math.sin(ft * 1.3));
    this.bulb.visible = pose === 'explaining';
    if (this.bulb.visible) this.bulb.position.y = 1.12 + (R ? 0 : 0.04 * Math.sin(ft * 2));
    this.nubR.visible = pose === 'greeting' || pose === 'thinking' || pose === 'cheering';
    this.nubL.visible = pose === 'cheering';

    if (pose === 'thinking') this.nubR.position.set(0.3, -0.55 + (R ? 0 : 0.015 * Math.sin(ft * 2)), 0.86);

    { go: ['pull', 'limited', 1], at: 'act-queue', cap: 'Không có lịch tự chạy. Anh hẹn đúng một lần, và app nói rõ "Only this once".', expect: 'pull/queued' },
    { go: ['cook', 'limited', 3], dwell: 2800, cap: 'Hết gói Claude: app không tự gọi model, nên nói thẳng và chờ gói của anh.' },
    { go: ['cook', 'empty', 3], dwell: 2600, cap: 'Trống: linh vật ngủ, giữ nguyên câu hay nhất của Lead.' },
    { go: ['cook', 'empty', 1], at: 'act-open-plan', cap: 'Một nút tới đúng nơi cần tới.', expect: 'plan/normal' },
    { go: ['plan', 'normal', 1], at: 'settings-open', cap: 'Sources và Agents vào Settings. Bảng dấu tick, chỉ dòng cần sửa mới có nút.', after: () => !!$('[data-testid="sources"]') },
    { need: ['plan', 'normal', 1, null, 'settings'], at: 'act-open-workspace', cap: 'Toàn bộ Terminal, file, trình duyệt nằm sau một cánh cửa này. Làm reel thì không bao giờ phải mở.', after: () => !!$('[data-testid="terminal"]') },
  ] },
];
let J = 0, Si = 0, playing = false, run = 0, stepTimer;
const cursor = $('#cursor');
JOURNEYS.forEach((j, i) => { const o = document.createElement('option'); o.value = i; o.textContent = j.name; $('#journey').append(o); });
const failures = window.__tourFailures = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function drawDots() {
  const d = $('#dots'); d.innerHTML = '';
  JOURNEYS[J].steps.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', `Bước ${i + 1}`); b.className = (i === Si ? 'on' : i < Si ? 'seen' : ''); b.dataset.testid = 'tour-dot'; b.onclick = () => { pauseTour(); gotoStep(i); }; d.append(b); });
}
function setPlayUI() {
  $('#playTx').textContent = playing ? 'Pause' : 'Play';
  $('#playIc').innerHTML = playing ? '<path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/>' : '<path d="M2 1l9 5-9 5z" fill="currentColor"/>';
  document.body.dataset.playing = playing ? '1' : '';
}
function pauseTour() { if (!playing) return; playing = false; run++; clearTimeout(stepTimer); setPlayUI(); }
function findEl(id) { return [...document.querySelectorAll(`[data-testid="${id}"]`)].find(e => e.offsetParent !== null || e.getClientRects().length) ; }
function fail(msg) { failures.push(`${JOURNEYS[J].name} / step ${Si + 1}: ${msg}`); console.error('TOUR FAIL', msg); }
async function moveTo(el, my) {
  el.scrollIntoView({ block: 'nearest' });
  await sleep(30);
  const r = el.getBoundingClientRect();
  cursor.classList.add('on');
  cursor.style.transform = `translate(${r.left + r.width / 2}px,${r.top + r.height / 2}px)`;
  await sleep(matchMedia('(prefers-reduced-motion: reduce)').matches ? 40 : 640);
  return my === run;
}
async function gotoStep(i, auto) {
  const my = ++run;
  clearTimeout(stepTimer);
  Si = i;
  const st = JOURNEYS[J].steps[i];
  drawDots();
  $('#cap').textContent = st.cap;
  if (st.need && (document.body.dataset.at !== st.need[0] + '/' + st.need[1] || (st.need[3] && A.job?.kind !== st.need[3]) || (st.need[4] && A.sheetKind !== st.need[4]))) {
    const [s, state, stage, job, kind] = st.need;
    A.stage = stage; A.job = null; A.drawer = null; A.sheetKind = null;
    if (job) startJob(job);
    setState(s, state, { leave: true });
    if (kind) { A.sheetKind = kind; renderSheet(); placeMascot(); }
  }
  if (st.go) {
    const [s, state, stage] = st.go;
    A.job = null; A.drawer = null; A.sheetKind = null;
    if (stage) A.stage = stage;
    if (s === 'gate1') A.kept = [true, true, true];
    setState(s, state);
  }
  await sleep(auto ? 520 : 240);
  if (my !== run) return;
  if (st.at) {
    const el = findEl(st.at);
    if (!el) { fail(`no element ${st.at} at ${A.s}/${A.st}`); }
    else {
      if (!(await moveTo(el, my))) return;
      cursor.classList.remove('tap'); void cursor.offsetWidth; cursor.classList.add('tap');
      await sleep(90);
      if (my !== run) return;
      el.click();
      await sleep(60);
      if (st.expect && document.body.dataset.at !== st.expect && !(st.settle && document.body.dataset.at === st.settle)) fail(`expected ${st.expect}, at ${document.body.dataset.at}`);
      if (st.after && !st.after()) fail('check after click did not hold');
      if (st.settle) { const end = performance.now() + 4000; while (document.body.dataset.at !== st.settle && performance.now() < end) { await sleep(60); if (my !== run) return; } if (document.body.dataset.at !== st.settle) fail(`never settled on ${st.settle}`); }
    }
  } else if (st.after && !st.after()) fail('check did not hold');
  document.body.dataset.stepDone = `${J}:${i}`;
  if (playing && my === run) {
    stepTimer = setTimeout(() => {
      if (Si + 1 < JOURNEYS[J].steps.length) gotoStep(Si + 1, true);
      else { playing = false; setPlayUI(); document.body.dataset.tourEnd = String(J); cursor.classList.remove('on'); }
    }, st.dwell || 1700);
  }
}
$('#play').onclick = () => { if (playing) return pauseTour(); playing = true; setPlayUI(); gotoStep(Si >= JOURNEYS[J].steps.length - 1 ? 0 : Si, true); };
$('#prev').onclick = () => { pauseTour(); gotoStep(Math.max(0, Si - 1)); };
$('#next').onclick = () => { pauseTour(); gotoStep(Math.min(JOURNEYS[J].steps.length - 1, Si + 1)); };
$('#journey').onchange = e => { pauseTour(); J = +e.target.value; Si = 0; drawDots(); gotoStep(0); };
/* anyone touching the app takes it back from the cursor */
$('#app').addEventListener('pointerdown', e => { if (e.isTrusted) { pauseTour(); cursor.classList.remove('on'); } }, true);

window.__lead = { A, setDemo, JOURNEYS, setJourney: i => { J = i; Si = 0; drawDots(); }, gotoStep, play: () => { if (!playing) $('#play').click(); } };
$('#cap').textContent = 'Bấm Play để xem cả vòng, hoặc tự bấm thử. Hàng dưới mở thẳng bất kỳ màn và trạng thái nào.';
drawDots(); setPlayUI();
render();
bootMascot();
</script>
