<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Studio Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f0; --surface:#fff; --sunk:#e9e9e6; --ink:#17171a; --mid:#5c5c66; --faint:#8d8d97;
  --line:rgba(20,20,30,.09); --line2:rgba(20,20,30,.16);
  --you:#d9502a; --you-soft:rgba(217,80,42,.1); --run:#3f5bd0; --run-soft:rgba(63,91,208,.12);
  --bad:#c22f53; --bad-soft:rgba(194,47,83,.1); --lim:#96640f; --lim-soft:rgba(150,100,15,.12); --ok:#23805a;
  --clip:#d9d9d5; --clip-ink:#3a3a42;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 12px 32px -18px rgba(20,20,30,.22);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --text:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --surface:#17181b; --sunk:#1e1f23; --ink:#f2f2f4; --mid:#a3a4ae; --faint:#73747f;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --you:#ff8a66; --you-soft:rgba(255,138,102,.14); --run:#93a9ff; --run-soft:rgba(147,169,255,.15);
  --bad:#ff8ca4; --bad-soft:rgba(255,140,164,.13); --lim:#efbb62; --lim-soft:rgba(239,187,98,.13); --ok:#7fd8aa;
  --clip:#2b2c31; --clip-ink:#c8c8d0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17181b; --sunk:#1e1f23; --ink:#f2f2f4; --mid:#a3a4ae; --faint:#73747f;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --you:#ff8a66; --you-soft:rgba(255,138,102,.14); --run:#93a9ff; --run-soft:rgba(147,169,255,.15);
  --bad:#ff8ca4; --bad-soft:rgba(255,140,164,.13); --lim:#efbb62; --lim-soft:rgba(239,187,98,.13); --ok:#7fd8aa;
  --clip:#2b2c31; --clip-ink:#c8c8d0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--text);word-spacing:.05em;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--run);outline-offset:2px}
h1,h2,h3,p{margin:0}
.time{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}

/* prototype strip: not part of the app */
#proto{flex:none;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 14px;display:flex;flex-direction:column;gap:5px;z-index:30}
.p-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.p-row>*{flex:none}
.p-row>.p-menu{flex:0 1 auto}
#proto button{border-radius:7px;padding:3px 9px;transition:background .12s}
#proto button:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
#proto button:active{transform:scale(.97)}
#proto .on{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.p-play{font-weight:600;background:var(--bg)!important;color:var(--ink);min-width:78px}
.p-name{opacity:.62;margin-right:4px}
.p-j{display:flex;gap:2px}
.p-j button{white-space:nowrap}
.p-dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:320px}
#proto .p-dots button{width:8px;height:8px;border-radius:9px;padding:0;background:color-mix(in srgb,var(--bg) 30%,transparent)}
#proto .p-dots button.on{background:var(--bg);width:18px}
.p-row>.p-sp{flex:1 1 0}
.p-menu{font-family:var(--mono);font-size:12px;opacity:.8;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cap{font-size:14.5px;line-height:1.35;min-height:20px}
#cap:empty{display:none}
#states{position:fixed;left:12px;bottom:54px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:12px;box-shadow:var(--shadow);z-index:40;font-size:12.5px;display:none;max-width:calc(100vw - 24px);overflow:auto}
#states.open{display:block}
#states table{border-collapse:collapse}
#states th{font-weight:500;color:var(--mid);padding:3px 7px;text-align:left}
#states td{padding:1px}
#states td button{width:26px;height:22px;border-radius:5px;background:var(--sunk)}
#states td button:hover{background:var(--line2)}
#states td button.on{background:var(--ink)}

/* app frame */
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#top{flex:none;display:flex;align-items:center;gap:4px;padding:9px 16px 0}
.nav{padding:4px 10px;border-radius:7px;color:var(--faint);font-weight:500;transition:color .12s}
.nav:hover{color:var(--mid)}
.nav.on{color:var(--ink)}
.top-sp{flex:1}
.find{display:flex;align-items:center;gap:7px;color:var(--faint);padding:4px 8px;border-radius:7px;font-size:13px;transition:color .12s}
.find:hover{color:var(--ink)}
kbd{font:500 11px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 4px;min-width:18px;display:inline-block;text-align:center;color:inherit;opacity:.85}

/* the day track */
#track{flex:none;padding:8px 16px 10px;display:flex;gap:10px;align-items:stretch;border-bottom:1px solid var(--line)}
.clips{flex:1;display:flex;gap:3px;min-width:0;position:relative}
.clip{position:relative;height:40px;border-radius:6px;overflow:hidden;text-align:left;padding:4px 8px;min-width:0;display:flex;flex-direction:column;justify-content:center;line-height:1.2;transition:flex-grow .35s var(--out),background .2s,box-shadow .2s;background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.clip:hover{box-shadow:inset 0 0 0 1px var(--mid)}
.clip:active{transform:scale(.99)}
.clip b{position:relative;font-weight:550;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.clip small{position:relative;font:400 10.5px var(--mono);white-space:nowrap;overflow:hidden;opacity:.72}
.clip i{position:absolute;inset:0 auto 0 0;display:block;transition:width .3s linear}
.clip.ahead{box-shadow:inset 0 0 0 1px var(--line2);border:0;color:var(--faint);background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 7px);background-size:100% 5px;background-repeat:no-repeat;background-position:0 100%}
.clip.done{background:var(--clip);color:var(--clip-ink);box-shadow:none}
.clip.you{box-shadow:inset 0 0 0 1.5px var(--you);color:var(--you);background:var(--you-soft)}
.clip.run{box-shadow:inset 0 0 0 1px var(--run);color:var(--run)}
.clip.run i{background:var(--run-soft)}
.clip.run i::after,.clip.long i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 8px,color-mix(in srgb,currentColor 9%,transparent) 8px 12px);background-size:200% 100%;animation:slide 1.3s linear infinite}
@keyframes slide{to{background-position:-26px 0}}
.clip.long{box-shadow:inset 0 0 0 1px var(--lim);color:var(--lim)}
.clip.long i{background:var(--lim-soft);width:100%!important}
.clip .usual{position:absolute;top:0;bottom:0;left:62%;width:0;border-left:1.5px dashed var(--lim)}
.clip.bad{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);background:repeating-linear-gradient(115deg,transparent 0 5px,var(--bad-soft) 5px 9px)}
.clip.bad i{background:var(--clip)}
.clip.bad b,.clip.bad small{color:var(--bad)}
.clip.lim{color:var(--lim);box-shadow:inset 0 0 0 1px var(--lim);background:repeating-linear-gradient(90deg,transparent 0 4px,var(--lim-soft) 4px 6px)}
.clip.lim i{background:var(--clip)}
.clip.ghost{color:var(--mid);box-shadow:none;border:1.5px dashed var(--line2)}
.playhead{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;transition:left .35s var(--out);pointer-events:none;z-index:2}
.playhead::before{content:"";position:absolute;top:-1px;left:-3px;width:8px;height:6px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
.anchor{flex:none;width:134px;border-radius:6px;background:var(--ink);color:var(--bg);padding:4px 10px;display:flex;flex-direction:column;justify-content:center;line-height:1.2;text-align:left}
.anchor:active{transform:scale(.98)}
.anchor b{font-weight:550;font-size:12.5px}
.anchor small{font:400 10.5px var(--mono);opacity:.75}

/* main */
#main{flex:1;min-height:0;overflow:auto;position:relative;overflow-x:clip;scrollbar-width:thin}
#view{min-height:100%}
.page{max-width:780px;margin:0 auto;padding:30px 24px 48px;animation:viewin .16s var(--out)}
.page.wide{max-width:1000px}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}}
#mascot{position:absolute;left:0;top:0;width:360px;height:360px;pointer-events:none;transform-origin:0 0;z-index:3;transition:transform .5s cubic-bezier(.3,1.25,.5,1)}
#mascot canvas{width:360px;height:360px;display:block}
#mascot.nogl::before{content:"";position:absolute;inset:60px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffd69e,#ff8fa5)}
.slot{display:block;flex:none;border-radius:50%;cursor:pointer;background:none}
.head{display:flex;gap:22px;align-items:center;margin-bottom:22px}
h1{font:520 clamp(26px,3.4vw,38px)/1.1 var(--display);letter-spacing:-.022em;text-wrap:balance;font-variation-settings:"opsz" 60}
h1.small{font-size:24px}
h1[data-k]{animation:titlein .22s var(--out)}
.sub{color:var(--mid);margin-top:4px}

/* the one card */
.card{background:var(--surface);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:26px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;margin-bottom:6px}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.k-you .tag{color:var(--you)} .k-run .tag{color:var(--run)} .k-long .tag{color:var(--lim)} .k-bad .tag{color:var(--bad)} .k-lim .tag{color:var(--lim)} .k-ghost .tag{color:var(--mid)} .k-rest .tag{color:var(--ok)}
.k-run .tag::before{animation:breathe 1.4s ease-in-out infinite}
.k-you .tag::before{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35;transform:scale(.8)}}
.card h2{font:520 22px/1.2 var(--display);letter-spacing:-.012em;animation:titlein .22s var(--out)}
@keyframes titlein{from{opacity:0;transform:translateY(3px)}}
.card p{color:var(--mid);margin-top:5px;max-width:58ch}
.meta{margin-top:6px;color:var(--mid);display:block}
.rows{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;margin-top:12px;font-size:14px}
.rows dt{font:500 11px/1.9 var(--mono);letter-spacing:.05em;color:var(--faint)}
.rows dd{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.btn{height:36px;padding:0 14px;border-radius:9px;font-weight:550;display:inline-flex;align-items:center;gap:8px;transition:transform .1s var(--out),background .12s,border-color .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--bg))}
.btn.primary kbd{border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.btn.quiet{color:var(--mid);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.quiet:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:7px}
.segs{display:flex;gap:3px;margin-top:13px}
.segs span{flex:1;height:4px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden;transition:background .25s}
.segs .d{background:var(--ink)}
.segs .c{background:var(--run-soft)}
.segs .c::after{content:"";position:absolute;inset:0;width:40%;background:var(--run);border-radius:4px;animation:go 1.5s ease-in-out infinite alternate}
.segs .x{background:var(--bad)}
@keyframes go{to{transform:translateX(150%)}}
.bar{height:4px;border-radius:4px;background:var(--sunk);margin-top:13px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--run);transition:width .25s linear;border-radius:4px}

/* day list */
.sec{font-size:13px;font-weight:550;color:var(--faint);margin:0 0 4px}
.list{margin-bottom:22px}
.row{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .t{flex:none;width:44px;color:var(--faint)}
.row .w{flex:1;min-width:0}
.row .r{flex:none;color:var(--faint);font-size:13px}
.row.dim .w{color:var(--faint)}
button.row:hover .w{color:var(--ink)}
.chk{color:var(--ok)}

/* week */
.day{border-top:1px solid var(--line);transition:background .12s}
.day:first-child{border-top:0}
.dayh{display:flex;align-items:center;gap:12px;padding:11px 8px;width:100%;text-align:left;border-radius:8px}
.dayh:hover{background:var(--sunk)}
.dayh .d{flex:none;width:92px;color:var(--mid)}
.dayh .w{flex:1;min-width:0;font-weight:500}
.dayh .w.none{color:var(--faint);font-weight:400}
.st{flex:none;font-size:12.5px;color:var(--mid)}
.st.miss{color:var(--you)} .st.cook{color:var(--run)} .st.keep{color:var(--ok)}
.dayb{padding:2px 8px 14px 112px;display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:14px;animation:titlein .18s var(--out)}
.dayb dt{color:var(--faint)} .dayb dd{margin:0}
.sk{display:inline-block;height:.8em;border-radius:4px;background:var(--sunk);vertical-align:baseline;animation:fade 1.2s ease-in-out infinite alternate}
@keyframes fade{to{opacity:.5}}
.fill{animation:titlein .3s var(--out)}

/* numbers */
.num-sec{margin-bottom:34px}
.num-sec h2{font:520 19px/1.2 var(--display);margin-bottom:2px}
.num-sec>p{color:var(--mid);font-size:14px;margin-bottom:10px}
.fun{display:grid;grid-template-columns:150px 74px 1fr 136px;gap:6px 12px;align-items:center;font-size:14px}
.fun .n{text-align:right;font-weight:550;font-variant-numeric:tabular-nums}
.fun .b{height:8px;border-radius:3px;background:var(--sunk);overflow:hidden}
.fun .b i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s var(--out)}
.fun .s{color:var(--faint);font-size:11px;font-family:var(--mono)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px;font-variant-numeric:tabular-nums}
table.t th{text-align:right;font-weight:500;color:var(--faint);padding:4px 8px;font-size:12.5px}
table.t td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tri div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px}
.tri b{display:block;font-weight:550;margin-bottom:2px}
.tri span{color:var(--mid)}
.rv{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rv .h{flex:1;min-width:0}
.pill{font-size:12px;padding:0 7px;border-radius:9px;background:var(--sunk);color:var(--mid);white-space:nowrap}
.pill.new{background:var(--run-soft);color:var(--run)}
.pill.old{background:var(--lim-soft);color:var(--lim)}
.add{display:flex;gap:8px;margin-top:10px}
.field{flex:1;min-width:0;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--line2);padding:0 11px}
.field::placeholder{color:var(--faint)}
.bars{display:flex;align-items:flex-end;gap:3px;height:74px;margin-top:8px}
.bars i{flex:1;background:var(--clip);border-radius:2px 2px 0 0;min-height:2px;transition:height .3s var(--out)}
.bars i.hi{background:var(--you)}

/* review */
.chg{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.chg:first-of-type{border-top:0}
.box{flex:none;width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--line2);margin-top:2px;display:grid;place-items:center;font-size:12px;line-height:1;transition:background .1s}
.chg.on .box{background:var(--ink);color:var(--bg);box-shadow:none}
.chg.held{opacity:.6;cursor:default}
.old{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}

/* cook and watch */
.split{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:26px;align-items:start}
.reel{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--faint);text-align:center;font-size:13.5px;padding:18px}
.reel.ready{background:#faf8f1;color:#25222b;padding:0;animation:titlein .3s var(--out)}
.reel svg{position:absolute;inset:0;width:100%;height:100%}
.reel .cc{position:absolute;left:10%;right:10%;bottom:16%;text-align:center;font:600 18px/1.15 var(--display);color:#25222b}
.reel .cc span{position:absolute;inset:0 0 auto;opacity:0;animation:cc 8s steps(1) infinite}
.reel .cc span:nth-child(2){animation-delay:2s}.reel .cc span:nth-child(3){animation-delay:4s}.reel .cc span:nth-child(4){animation-delay:6s}
@keyframes cc{0%{opacity:1}25%{opacity:0}}
.reel .arm{animation:arm .5s ease-in-out infinite alternate;transform-origin:50% 48%}
@keyframes arm{to{transform:rotate(-7deg)}}
.reel.paused *{animation-play-state:paused}
.reel .vtag{position:absolute;top:8px;left:8px;font:500 11px var(--mono);background:rgba(30,25,40,.8);color:#fff;border-radius:5px;padding:1px 6px}
.cs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:22px}
.cs div{font-size:12.5px;color:var(--faint);padding-top:6px;border-top:3px solid var(--sunk);transition:color .2s,border-color .2s}
.cs .d{color:var(--ink);border-color:var(--ink)}
.cs .c{color:var(--run);border-color:var(--run)}
.cs .x{color:var(--bad);border-color:var(--bad)}
details.work{margin-top:18px;font-size:14px}
details.work summary{cursor:pointer;color:var(--mid);width:max-content}
details.work pre{font:12px/1.6 var(--mono);background:var(--sunk);border-radius:8px;padding:10px 12px;margin:8px 0;overflow:auto;white-space:pre-wrap}
.chips{display:flex;gap:4px;margin-top:6px}
.chips span{flex:1;font-size:11.5px;text-align:center;padding:3px 0;border-radius:4px;background:var(--sunk);color:var(--mid)}
.ck{display:flex;gap:7px;font-size:14px;padding:3px 0}
.ck i{font-style:normal;color:var(--ok)}
.quote{background:var(--sunk);padding:10px 12px;border-radius:9px;font-size:14px;margin:6px 0 14px}

/* settings */
.set{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.set .w{flex:1;min-width:0}
.set small{display:block;color:var(--mid);font-size:13px}
.sw{width:32px;height:19px;border-radius:19px;background:var(--line2);position:relative;transition:background .15s;flex:none;align-self:center}
.sw::after{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .15s var(--out)}
.sw.on{background:var(--ink)}.sw.on::after{transform:translateX(13px)}

/* welcome */
.hello{max-width:560px;margin:0 auto;padding:6vh 24px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;animation:viewin .2s var(--out)}
.hello h1{font-size:clamp(30px,4.2vw,44px);margin-top:6px}
.hello p{color:var(--mid);margin:10px 0 18px;max-width:42ch}
.hello .add{width:min(100%,420px);margin:0}
.link{color:var(--mid);text-decoration:underline;text-underline-offset:3px;margin-top:12px;font-size:14px}
.link:hover{color:var(--ink)}

/* action bar */
#bar{flex:none;height:46px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;font-size:13px;background:var(--bg);position:relative;z-index:5}
.b-st{color:var(--mid);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.toast{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:500;animation:titlein .18s var(--out);flex:1;min-width:0}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{font-weight:550;text-decoration:underline;text-underline-offset:3px}
.b-k{display:flex;align-items:center;gap:6px;color:var(--faint)}
#bar .btn{height:30px;font-size:13px;padding:0 10px}

/* find anything */
#cmd{position:fixed;inset:0;z-index:20;background:rgba(10,10,14,.28);display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 0;animation:fadein .09s linear}
@keyframes fadein{from{opacity:0}}
.cmdbox{width:min(560px,100%);background:var(--surface);border-radius:13px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5);border:1px solid var(--line2);overflow:hidden;animation:cmdin .13s var(--out)}
@keyframes cmdin{from{transform:translateY(-6px) scale(.985);opacity:0}}
.cmdbox input{width:100%;height:48px;border:0;background:none;padding:0 16px;font-size:16px;outline:none;border-bottom:1px solid var(--line)}
.cmdlist{max-height:320px;overflow:auto;padding:5px}
.cmdlist button{display:flex;width:100%;justify-content:space-between;padding:7px 11px;border-radius:7px;text-align:left}
.cmdlist button.sel{background:var(--sunk)}
.cmdlist small{color:var(--faint)}
.cmdlist p{padding:14px 11px;color:var(--mid)}

/* fake cursor */
#cursor{position:fixed;left:0;top:0;width:22px;height:22px;z-index:50;pointer-events:none;opacity:0;transition:transform .55s cubic-bezier(.45,.05,.2,1),opacity .2s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#cursor.on{opacity:1}
#cursor.fast{transition:opacity .2s}
.ripple{position:fixed;width:32px;height:32px;border-radius:50%;margin:-16px;border:2px solid var(--you);z-index:49;pointer-events:none;animation:rip .42s var(--out) forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.2);opacity:0}}

@media (max-width:720px){
  .p-name,.p-menu,.p-row>.p-sp{display:none}
  .p-row{gap:4px;flex-wrap:wrap}
  .p-row>.p-j{order:9;width:100%;flex:none;overflow-x:auto;scrollbar-width:none}
  .p-j button{white-space:nowrap}
  .p-row>.p-dots{flex:1 1 0;min-width:0;gap:3px}
  #proto .p-dots button{width:5px;height:5px}
  #proto .p-dots button.on{width:11px}
  #states{left:6px;right:6px}
  #top{padding:7px 10px 0}.find span{display:none}
  #track{flex-direction:column;padding:6px 10px 8px;gap:4px}
  .clip{height:34px;padding:2px 4px}
  .clip small{display:none}
  .clip b{font-size:10.5px}
  .anchor{width:100%;flex-direction:row;justify-content:space-between;align-items:center;padding:3px 10px}
  .page{padding:18px 16px 36px}
  .head{gap:14px;margin-bottom:14px}
  .slot.big{width:84px!important;height:84px!important}
  h1{font-size:25px}
  .fun{grid-template-columns:minmax(0,1fr) 64px;gap:2px 10px}
  .fun .b,.fun .s{grid-column:1/-1}
  .fun .s{margin-bottom:8px}
  .tri,.split{grid-template-columns:minmax(0,1fr)}
  .split .reel{max-width:210px;margin:0 auto}
  .dayb{padding-left:8px}
  .dayh .d{width:58px}
  .rows{grid-template-columns:82px 1fr;font-size:13.5px}
  .card{padding:15px}
  .card h2{font-size:19px}
  .b-st,.b-k{display:none}
  .toast{font-size:12.5px}
  #bar{justify-content:flex-end}
  .cs div{font-size:11px}
  table.t th,table.t td{padding:5px 3px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div id="proto">
  <div class="p-row">
    <span class="p-name">Prototype</span>
    <button class="p-play" id="play" data-testid="tour-play">▶ Play</button>
    <button id="prev" data-testid="tour-prev" aria-label="Previous step">‹</button>
    <div class="p-dots" id="dots"></div>

    <button id="stBtn" data-testid="states-open">States</button>

  </div>

</div>

<div id="app">
  <header id="top"></header>

  <footer id="bar"></footer>
</div>
<div id="over"></div>
<svg id="cursor" viewBox="0 0 22 22"><path d="M3 2l15 9.5-6.6 1.3L8 19.5z" fill="#17171a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

// ---------- mascot: reused line for line from documents/brand/mascot/index.html ----------
const mq = matchMedia('(prefers-reduced-motion: reduce)');
let REDUCED = mq.matches;
mq.addEventListener('change', e => { REDUCED = e.matches; });
const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const STILL = Q.has('still');
if (STILL) document.documentElement.classList.add('still');
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
const v3 = hex => { const n = parseInt(hex.slice(1), 16); return new THREE.Vector3((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); };

const PALETTES = {
  peach:    { top:'#ffd69e', mid:'#ffb582', bottom:'#ff8fa5', rim:'#ffe9da', orbTop:'#ffc690', orbBottom:'#ff8a66', blush:'255,110,138', shadow:'#ff9f78' },
  mint:     { top:'#e6f9a6', mid:'#a6ee9d', bottom:'#5ed79c', rim:'#eefff2', orbTop:'#d2f8a4', orbBottom:'#6fdc8f', blush:'255,130,150', shadow:'#76d6a2' },
  sky:      { top:'#d3e5ff', mid:'#98bcff', bottom:'#5f86ff', rim:'#eaf2ff', orbTop:'#bcd4ff', orbBottom:'#6a92ff', blush:'255,130,185', shadow:'#7d9cff' },
  lavender: { top:'#f1d9ff', mid:'#c9a4ff', bottom:'#9b72ff', rim:'#f6ecff', orbTop:'#dfbcff', orbBottom:'#a37bff', blush:'255,125,185', shadow:'#a78aff' },
  pink:     { top:'#ffd6df', mid:'#ffa9c2', bottom:'#ff7ba3', rim:'#ffecf1', orbTop:'#ffb8cb', orbBottom:'#ff7397', blush:'255,90,135', shadow:'#ff8fb0' },
};
const COLOR_META = [['peach','Peach','Main (default)'],['mint','Mint','Calm & focus'],['sky','Sky','Professional'],['lavender','Lavender','Creative'],['pink','Pink','Playful']];
const EXPRS = [['normal','Normal'],['happy','Happy'],['excited','Excited'],['curious','Curious'],['thinking','Thinking'],['focused','Focused'],['surprised','Surprised'],['sleeping','Sleeping'],['celebrating','Celebrating']];
const POSES = [['floating','Floating'],['greeting','Greeting'],['thinking','Thinking'],['explaining','Explaining'],['working','Working'],['finding','Finding answers'],['cheering','Cheering']];
const POSE_EXPR = { floating:'normal', greeting:'happy', thinking:'thinking', explaining:'happy', working:'focused', finding:'curious', cheering:'celebrating' };
const ANGLES = [['front','Front',0],['three','3/4 view',0.62],['side','Side view',1.25]];
const STEPS = [
  { pose:'greeting', expr:'happy',       title:'Greeting',    say:'Hi Kai! Ready to help today?' },
  { pose:'thinking', expr:'thinking',    title:'Thinking',    say:'Hmm, let me think this through…' },
  { pose:'working',  expr:'focused',     title:'Working',     say:'Pulling your numbers into a report…' },
  { pose:'cheering', expr:'celebrating', title:'Celebrating', say:'All set! Great progress!' },
];
const STEP_MS = 3200;

// ---------- shared geometry ----------
const B = 0.86; // distance from body centre to its flat-ish bottom
function withDir(g) { g.setAttribute('dir', g.attributes.normal.clone()); return g; }
function blobGeometry() {
  const g = new THREE.SphereGeometry(1, 112, 80);
  const p = g.attributes.position, dir = new Float32Array(p.count * 3), v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    dir.set([v.x, v.y, v.z], i * 3);
    let { x, y, z } = v;
    const s = 1 + 0.08 * (1 - ss(-0.7, 0.45, y)) - 0.045 * ss(0.1, 1, y);   // narrow top, soft wide bottom
    x *= s * 1.03; z *= s * 0.94;
    y = y < 0 ? -0.86 * (-y) * (1.14 - 0.14 * y * y) : 1.0 * y;            // squat, rounded-flat underside
    x += 0.055 * y;                                                        // top leans right, belly bulges left
    p.setXYZ(i, x, y, z);
  }
  g.setAttribute('dir', new THREE.BufferAttribute(dir, 3));
  g.computeVertexNormals();
  return g;
}
const GEO = {
  body: blobGeometry(),
  nub: withDir(new THREE.SphereGeometry(0.2, 40, 28)),
  orb: withDir(new THREE.SphereGeometry(0.155, 40, 28)),
  conf: new THREE.PlaneGeometry(0.05, 0.085),
  shadow: new THREE.PlaneGeometry(1, 1),
};

const VS = `
attribute vec3 dir;
uniform float uTime, uWobble;
varying vec3 vDir, vN, vV;
void main(){
  vDir = dir;
  float w = sin(dir.y*3.1 + uTime*1.6) * sin(dir.x*2.3 + uTime*1.1);
  vec4 mv = modelViewMatrix * vec4(position + normal * w * uWobble, 1.0);
  vV = -mv.xyz;
  vN = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * mv;
}`;
const FS = `
uniform vec3 uTop, uMid, uBottom, uRim;
uniform sampler2D uFace;
uniform float uFaceOn, uGlow;
varying vec3 vDir, vN, vV;
void main(){
  vec3 N = normalize(vN), V = normalize(vV);
  float h = vDir.y;
  vec3 base = mix(uBottom, uMid, smoothstep(-0.95, 0.05, h));
  base = mix(base, uTop, smoothstep(0.1, 0.95, h));
  float wash = smoothstep(0.15, 1.1, -0.55*vDir.x - 0.75*vDir.y + 0.1*vDir.z);
  base = mix(base, uBottom, 0.42*wash);
  vec3 L = normalize(vec3(-0.5, 0.8, 0.6));
  float wrap = clamp((dot(N, L) + 0.8) / 1.8, 0.0, 1.0);
  vec3 col = base * (0.86 + 0.2 * wrap);
  float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.3);
  col = mix(col, uRim, fres * (0.5 + 0.3*uGlow));
  col += uBottom * 0.10 * smoothstep(-0.2, -1.0, N.y);
  vec3 H = normalize(L + V);
  float nh = max(dot(N, H), 0.0);
  vec3 spec = vec3(1.0, 0.98, 0.95) * (pow(nh, 14.0) * 0.06 + pow(nh, 70.0) * 0.08);
  col += spec;
  // sample outside any branch so mip selection stays smooth; mask to the front half
  vec2 uv = vec2(atan(vDir.x, vDir.z) * 0.5 + 0.5, asin(clamp(vDir.y, -1.0, 1.0)) + 0.5);
  vec4 f = texture2D(uFace, uv) * uFaceOn * smoothstep(0.05, 0.25, vDir.z);
  col = col * (1.0 - f.a) + f.rgb + spec * 1.6 * f.a;
  gl_FragColor = vec4(col, 1.0);
}`;

// ---------- shared sprite textures ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const FONT = '"SF Pro Rounded",ui-rounded,"Nunito","Varela Round",system-ui,sans-serif';
const TEX = {
  q: canvasTex(128, 128, (x) => { x.fillStyle = '#8b87f3'; x.font = `800 112px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', 64, 70); }),
  z: canvasTex(128, 128, (x) => { x.fillStyle = '#7f8bf2'; x.font = `800 104px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('z', 64, 62); }),
  shadow: canvasTex(128, 128, (x) => { const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); }),
};
const dashTex = {};
function dash(color) {
  return dashTex[color] ||= canvasTex(128, 32, (x) => { x.strokeStyle = color; x.lineWidth = 15; x.lineCap = 'round'; x.beginPath(); x.moveTo(14, 16); x.lineTo(114, 16); x.stroke(); });
}

// ---------- shared prop materials ----------
const MAT = {
  lap: new THREE.MeshStandardMaterial({ color: '#626a96', roughness: 0.38, metalness: 0.2 }),
  lapDark: new THREE.MeshStandardMaterial({ color: '#434a72', roughness: 0.55 }),
  logo: new THREE.MeshStandardMaterial({ color: '#9aa1cc', roughness: 0.3 }),
  ring: new THREE.MeshStandardMaterial({ color: '#2d355c', roughness: 0.3, metalness: 0.3 }),
  glass: new THREE.MeshBasicMaterial({ color: '#e4f2ff', transparent: true, opacity: 0.32, depthWrite: false }),
  bulb: new THREE.MeshStandardMaterial({ color: '#ffe08a', emissive: '#ffbe3d', emissiveIntensity: 0.65, roughness: 0.25 }),
  neck: new THREE.MeshStandardMaterial({ color: '#c9c2d9', roughness: 0.4, metalness: 0.2 }),
  conf: new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }),
};
const CONF_COLORS = ['#ff9f6e', '#9b8cf5', '#5ccfa0', '#ffc94d', '#ff7ea1', '#6aa5ff'].map(c => new THREE.Color(c));

function sprite(tex, w, h = w) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(w, h, 1); return s;
}
// little radiating dashes, like the "!" marks on the boards
function burst(color, cx, cy, pts) {
  const g = new THREE.Group();
  for (const [x, y, len = 0.17] of pts) {
    const s = sprite(dash(color), len, len / 4);
    s.material.rotation = Math.atan2(y - cy, x - cx);
    s.position.set(x, y, 0.3); s.userData.base = [x, y, cx, cy]; g.add(s);
  }
  return g;
}

let THEME_DARK = false;
const allMascots = new Set();

// ---------- the mascot ----------
class Mascot {
  constructor({ faceSize = 512, hero = false, faceless = false } = {}) {
    this.hero = hero; this.faceless = faceless;
    this.group = new THREE.Group();
    this.root = new THREE.Group(); this.group.add(this.root);
    this.squash = new THREE.Group(); this.squash.position.y = -B; this.root.add(this.squash);
    this.turn = new THREE.Group(); this.turn.position.y = B; this.squash.add(this.turn);

    this.fc = document.createElement('canvas'); this.fc.width = faceSize; this.fc.height = faceSize / 2;
    this.fx = this.fc.getContext('2d');
    this.faceTex = new THREE.CanvasTexture(this.fc);
    this.faceTex.premultiplyAlpha = true; this.faceTex.colorSpace = THREE.NoColorSpace;
    if (hero) { this.faceTex.generateMipmaps = false; this.faceTex.minFilter = THREE.LinearFilter; }
    else this.faceTex.anisotropy = 4;

    const U = this.u = {
      uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() }, uRim: { value: new THREE.Vector3() },
      uFace: { value: this.faceTex }, uFaceOn: { value: faceless ? 0 : 1 }, uGlow: { value: 0 }, uTime: { value: 0 }, uWobble: { value: 0.012 },
    };
    const mat = u => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: FS });
    this.body = new THREE.Mesh(GEO.body, mat(U)); this.turn.add(this.body);

    const nubU = { ...U, uFace: { value: null }, uFaceOn: { value: 0 }, uWobble: { value: 0 } };
    const nubMat = mat(nubU);
    this.nubR = new THREE.Mesh(GEO.nub, nubMat); this.nubL = new THREE.Mesh(GEO.nub, nubMat);
    this.nubR.scale.set(1, 0.86, 0.9); this.nubL.scale.copy(this.nubR.scale);
    this.turn.add(this.nubR, this.nubL);

    this.ou = { ...U, uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() }, uFace: { value: null }, uFaceOn: { value: 0 }, uWobble: { value: 0 } };
    this.orb = new THREE.Mesh(GEO.orb, mat(this.ou)); this.group.add(this.orb);

    this.shadowMat = new THREE.MeshBasicMaterial({ map: TEX.shadow, transparent: true, depthWrite: false, opacity: 0.5 });
    this.shadow = new THREE.Mesh(GEO.shadow, this.shadowMat);
    this.shadow.rotation.x = -Math.PI / 2; this.shadow.position.y = -B - 0.06; this.group.add(this.shadow);

    this.buildProps();
    this.buildDecor();

    this.s = { expr: 'normal', pose: 'floating', color: 'peach' };
    this.yaw = 0; this.yawTarget = 0; this.tilt = 0;
    this.gaze = { x: 0, y: 0 }; this.gazeTarget = { x: 0, y: 0 };
    this.seed = Math.random() * 100;
    this.nextBlink = 1 + Math.random() * 3; this.blinkAt = -9;
    this.bounceAt = -9; this.popAt = -9; this.happyUntil = -9;
    this.now = 0; this.faceKey = '';
    this.setColor('peach');
    allMascots.add(this);
  }

  buildProps() {
    const lap = this.laptop = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.045, 0.56), MAT.lapDark);
    const lid = new THREE.Group(); lid.position.set(0, 0.02, 0.28); lid.rotation.x = 0.22;
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.56, 0.035), MAT.lap); panel.position.y = 0.28;
    const logo = new THREE.Mesh(new THREE.CircleGeometry(0.045, 24), MAT.logo); logo.position.set(0, 0.3, 0.019);
    lid.add(panel, logo); lap.add(base, lid);
    lap.position.set(0.34, -0.74, 0.98); lap.rotation.y = -0.38;

    const mag = this.magnifier = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.045, 18, 56), MAT.ring);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.25, 40), MAT.glass);
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.36, 18), MAT.ring);
    const d = new THREE.Vector2(0.5, -0.86).normalize();
    handle.position.set(d.x * 0.45, d.y * 0.45, 0); handle.rotation.z = -Math.atan2(d.x, d.y) + Math.PI;
    mag.add(ring, glass, handle);
    mag.position.set(-1.08, 0.18, 0.42); mag.rotation.y = 0.35;

    const bulb = this.bulb = new THREE.Group();
    const glassB = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 24), MAT.bulb);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.07, 0.11, 20), MAT.neck); neck.position.y = -0.17;
    bulb.add(glassB, neck, burst('#ffc14d', 0, 0, [[0, 0.3, 0.13], [-0.25, 0.2, 0.13], [0.25, 0.2, 0.13], [-0.32, -0.02, 0.12], [0.32, -0.02, 0.12]]));
    bulb.position.set(-0.8, 1.12, 0.2);
    this.turn.add(lap, mag); this.root.add(bulb);
  }

  buildDecor() {
    const r = this.root;
    this.q = sprite(TEX.q, 0.36); this.q.position.set(0.98, 1.08, 0.25);
    this.z1 = sprite(TEX.z, 0.2); this.z2 = sprite(TEX.z, 0.32);
    this.sparkR = burst('#ff9f62', 0.62, 0.58, [[0.98, 1.02], [1.16, 0.84], [1.24, 0.6]]);
    this.sparkV = burst('#9d8df6', 0.6, 0.6, [[0.9, 1.08, 0.15], [1.12, 0.92, 0.15]]);
    this.sparkL = burst('#ff9f62', -0.62, 0.58, [[-0.98, 1.0], [-1.18, 0.78], [-1.24, 0.55]]);
    this.wave = burst('#4b5a9e', 0.7, 0.35, [[1.08, 0.72, 0.15], [1.22, 0.52, 0.15]]);
    r.add(this.q, this.z1, this.z2, this.sparkR, this.sparkV, this.sparkL, this.wave);
  }

  initConfetti() {
    const n = 40;
    this.conf = new THREE.InstancedMesh(GEO.conf, MAT.conf, n);
    this.cp = [];
    for (let i = 0; i < n; i++) {
      this.conf.setColorAt(i, CONF_COLORS[i % CONF_COLORS.length]);
      const c = { p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3() };
      this.spawn(c, true); this.cp.push(c);
    }
    this.confDummy = new THREE.Object3D();
    this.group.add(this.conf);
  }
  spawn(c, scatter) {
    const R = Math.random;
    if (scatter) c.p.set((R() - 0.5) * 2.8, R() * 1.9 - 0.4, (R() - 0.5) * 0.8 + 0.2);
    else c.p.set((R() - 0.5) * 0.5, 0.95, 0.2);
    c.v.set((R() - 0.5) * 2.6, 1.8 + R() * 1.8, (R() - 0.5) * 0.9);
    c.r.set(R() * TAU, R() * TAU, R() * TAU);
    c.w.set((R() - 0.5) * 9, (R() - 0.5) * 9, (R() - 0.5) * 9);
  }

  setColor(name) {

    this.u.uTop.value.copy(v3(P.top)); this.u.uMid.value.copy(v3(P.mid)); this.u.uBottom.value.copy(v3(P.bottom)); this.u.uRim.value.copy(v3(P.rim));

    { cap: 'Mở bản kế hoạch: mỗi thay đổi viết bằng chữ thường, kèm lý do. Không còn diff kiểu code.', acts: [['click', P]], want: 'What changes' },
    { cap: 'Bỏ tick một dòng, số trên nút giảm theo ngay: 3 xuống 2.', acts: [['click', sel('change-2')]], want: 'Approve 2 changes' },
    { cap: 'Tick lại đủ 3 rồi duyệt. App về Today ngay, dưới đáy có Undo nếu anh đổi ý.', acts: [['click', sel('change-2')], ['click', P], ['wait', 500]], want: 'Undo' },
    { cap: 'Kế hoạch đã lưu. Reel tối nay sẵn sàng để cook.', acts: [['sim', 1.2]], want: 'ready to cook' },
    { cap: 'Bấm Cook. Tiêu đề đổi theo việc Claude đang làm. YOU CAN cho biết anh được đi chỗ khác.', acts: [['click', P], ['sim', 5]], want: 'YOU CAN' },
    { cap: 'Mở trang Cook để xem: 6 bước, ô video giữ sẵn chỗ. Bản nháp tự lấp vào khi tới bước Draft.', acts: [['click', P], ['sim', 2]], want: 'Script' },
    { cap: 'Cook xong, về Today để xem bước kế: xem bản nháp.', acts: [['sim', 5.2], ['click', sel('nav-today')]], want: 'Watch' },
    { cap: 'Xem reel. Muốn sửa thì gõ một câu, Claude làm lại đúng phần đó và ra bản 2.', acts: [['click', P], ['type', sel('change-input'), 'Make the hook faster'], ['click', sel('change-send')], ['sim', 3]], want: 'Your last note' },
    { cap: 'Duyệt và hẹn đăng 19:30. Con vật ăn mừng. Hôm nay xong việc.', acts: [['click', P], ['sim', 3.2], ['wait', 1200]], want: 'That\'s today' },
    { cap: 'Hết việc thì con vật đi ngủ. Reel tự đăng lúc 19:30, anh đi làm việc khác.', acts: [['nap']], want: 'Nothing needs you' },
  ] },
  { id: 'first', name: 'Lần mở đầu', steps: [
    { cap: 'Lần đầu mở app: con vật chào, chỉ hỏi đúng một thứ là tên kênh Instagram.', acts: [['view', 'welcome'], ['wait', 900]], want: 'Hi. I\'ll keep' },
    { cap: 'Gõ handle rồi Enter. Con vật bay lên góc, ngày bắt đầu ngay.', acts: [['type', sel('handle'), '@yourchannel'], ['click', P], ['sim', 2]], want: 'Pulling rivals' },
    { cap: 'Nếu chọn "Look around first": trạng thái trống vẫn có một câu và một nút, không phải 8 ô gạch ngang.', acts: [['view', 'welcome'], ['click', sel('secondary')]], want: 'Connect Instagram' },
    { cap: 'Trang Numbers lúc trống giữ sẵn hình dạng, số sẽ lấp đúng vào chỗ đó.', acts: [['click', sel('nav-numbers')]], want: 'not pulled yet' },
  ] },
  { id: 'slow', name: 'Cook lâu rồi lỗi', steps: [
    { cap: 'Đang cook bình thường. Clip đầy dần, không có phần trăm giả.', acts: [['cell', 'cook', 'running'], ['wait', 900]], want: 'so far' },
    { cap: 'Quá giờ thường lệ: clip chạy vượt vạch "usual", con vật ngồi nghĩ. Câu nói thật: chậm, nhưng vẫn chạy.', acts: [['cell', 'cook', 'long'], ['wait', 900]], want: 'usually about 3:00' },
    { cap: 'Nếu lỗi: phần đã xong vẫn đặc trên clip, phần còn lại gạch chéo. Câu đầu tiên nói phần nào còn giữ.', acts: [['cell', 'cook', 'error'], ['wait', 900]], want: 'done and kept' },
    { cap: 'Một nút Resume cook, chạy tiếp từ chỗ dừng chứ không làm lại từ đầu.', acts: [['click', P], ['sim', 2]], want: 'so far' },
    { cap: '"Show the work" là cánh cửa duy nhất tới phần kỹ thuật. Mặc định đóng lại.', acts: [['view', 'cook'], ['open', sel('show-work')]], want: 'Open the full workspace' },
  ] },
  { id: 'limit', name: 'Bị giới hạn', steps: [

    { cap: 'Bấm Stop: chỉ dừng phần còn lại. 3 rival mới vẫn giữ, 10 rival kia giữ số cũ.', acts: [['click', P]], want: 'keep their older numbers' },
    { cap: 'Một nút kéo phần còn lại, đúng số đếm: 10.', acts: [['click', P], ['sim', 1]], want: 'Pulling rivals' },
    { cap: 'Hết hạn mức Instagram: con vật ngủ chờ 08:00. Hai hàng YOU CAN và IF YOU WAIT nói rõ hai đường.', acts: [['cell', 'pull', 'limited'], ['wait', 900]], want: 'IF YOU WAIT' },
    { cap: 'Một nút làm hai việc: bật browser pull và kéo nốt 11 rival.', acts: [['click', P], ['sim', 1.5]], want: 'Pulling rivals' },
  ] },
  { id: 'find', name: 'Trống và ⌘K', steps: [
    { cap: 'Không có gì đang cook: vẫn giữ câu trống hay nhất của Lead, kèm một nút.', acts: [['cell', 'cook', 'empty'], ['wait', 800]], want: 'Nothing is cooking' },
    { cap: 'Nút dẫn sang Week, nơi anh chọn reel. Bấm một dòng để mở chi tiết.', acts: [['click', P], ['click', sel('day-3')]], want: 'Caption template' },
    { cap: '⌘K mở ra ngay. Mọi thứ khác nằm ở đây, gồm cả workspace cũ.', acts: [['click', sel('find')], ['type', sel('cmd-input'), 'work']], want: 'Open the full workspace' },
    { cap: 'Enter là chạy. Bàn phím và chuột làm được như nhau.', acts: [['click', sel('cmd-item')]], want: 'Opens the full workspace' },
  ] },
];
const capEl = document.getElementById('cap'), dotsEl = document.getElementById('dots'), cursor = document.getElementById('cursor');
let J = JOURNEYS[0], stepI = -1, playing = false, token = 0, tourClick = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const need = q => { const el = document.querySelector(q); if (!el) throw new Error(`walkthrough: no element for ${q} in ${J.id} step ${stepI + 1}`); return el; };
async function moveTo(el) {
  el.scrollIntoView({ block: 'nearest' });
  const r = el.getBoundingClientRect(), x = r.left + Math.min(r.width / 2, 60), y = r.top + r.height / 2;
  cursor.classList.add('on'); cursor.style.transform = `translate(${x}px,${y}px)`;
  await sleep(600); return [x, y];
}
function doClick(el) { tourClick = true; el.click(); tourClick = false; }
async function act(a, anim, my) {
  const [op, x, y] = a;
  if (op === 'wait') { if (anim) await sleep(x); return; }
  if (op === 'nap') { S.rested = 2; render(); return; }
  if (op === 'cell') { setCell(x, y); S.hold = true; S.toast = null; render(); return; }
  if (op === 'view') { S.view = x; if (x === 'welcome') { setCell('pull', 'normal'); S.handle = ''; } render(); return; }
  if (op === 'sim') {
    if (!anim) { let left = x; while (left > 0) { tick(.1); left -= .1; } render(); return; }
    const end = performance.now() + x * 450;
    let left = x;
    while (left > 0) { if (my !== token) return; tick(.1); left -= .1; await sleep(Math.max(8, (end - performance.now()) / Math.max(1, left * 10))); }
    return;
  }
  const el = need(x);
  if (op === 'open') { if (anim) { await moveTo(el.querySelector('summary')); } el.open = true; return; }
  if (op === 'click') {
    if (anim) { const [cx, cy] = await moveTo(el); if (my !== token) return; const rp = document.createElement('i'); rp.className = 'ripple'; rp.style.left = cx + 'px'; rp.style.top = cy + 'px'; document.body.append(rp); setTimeout(() => rp.remove(), 450); await sleep(70); }
    doClick(el); return;
  }
  if (op === 'type') {
    if (anim) await moveTo(el);
    el.focus();
    if (anim) { for (let i = 1; i <= y.length; i++) { if (my !== token) return; el.value = y.slice(0, i); el.dispatchEvent(new Event('input', { bubbles: true })); await sleep(36); } }
    else { el.value = y; el.dispatchEvent(new Event('input', { bubbles: true })); }
    el.blur(); return;
  }
}
async function rebuild(i) { S = init(); if (J.id === 'first') S.view = 'welcome'; lastMood = ''; render(); for (let k = 0; k < i; k++) for (const a of J.steps[k].acts) await act(a, false); render(); }
function drawDots() {
  dotsEl.innerHTML = J.steps.map((_, i) => `<button class="${i === stepI ? 'on' : ''}" data-dot="${i}" aria-label="Step ${i + 1}"></button>`).join('');
  document.getElementById('play').textContent = playing ? '❚❚ Pause' : '▶ Play';
  document.getElementById('journeys').innerHTML = JOURNEYS.map(j => `<button class="${j.id === J.id ? 'on' : ''}" data-j="${j.id}" data-testid="journey-${j.id}">${j.name}</button>`).join('');
}
async function goStep(i, anim = true) {
  const my = ++token;
  auto = false; stepI = i;
  document.getElementById('cursor').classList.toggle('fast', !anim);
  await rebuild(i);
  drawDots();
  const st = J.steps[i];
  capEl.textContent = st.cap;
  if (anim) cursor.classList.add('on');
  for (const a of st.acts) { await act(a, anim, my); if (my !== token) return false; }
  render();
  window.__tour = { journey: J.id, step: i, want: st.want };
  return true;
}
async function playFrom(i) {
  playing = true; drawDots();
  for (let k = i; k < J.steps.length; k++) {
    const ok = await goStep(k); if (!ok || !playing) return;
    const my = token;
    await sleep(1300 + J.steps[k].cap.length * 32);
    if (my !== token || !playing) return;
  }
  playing = false; auto = true; cursor.classList.remove('on'); drawDots();
}
function pauseTour() { if (!playing) return; playing = false; token++; drawDots(); }
document.getElementById('play').onclick = () => { if (playing) pauseTour(); else playFrom(stepI < 0 || stepI >= J.steps.length - 1 ? 0 : stepI); };
document.getElementById('next').onclick = () => { pauseTour(); goStep(Math.min(J.steps.length - 1, stepI + 1)); };
document.getElementById('prev').onclick = () => { pauseTour(); goStep(Math.max(0, stepI - 1)); };
dotsEl.onclick = e => { const d = e.target.dataset.dot; if (d != null) { pauseTour(); goStep(+d); } };
document.getElementById('journeys').onclick = e => { const id = e.target.dataset.j; if (!id) return; pauseTour(); J = JOURNEYS.find(j => j.id === id); stepI = -1; playFrom(0); };

// test hooks: scripted click-through reads these
window.__proto = { JOURNEYS, C, LOOP, STATES, state: () => S, goStep: (j, i, anim = false) => { pauseTour(); J = JOURNEYS.find(x => x.id === j); return goStep(i, anim); }, leave: () => { pauseTour(); auto = true; cursor.classList.remove('on'); }, reset: (v = 'today') => { S = init(); S.view = v; auto = true; lastMood = ''; render(); }, set: (k, st, v = 'today') => { S = init(); setCell(k, st); S.view = v; S.hold = true; lastMood = ''; render(); }, lead: () => lead };

// ---------- start ----------
if (Q.get('j')) { J = JOURNEYS.find(j => j.id === Q.get('j')) || J; }
S.view = Q.get('view') || 'welcome';
render(); drawDots();
capEl.textContent = '';
</script>
