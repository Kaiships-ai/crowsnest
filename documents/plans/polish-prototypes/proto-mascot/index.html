<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Studio Bean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f4f7;--surface:#fff;--soft:#eeebf0;--line:rgba(40,25,55,.1);--line2:rgba(40,25,55,.18);
  --ink:#231c2c;--muted:#6f6879;--faint:#a29baa;
  --coral:#d9562e;--coral-soft:#fdeee8;--rose:#bf2f4e;--rose-soft:#fbecef;--amber:#99690f;--amber-soft:#f8f1df;--blue:#4a5fc9;--blue-soft:#eceffb;--green:#2b8259;
  --floor:linear-gradient(180deg,rgba(255,255,255,0),#fff 42%);--floorm:linear-gradient(180deg,rgba(255,255,255,0),#fff 12%);--glow:rgba(255,170,130,.5);
  --on-ink:#fff;--shadow:0 1px 2px rgba(40,20,50,.05),0 16px 40px -22px rgba(70,40,70,.3);
  --display:"Gabarito",ui-sans-serif,-apple-system,system-ui,sans-serif;--sans:"Hanken Grotesk",ui-sans-serif,-apple-system,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131118;--surface:#1c1a22;--soft:#26232d;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#f3f0f6;--muted:#a59eaf;--faint:#726c7c;
  --coral:#ff9270;--coral-soft:#35221d;--rose:#ff8ba2;--rose-soft:#351d25;--amber:#e6bc66;--amber-soft:#2f2717;--blue:#a6b5ff;--blue-soft:#20233a;--green:#7bd3a7;
  --floor:linear-gradient(180deg,rgba(19,17,24,0),#1a1820 42%);--floorm:linear-gradient(180deg,rgba(19,17,24,0),#1a1820 12%);--glow:rgba(255,140,100,.2);--on-ink:#17151c;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -22px rgba(0,0,0,.7);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131118;--surface:#1c1a22;--soft:#26232d;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#f3f0f6;--muted:#a59eaf;--faint:#726c7c;
  --coral:#ff9270;--coral-soft:#35221d;--rose:#ff8ba2;--rose-soft:#351d25;--amber:#e6bc66;--amber-soft:#2f2717;--blue:#a6b5ff;--blue-soft:#20233a;--green:#7bd3a7;
  --floor:linear-gradient(180deg,rgba(19,17,24,0),#1a1820 42%);--floorm:linear-gradient(180deg,rgba(19,17,24,0),#1a1820 12%);--glow:rgba(255,140,100,.2);--on-ink:#17151c;--shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -22px rgba(0,0,0,.7);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
h1{font:600 clamp(25px,3vw,34px)/1.12 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font:600 16px/1.3 var(--display);margin:0}
p{margin:0}
.lab{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.mut{color:var(--muted)}.sm{font-size:13.5px}.num{font-variant-numeric:tabular-nums}

/* prototype bar: not part of the app */
#pb{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;position:relative;z-index:60}
#pb select{height:28px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);padding:0 6px;max-width:190px}
.pbtn{height:28px;min-width:28px;border-radius:7px;border:1px solid var(--line2);background:var(--surface);padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.pbtn:active{transform:scale(.96)}
.pplay{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600;padding:0 11px}
#dots{display:flex;gap:5px;align-items:center}
#dots button{width:7px;height:7px;border-radius:9px;background:var(--line2);transition:width .2s var(--ease),background .2s}
#dots button.on{width:18px;background:var(--coral)}
#states{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
#states button{height:28px;padding:0 10px;border-radius:7px;color:var(--muted);white-space:nowrap}
#states button:hover{color:var(--ink)}
#states button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line2)}
#cap{position:fixed;left:50%;top:58px;transform:translate(-50%,-6px);z-index:70;max-width:min(620px,calc(100vw - 32px));width:max-content;background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:12px;font-size:14.5px;line-height:1.4;opacity:0;transition:opacity .18s,transform .18s var(--ease);pointer-events:none;text-wrap:pretty}
#cap.on{opacity:1;transform:translate(-50%,0)}
#cursor{position:fixed;left:0;top:0;z-index:80;width:22px;height:22px;pointer-events:none;opacity:0;transition:transform .62s cubic-bezier(.45,.05,.2,1),opacity .2s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#cursor.on{opacity:1}
#ripple{position:fixed;z-index:79;width:30px;height:30px;margin:-15px;border-radius:50%;border:2px solid var(--coral);pointer-events:none;opacity:0}
#ripple.go{animation:rip .42s var(--ease)}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.2);opacity:0}}

/* the app */
#app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 24px 0;gap:12px}
.brand{font:600 15px var(--display)}
.ghost{height:32px;padding:0 11px;border-radius:9px;color:var(--muted);font-size:13.5px}
.ghost:hover{background:var(--soft);color:var(--ink)}
#page{position:relative;z-index:16;flex:1;min-height:0;overflow-y:auto;padding:14px 24px 72px;scrollbar-width:thin}
body.touring #page{padding-top:56px}
.col{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head .sm{margin-top:6px;max-width:62ch}
.b{position:relative}
.fill .b::after{content:"";position:absolute;inset:-2px;border-radius:10px;background:var(--soft);pointer-events:none;animation:unveil .24s var(--ease) both;animation-delay:calc(var(--i,0)*28ms + 40ms)}
@keyframes unveil{to{opacity:0;visibility:hidden}}

.btn{height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line2);font-weight:500;background:var(--surface);transition:transform .12s var(--ease),background .15s;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600}
.btn.pri:hover{opacity:.9;background:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* the state card. Same shape in every state, every step */
.card{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:17px 19px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow)}
.card[data-k=running],.card[data-k=long]{border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.card[data-k=error]{border-color:color-mix(in srgb,var(--rose) 45%,var(--line))}
.card[data-k=limited]{border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.card .hd{font:600 17.5px/1.25 var(--display);text-wrap:balance}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:14px}
.card dt{font:500 11px/1.9 var(--mono);letter-spacing:.06em;color:var(--faint);white-space:nowrap}
.card dd{margin:0}
.bar{height:5px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--blue);width:calc(var(--p,0)*100%);transition:width .3s linear}
.card[data-k=long] .bar i{background:linear-gradient(90deg,var(--blue),var(--blue) 60%,color-mix(in srgb,var(--blue) 50%,transparent));background-size:200% 100%;animation:drift 2.8s linear infinite}
@keyframes drift{from{background-position:200% 0}to{background-position:0 0}}

/* empty and first open: Bean comes up off the track */
.seat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:6px 0 10px;margin-top:clamp(0px,7vh,80px)}
.seat .spot{width:230px;height:200px}
.seat.nobean .spot{height:12px}
.seat .sm{max-width:44ch}
#first{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#first .spot{width:300px;height:290px;flex:none}
#first p{max-width:46ch;color:var(--muted)}
#first ul{list-style:none;padding:0;margin:0;font-size:14px;display:flex;flex-direction:column;gap:3px}
@media (max-height:680px){#first .spot{height:190px}}

/* rows */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);min-height:56px}
.rw .t{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:9px;background:var(--faint)}
.pill.ok::before{background:var(--green)}.pill.run::before{background:var(--blue);animation:pulse 1.2s infinite}.pill.err::before{background:var(--rose)}.pill.lim::before{background:var(--amber)}.pill.you::before{background:var(--coral)}
@keyframes pulse{50%{opacity:.35}}
.seg{display:inline-flex;gap:2px;background:var(--soft);padding:3px;border-radius:10px;align-self:flex-start;max-width:100%}
.seg button{height:30px;padding:0 13px;border-radius:7px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* funnel */
.fn{display:grid;grid-template-columns:150px minmax(0,1fr) 74px;gap:6px 12px;align-items:center;font-size:14px}
.fn .tr{height:22px;border-radius:5px;background:var(--soft);overflow:hidden}
.fn .tr i{display:block;height:100%;min-width:3px;background:color-mix(in srgb,var(--ink) 78%,transparent);border-radius:5px;width:var(--w)}
.fn .tr.old i{background:var(--faint)}
.fn .dropnote{grid-column:2/4;font-size:13px;color:var(--coral);font-weight:500;margin:-2px 0 2px}
.ans{border-left:2px solid var(--coral);padding:2px 0 2px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:5px}
.chart{width:100%;height:150px;display:block;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.thumb{aspect-ratio:9/16;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;color:#fff;font:600 13px/1.2 var(--display);position:relative;overflow:hidden;background:linear-gradient(165deg,var(--h1,#3b2f55),var(--h2,#7a4560))}
.rivalrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* plan */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:12px;color:var(--faint);padding-left:3px}
.day{min-height:86px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;background:var(--surface);display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--faint);text-align:left}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.slot{display:block;width:100%;text-align:left;padding:4px 5px;border-radius:6px;font-size:12px;line-height:1.22;color:var(--ink);background:var(--soft);font-weight:500}
.slot:hover{background:color-mix(in srgb,var(--coral) 16%,var(--soft))}
.slot[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.slot.ghost-slot{background:none;border:1px dashed var(--line2);color:var(--faint);height:34px;animation:pulse 1.4s infinite}
.slot.newfill{animation:popin .3s var(--ease)}
@keyframes popin{from{opacity:0;transform:scale(.96)}}
.detail{border:1px solid var(--line);border-radius:13px;padding:15px;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:start}
.planlist{display:none}

/* approve */
.chg{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.chg s{color:var(--muted)}
.chg.off{opacity:.45}
.kept{color:var(--green);font-size:13px;font-weight:500}

/* cook + publish */
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.segs div{font-size:12.5px;color:var(--faint);display:flex;flex-direction:column;gap:5px}
.segs i{height:5px;border-radius:5px;background:var(--soft)}
.segs .done i{background:var(--ink)}.segs .done{color:var(--ink)}
.segs .cur i{background:var(--blue)}.segs .cur{color:var(--ink);font-weight:600}
.segs .wait i{background:var(--amber)}.segs .wait{color:var(--amber);font-weight:600}
.segs .fail i{background:var(--rose)}.segs .fail{color:var(--rose);font-weight:600}
.cook{display:grid;grid-template-columns:minmax(0,1fr) 214px;gap:22px;align-items:start}
.player{aspect-ratio:9/16;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13px;color:var(--muted);position:relative;overflow:hidden}
.player.has{background:linear-gradient(170deg,#2c2440,#6b3f58 70%,#c26a55);color:#fff;font:600 17px/1.2 var(--display);align-items:flex-end;justify-content:flex-start;text-align:left}
.player .tag{position:absolute;left:10px;top:10px;font:500 10px var(--mono);letter-spacing:.06em;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px}
.player .pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2)}
.player .pg i{display:block;height:100%;background:#fff;animation:pg 9s linear infinite}
@keyframes pg{from{width:0}to{width:100%}}
.field{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:9px 11px}
details.term summary{cursor:pointer;color:var(--muted);font-size:13.5px}
details.term pre{font:12.5px/1.55 var(--mono);background:var(--soft);padding:11px;border-radius:9px;white-space:pre-wrap;margin:8px 0 0}
.script{font-size:14.5px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:5px 10px}
.pub{display:grid;grid-template-columns:214px minmax(0,1fr);gap:24px;align-items:start}

/* the track */
#dock{flex:none;position:relative;z-index:20;display:grid;grid-template-columns:minmax(230px,330px) minmax(0,1fr);align-items:end;gap:18px;padding:0 24px 10px;height:90px;background:var(--floor)}
#say{text-align:left;align-self:end;padding:0 0 3px;min-width:0;border-radius:9px}
#say:hover .a{text-decoration:underline;text-underline-offset:2px}
#say .a{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#say .c{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track{display:flex;position:relative;align-items:flex-start;height:50px}
#track::before{content:"";position:absolute;left:7%;right:7%;top:9px;height:2px;background:var(--line2);border-radius:2px}
.st{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted);height:50px;border-radius:9px;min-width:0}
.st:hover{color:var(--ink)}
.st .d{width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);position:relative;z-index:1;transition:transform .15s var(--ease)}
.st:hover .d{transform:scale(1.25)}
.st[aria-current=page]{color:var(--ink);font-weight:650}
.st[aria-current=page] .d{background:var(--ink);border-color:var(--ink)}
.st .n{position:absolute;top:30px;margin-left:calc(100% - 22%);display:none}
.st[data-mark] .d{border-color:var(--c);background:var(--c)}
.st[data-mark=you]{--c:var(--coral)}.st[data-mark=err]{--c:var(--rose)}.st[data-mark=lim]{--c:var(--amber)}.st[data-mark=run]{--c:var(--blue)}
.st .l{white-space:nowrap}
#dock.beanoff .st[data-here] .d{box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 28%,transparent)}

/* Bean. One canvas, always, that travels */
#bean{position:fixed;left:0;top:0;width:360px;height:360px;z-index:40;transform-origin:0 0;pointer-events:none;will-change:transform}
#bean canvas{width:360px;height:360px;display:block}
#bean .blob{position:absolute;left:68px;top:92px;width:224px;height:200px;border-radius:50% 50% 46% 46%;background:linear-gradient(170deg,#ffd69e,#ffb582 50%,#ff8fa5)}
#beanhit{position:fixed;left:0;top:0;z-index:41;border-radius:50%}
#beanhit:focus-visible{outline-offset:0}
#beanglow{position:fixed;left:0;top:0;width:200px;height:80px;margin:-40px 0 0 -100px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);z-index:15;pointer-events:none}
body.nogl #beanglow{display:none}
.hideb #bean,.hideb #beanhit,.hideb #beanglow{display:none}

/* sheets */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px) scale(.98);transition:opacity .14s,transform .16s var(--ease);pointer-events:none;transform-origin:bottom center}
.pop.on{opacity:1;transform:none;pointer-events:auto}
#sheet{width:min(380px,calc(100vw - 32px));padding:17px 19px;display:flex;flex-direction:column;gap:11px;bottom:134px}
#sheet dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:14px}
#sheet dt{font:500 11px/1.9 var(--mono);letter-spacing:.06em;color:var(--faint)}#sheet dd{margin:0}
#settings{right:16px;top:96px;width:min(420px,calc(100vw - 32px));max-height:calc(100dvh - 210px);overflow:auto;padding:19px;display:flex;flex-direction:column;gap:16px;transform-origin:top right}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.opt button{height:32px;border-radius:7px;color:var(--muted);font-size:13.5px}
.opt button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,6px);background:var(--ink);color:var(--on-ink);padding:8px 8px 8px 14px;border-radius:11px;font-size:14px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .18s var(--ease);z-index:45;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--on-ink);font-weight:600;padding:3px 8px;border-radius:7px;background:rgba(128,128,128,.28)}

@media (max-width:760px){
  #pb{gap:6px;padding:6px 16px}
  #pb select{max-width:118px}
  #states{order:9;width:100%;margin:0}
  #top{padding:8px 16px 0}
  #page{padding:8px 16px 54px}
  #dock{grid-template-columns:minmax(0,1fr);height:130px;gap:0;padding:0 16px 6px;align-content:end;background:var(--floorm)}
  #say{padding:0 0 46px;align-self:start;margin-top:4px}
  #say .a{-webkit-line-clamp:1;white-space:normal}
  #track{height:42px}
  .st{font-size:11px;gap:5px;height:42px}
  .tiles{grid-template-columns:1fr}
  .rivalrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cook,.pub{grid-template-columns:minmax(0,1fr)}
  .cook .player,.pub .player{width:min(190px,60%);margin:0 auto}
  .cal{display:none}.planlist{display:flex}
  .detail{grid-template-columns:minmax(0,1fr)}
  .fn{grid-template-columns:104px minmax(0,1fr) 54px;font-size:13px}
  .chg{grid-template-columns:minmax(0,1fr) auto}.chg .lab{grid-column:1/3}
  #sheet{bottom:142px;left:16px!important}
  #settings{right:16px;top:90px;max-height:calc(100dvh - 240px)}
  #cap{top:92px}
  body.touring #page{padding-top:64px}
  #toast{bottom:140px}
  .seat .spot{height:150px}
  .card{padding:14px}
}
@media (max-width:360px){#pb select{max-width:84px}#pb{gap:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Hallmark self-check: Philosophy 5, Hierarchy 4, Execution 4, Specificity 5, Restraint 4, Variety 5 -->
<div id="pb" aria-label="Prototype controls">
  <select id="jsel" data-testid="journey" aria-label="Journey"></select>
  <button class="pbtn pplay" id="play" data-testid="play"><span id="playI">▶</span> <span id="playT">Play</span></button>
  <button class="pbtn" id="prev" data-testid="prev" aria-label="Previous step">‹</button>
  <div id="dots"></div>
  <button class="pbtn" id="next" data-testid="next" aria-label="Next step">›</button>
  <button class="pbtn" id="theme" data-testid="theme" aria-label="Dark or light">◐</button>
  <div id="states" role="group" aria-label="State of this step"></div>
</div>
<div id="cap" role="status"></div>
<div id="app">
  <div id="top">
    <button class="brand" data-testid="brand" data-go="today">Lead Studio</button>
    <button class="ghost" data-testid="open-settings" data-a="settings">Settings</button>
  </div>
  <main id="page" tabindex="-1"></main>
  <div id="dock">
    <button id="say" data-testid="say" data-a="sheet" aria-haspopup="dialog"><div class="a" id="sayA"></div><div class="c" id="sayC"></div></button>
    <nav id="track" aria-label="The 6 steps"></nav>
  </div>
  <div id="firstwrap"></div>
</div>
<div id="beanglow"></div>
<div id="bean"></div>
<button id="beanhit" data-testid="bean" data-a="sheet" aria-haspopup="dialog"></button>
<div class="pop" id="sheet" role="dialog" aria-label="What Bean is doing"></div>
<div class="pop" id="settings" role="dialog" aria-label="Settings"></div>
<div id="toast" role="status"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11.5-7 1 4 7-3 1.5-4-7.2-5 5z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="ripple"></div>

<script type="module">
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);

/* ---------- fake world ---------- */
const STOPS = [['today','Today'],['pull','Pull'],['insight','Insight'],['plan','Plan'],['approve','Approve'],['cook','Cook'],['publish','Publish']];
const LOOP = STOPS.slice(1);
const STATES = ['normal','running','long','error','empty','limited'];
const REEL = 'Hooks in 30 seconds';
const FUNNEL = [['Reel views',184200,'Instagram','07:00'],['Keyword comments',1240,'Instagram','07:00'],['Got the DM',610,'ChatbotX','06:58'],['Opened the gift page',212,'Umami','06:58'],['Clicked checkout',18,'Umami','06:58'],['Bought',3,'Polar','06:59']];
const SOURCES = [['Instagram','Your reels and followers','07:00'],['13 rivals','Reels that beat their usual','Yesterday 22:10'],['ChatbotX','DMs sent after a keyword','06:58'],['Umami','Gift page visits','06:58'],['Polar','Sales','06:59']];
const SLOTS = {3:[REEL,'HOOK','Cooking'],5:['Three cuts every reel needs','CUTS','Script ready'],7:['The caption nobody reads','READ','Script ready'],10:['Why your first second fails','FIRST','Planned'],12:['Film a week in one hour','BATCH','Planned'],14:['Steal this rival’s opening','OPEN','Planned'],17:['Lighting with one window','LIGHT','Planned'],19:['What 1,000 views taught me','VIEWS','Planned'],24:['My gift page, rebuilt live','GIFT','Planned']};
const CHANGES = [['Move',`<s>Tue 10</s> <b>Thu 12</b>: Why your first second fails`,'Thursday night had the most active viewers last month.'],['Rewrite',`Hook of <b>${REEL}</b>`,'Old: "Here are my tips." New: "Your hook has 30 seconds of work in it."'],['Add',`<b>Sat 28:</b> Gift page teardown`,'People leave at the gift page. This reel tests a new one.'],['Remove',`<s>Tue 17: Lighting with one window</s>`,'Rivals got little from this topic. Nothing was cooked yet.']];
const COOK_STEPS = ['Script','Voice','Build','Draft','Final','Review'];
const COOK_HEAD = ['Claude is copying your script into the reel','Script ready. Claude is recording the voice','Claude is building the chapters','Rendering a quick draft','Draft ready to watch. Final render running','Final video ready. Claude is reviewing it'];
const COOK_WAIT = ['Claude checks the hook length, then records the voice.','Claude builds the chapters next. Nothing needs you until the draft.','Claude mixes the music, then renders a quick draft for you.','The draft plays here, then the final render starts by itself.','The final replaces the draft in this player.','Claude writes the caption and hands the reel to you.'];
const fmt = n => n.toLocaleString('en-US');
const clock = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const dropPct = Math.round((1 - FUNNEL[4][1]/FUNNEL[3][1]) * 100);

/* ---------- every state of every step. Same fields everywhere: head, sub, YOU CAN, IF YOU WAIT, buttons ---------- */
const COPY = {
  today:{
    running:{head:'Getting today ready',sub:'Reading what you pulled this morning.',can:'Open any step. Nothing is locked.',wait:'Today fills in by itself, usually in a few seconds.',bar:.5},
    long:{head:'Today is taking longer than usual',sub:'{t} so far. It usually takes 5 seconds.',can:'Open any step. They already have your numbers.',wait:'Today keeps loading. If it stops, you get a Try again button here.',bar:.7,t:48},
    error:{head:'Polar did not answer',sub:'5 sources have fresh numbers. Bought keeps yesterday’s number.',can:'Keep working. Only the last row of the funnel is old.',wait:'Nothing retries by itself.',acts:[['Pull Polar again','repull',1]]},
    empty:{head:'Nothing here yet',sub:'Today shows what needs you once you have numbers to look at.',acts:[['Pull your numbers','go:pull',1]]},
    limited:{head:'Instagram’s hourly limit is used up',sub:'Today shows numbers from 07:00. You can pull again after 15:00.',can:'Everything else still works.',wait:'Nothing pulls by itself. Press Pull after 15:00.',acts:[['See what was pulled','go:pull']]},
  },
  pull:{
    running:{head:'Pulling your numbers',sub:'3 of 5 sources done. Instagram is next.',can:'Leave this. Bean keeps the pull going.',wait:'New numbers land row by row. Old ones stay until then.',bar:.6},
    long:{head:'Taking longer than usual ({t})',sub:'Instagram is answering slowly today.',can:'You can leave; the pull keeps going.',wait:'It finishes by itself. If it stops, you keep what arrived.',bar:.72,t:120},
    error:{head:'3 rivals have new numbers. The other 10 keep their older numbers.',sub:'Instagram stopped answering after the third rival.',can:'Keep working. Nothing you already had was lost.',wait:'Nothing retries by itself.',acts:[['Pull the rest (10)','pull-rest',1]]},
    empty:{head:'Nothing to pull yet',sub:'Connect Instagram and I will fetch your numbers whenever you ask. Never on a timer.',acts:[['Connect Instagram','connect',1],['Use sample numbers','sample']]},
    limited:{head:'Instagram’s hourly limit is used up',sub:'5 of 13 rivals are pulled. The other 8 wait until 15:00.',can:'Use the 5 now. Insight already has them.',wait:'Bean naps. Nothing pulls by itself. Press the button after 15:00.',acts:[['Pull the rest (8) after 15:00','noop-limit']]},
  },
  insight:{
    running:{head:'Claude is reading your funnel',sub:'Looking at why people leave at the gift page.',can:'Keep reading the numbers below. They are final.',wait:'The answer appears here with where each number came from.',bar:.4},
    long:{head:'Claude is taking longer than usual',sub:'{t} so far. It usually answers in 20 seconds.',can:'Leave this page. The answer waits for you here.',wait:'Claude keeps reading. If it stops, you get Ask again.',bar:.75,t:95},
    error:{head:'Polar did not answer, so Bought is yesterday’s number',sub:'The other 5 rows are from this morning.',can:'Read the funnel. The old row is marked grey.',wait:'Nothing retries by itself.',acts:[['Pull Polar again','repull',1]]},
    empty:{head:'No numbers to read yet',sub:'Pull once and I will lay out where people leave.',acts:[['Pull your numbers','go:pull',1]]},
    limited:{head:'Polar is not connected, so the funnel stops at checkout',sub:'5 of 6 rows have numbers. Bought stays empty.',can:'Read the other 5, or connect Polar.',wait:'Nothing changes until you connect it.',acts:[['Connect Polar','settings',1]]},
  },
  plan:{
    running:{head:'Claude is writing November',sub:'5 of 9 reels written. Each one lands on its day.',can:'Open a reel that has landed and read it.',wait:'Claude finishes, then the plan goes to Approve. Nothing is live until you say yes.',bar:.55},
    long:{head:'Claude is taking longer than usual on November',sub:'{t} so far. It usually takes 4 minutes.',can:'Leave this page, or read the 7 reels that landed.',wait:'Claude keeps writing. If it stops, this card offers Write the rest.',bar:.78,t:560},
    error:{head:'Claude stopped after 5 of 9 reels. Those 5 are saved.',sub:'The terminal closed before reel 6.',can:'Read the 5, or write the other 4.',wait:'Nothing runs. The other 4 days stay open.',acts:[['Write the other 4','write-rest',1]]},
    empty:{head:'November has no plan yet',sub:'Ask Claude to write one from your numbers. You approve it before anything is real.',acts:[['Ask Claude to write November','write-plan',1]]},
    limited:{head:'Claude’s usage limit is reached. 5 of 9 reels are saved.',sub:'Your Claude plan resets at 17:00.',can:'Read the 5, or write the rest yourself.',wait:'Bean naps. At 17:00 you press one button and Claude continues.',acts:[['Continue after 17:00','noop-limit']]},
  },
  approve:{
    running:{head:'Saving plan v3',sub:'Moving 4 reels on the calendar.',can:'Nothing to do.',wait:'Plan v3 goes live in a moment. Plan v2 stays until then.',bar:.6},
    long:{head:'Saving plan v3 is taking longer than usual',sub:'{t} so far. It usually takes 2 seconds.',can:'Leave this page.',wait:'v2 stays live until v3 is fully saved. You never get half a plan.',bar:.8,t:24},
    error:{head:'Plan v3 did not save. Plan v2 is still live.',sub:'Nothing on your calendar changed, and your 4 choices are kept.',can:'Try again, or look at the plan first.',wait:'Nothing retries by itself.',acts:[['Approve again (4 changes)','approve',1]]},
    empty:{head:'Nothing waits for your yes',sub:'Plan v2 is live. When Claude proposes changes, they show up here in plain words.',acts:[['See the plan','go:plan',1]]},
    limited:{head:'2 of 4 changes touch a reel that is cooking',sub:'Those 2 wait until the cook ends. The other 2 can go now.',can:'Approve the 2 that are free.',wait:'The 2 others stay here and nothing is lost.',acts:[['Approve the free ones (2)','approve',1]]},
  },
  cook:{
    running:{head:COOK_HEAD[2],sub:'Step 3 of 6 · {t} so far',can:'Nothing to do. You can leave; the Plan card shows the progress.',wait:COOK_WAIT[2],t:401},
    long:{head:'Rendering the final video, slower than usual',sub:'Step 5 of 6 · {t} so far · usually 9 minutes',can:'Watch the draft. Leave it, or ask Claude why.',wait:'It keeps rendering. If it stops, this card turns red with Resume.',t:1900},
    error:{head:'The final render stopped. Script, voice, chapters and draft are kept.',sub:'Stopped at step 5 of 6. The Mac ran out of disk space.',can:'Free some space, then resume. Nothing starts over.',wait:'Nothing runs. The draft stays here to watch.',acts:[['Resume from Final','resume-cook',1],['Ask Claude why','ask-cook']]},
    empty:{head:'Nothing is cooking',sub:'Cook a reel from Plan.',acts:[['Open Plan','go:plan',1]]},
    limited:{head:'Claude’s usage limit is reached at Build',sub:'Step 3 of 6 is paused. Script and voice are kept. Your plan resets at 17:00.',can:'Watch nothing yet, read the script, or rest.',wait:'Bean naps. At 17:00 press Resume and Claude picks up at Build.',acts:[['Resume after 17:00','noop-limit']]},
  },
  publish:{
    running:{head:'Sending to Instagram',sub:'Video 80% uploaded. Caption and cover are next.',can:'Nothing to do. You can leave.',wait:'The reel goes live, then the keyword DM turns on.',bar:.8},
    long:{head:'Instagram is taking longer than usual',sub:'{t} so far. It usually takes 40 seconds.',can:'Leave this page. It keeps going.',wait:'If Instagram refuses, you keep everything and get Try again.',bar:.9,t:190},
    error:{head:'Instagram refused the upload. Nothing was posted.',sub:'Video, caption and cover are all kept.',can:'Try again, or pick a later time.',wait:'Nothing retries by itself. The reel waits here.',acts:[['Try again','publish',1],['Publish Thu 09:00','schedule']]},
    empty:{head:'Nothing waits to publish',sub:'The next reel lands here when Claude finishes cooking it.',acts:[['See what is cooking','go:cook',1]]},
    limited:{head:'Instagram’s daily post limit is reached',sub:`${REEL} is ready and kept. It can go at 09:00 tomorrow.`,can:'Schedule it now, then forget about it.',wait:'Bean naps and nothing is posted.',acts:[['Publish tomorrow 09:00','schedule',1]]},
  },
};

/* ---------- app state ---------- */
const fresh = () => ({view:'today',tab:'funnel',st:Object.fromEntries(STOPS.map(([k])=>[k,'normal'])),job:null,first:false,bean:'on',slot:3,askOpen:false,askDone:false,approved:false,off:{},cookStep:null,cookDone:true,published:false,scheduled:false,celebrate:false,feedback:'',t:0,p:null,sheet:false,settings:false});
let S = fresh();
let simTimer = null, tickTimer = null, celebrateTimer = null, toastTimer = null;
const seen = new Set();

const stateOf = v => S.st[v];
const slotStatus = d => d!==3 ? SLOTS[d][2] : S.published ? 'Live' : S.scheduled ? 'Scheduled' : !S.cookDone ? 'Cooking' : 'Ready to publish';
const isJob = k => ['running','long','error','limited'].includes(k);
function copyFor(v){
  const k = stateOf(v); const c = COPY[v][k]; if(!c) return null;
  if(v==='cook' && k==='running' && S.cookStep!=null) return {...c,head:COOK_HEAD[S.cookStep],sub:`Step ${S.cookStep+1} of 6 · {t} so far`,wait:COOK_WAIT[S.cookStep]};
  return c;
}
function needYou(){
  const a=[]; if(!S.approved && stateOf('approve')==='normal') a.push('approve');
  if(!S.published && !S.scheduled && S.cookDone && stateOf('publish')==='normal') a.push('publish');
  return a;
}
function setState(v,k){
  clearSim(); S.st[v]=k; S.t=COPY[v][k]?.t||0; S.p=null;
  if(isJob(k)) S.job=v; else if(S.job===v) S.job=null;
  if(v==='cook'){ S.cookStep=null; S.cookDone=k==='normal'; }
  if(k!=='normal') S.celebrate=false;
  render();
}
function clearSim(){ clearInterval(simTimer); simTimer=null; }
function sim(v,ms,onStep,done){
  clearSim(); S.st[v]='running'; S.job=v; S.p=0; S.t=0; const t0=performance.now(); render();
  simTimer=setInterval(()=>{
    const p=Math.min(1,(performance.now()-t0)/ms); S.p=p; onStep&&onStep(p); patch();
    if(p>=1){ clearSim(); S.st[v]='normal'; S.p=null; if(S.job===v) S.job=null; done&&done(); render(); }
  },90);
}

/* ---------- actions ---------- */
function toast(msg,undo){
  const el=$('#toast'); el.innerHTML=`<span>${msg}</span>`+(undo?`<button data-a="${undo}" data-testid="toast-undo">Undo</button>`:'');
  el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),undo?5200:2800);
}
const ACT = {
  connect(){ S.first=false; S.view='pull'; sim('pull',3200,null,()=>toast('Your numbers are in. Pulled just now.')); },
  sample(){ S.first=false; S.st.pull='normal'; go('today'); },
  'pull-all'(){ sim('pull',3200,null,()=>toast('5 sources pulled. Nothing failed.')); },
  'pull-rest'(){ sim('pull',2600,null,()=>toast('All 13 rivals have new numbers.')); },
  repull(){ const v=S.view; sim(v,1800,null,()=>toast('Polar answered. Bought is fresh.')); },
  ask(){ S.askOpen=true; sim('insight',2200,null,()=>{S.askDone=true;}); },
  'write-plan'(){ sim('plan',3000,null,()=>{S.approved=false;toast('November is written. It waits on Approve.');}); },
  'write-rest'(){ sim('plan',2200,null,()=>{S.approved=false;toast('All 9 reels are written.');}); },
  approve(){ sim('approve',1100,null,()=>{S.approved=true;toast('Plan v3 is live.','undo-approve');}); },
  'undo-approve'(){ S.approved=false; $('#toast').classList.remove('on'); render(); toast('Back to plan v2.'); },
  cook(){ S.view='cook'; S.published=false; S.scheduled=false; S.cookDone=false; S.cookStep=0; sim('cook',8400,p=>{ const i=Math.min(5,Math.floor(p*6)); S.t=Math.round(p*2640); if(i!==S.cookStep){S.cookStep=i;render();} },()=>{S.cookStep=null;S.cookDone=true;toast(`${REEL} is ready for your yes.`);}); },
  'resume-cook'(){ S.cookDone=false; S.cookStep=4; sim('cook',3000,p=>{const i=p<.6?4:5; S.t=1900+Math.round(p*300); if(i!==S.cookStep){S.cookStep=i;render();}},()=>{S.cookStep=null;S.cookDone=true;toast('Picked up at Final. Nothing started over.');}); },
  'ask-cook'(){ toast('Claude says: disk is full. 4 GB of old drafts can go.'); },
  publish(){ sim('publish',2000,null,()=>{S.published=true;S.celebrate=true;clearTimeout(celebrateTimer);celebrateTimer=setTimeout(()=>{S.celebrate=false;render();},4600);}); },
  schedule(){ S.scheduled=true; S.st.publish='normal'; if(S.job==='publish')S.job=null; render(); toast('Scheduled. It goes on its own at that time.'); },
  changes(){ toast('Your note went to Claude. The reel stays here until you approve it.'); },
  send(){ const f=$('#fb'); if(f&&f.value.trim()){ S.feedback=f.value.trim(); f.value=''; render(); toast('Sent. Claude reads it after this step.'); } },
  'noop-limit'(){ toast('This button wakes up when the limit resets.'); },
  sheet(){ S.sheet=!S.sheet; S.settings=false; renderSheets(); bean.m&&bean.m.bounce(); },
  settings(){ S.settings=!S.settings; S.sheet=false; renderSheets(); },
  'close-sheets'(){ S.sheet=false; S.settings=false; renderSheets(); },
};
function go(v){ S.view=v; S.sheet=false; render(); $('#page').scrollTop=0; }
function act(a){
  if(a.startsWith('go:')) return go(a.slice(3));
  if(a.startsWith('bean:')){ S.bean=a.slice(5); bean.apply(); render(); renderSheets(); return; }
  if(a.startsWith('tab:')){ S.tab=a.slice(4); render(); return; }
  if(a.startsWith('slot:')){ S.slot=+a.slice(5); render(); return; }
  if(a.startsWith('chg:')){ const i=a.slice(4); S.off[i]=!S.off[i]; render(); return; }
  if(!ACT[a]) { console.error('no action '+a); return; }
  ACT[a]();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
  const b=e.target.closest('[data-a]'); if(b){act(b.dataset.a);return;}
  if(S.sheet||S.settings){ if(!e.target.closest('.pop')){S.sheet=false;S.settings=false;renderSheets();} }
});
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='Escape'){S.sheet=false;S.settings=false;renderSheets();}
  const n='0123456'.indexOf(e.key); if(n>=0&&!S.first){go(STOPS[n][0]);}
});

/* ---------- pieces ---------- */
const btn=(l,a,pri,id)=>`<button class="btn${pri?' pri':''}" data-a="${a}" data-testid="${id||'act-'+a.replace(':','-')}">${l}</button>`;
function card(v,c,k){
  const bar=c.bar!=null?`<div class="bar"><i data-p style="--p:${S.p??c.bar}"></i></div>`:'';
  return `<section class="card b" data-k="${k}" data-testid="state-card" style="--i:0">
    <div><div class="hd" data-testid="state-head">${c.head.replace('{t}',`<span data-t>${clock(S.t)}</span>`)}</div>${c.sub?`<p class="mut sm" style="margin-top:3px">${c.sub.replace('{t}',`<span data-t class="num">${clock(S.t)}</span>`)}</p>`:''}</div>
    ${bar}
    ${c.can||c.wait?`<dl>${c.can?`<dt>YOU CAN</dt><dd>${c.can}</dd>`:''}${c.wait?`<dt>IF YOU WAIT</dt><dd>${c.wait}</dd>`:''}</dl>`:''}
    ${c.acts?`<div class="acts">${c.acts.map(([l,a,p])=>btn(l,a,p)).join('')}</div>`:''}
  </section>`;
}
const beanHere=()=>S.bean!=='off'&&beanSpot().seat;
function seat(c,title){
  return `<div class="seat${beanHere()?'':' nobean'}" data-testid="empty-seat"><div class="spot" data-spot></div>
    <h1 data-testid="page-title">${title||c.head}</h1><p class="mut sm">${c.sub}</p>
    ${c.acts?`<div class="acts" style="justify-content:center;margin-top:5px">${c.acts.map(([l,a,p])=>btn(l,a,p)).join('')}</div>`:''}</div>`;
}
const head=(t,s)=>`<div class="head b" style="--i:0"><h1 data-testid="page-title">${t}</h1>${s?`<p class="mut sm">${s}</p>`:''}</div>`;
const thumb=(t,h1,h2)=>`<div class="thumb" style="--h1:${h1};--h2:${h2}">${t}</div>`;

/* ---------- pages ---------- */
const PAGES = {
  today(k,c){
    if(k==='empty') return seat(c,'Morning. Nothing here yet.');
    const needs=needYou();
    const rows=[];
    if(needs.includes('approve')) rows.push(['Claude proposes 4 changes to November','Takes about a minute to read','Read the changes','go:approve']);
    if(needs.includes('publish')) rows.push([`${REEL} is ready to publish`,'Video, caption and cover are done','Watch it','go:publish']);
    const title=k==='normal'?(rows.length===2?'Morning. Two things need you.':rows.length===1?'Morning. One thing needs you.':'Morning. Nothing needs you.'):'Morning.';
    return `${head(title,'Numbers from 07:00 today. Lead Studio pulls when you ask, never on a timer.')}
    ${c?card('today',c,k):''}
    ${rows.length?`<div class="rows b" style="--i:1">${rows.map(r=>`<div class="rw"><div><div class="t">${r[0]}</div><div class="mut sm">${r[1]}</div></div>${btn(r[2],r[3],1,'today-'+r[3].replace(':','-'))}</div>`).join('')}</div>`:''}
    <div class="b" style="--i:2"><h2>The one number to look at</h2><p class="mut" style="margin-top:3px">${FUNNEL[3][1]} people opened the gift page. ${FUNNEL[4][1]} clicked checkout, so ${dropPct}% leave right there.</p><div class="acts" style="margin-top:9px">${btn('See the funnel','go:insight',0,'today-insight')}</div></div>
    <div class="b" style="--i:3"><h2>Next up</h2><div class="rows" style="margin-top:8px">${[3,5,7].map(d=>`<div class="rw"><div><span class="t">${SLOTS[d][0]}</span><div class="mut sm">Nov ${d}</div></div><span class="pill ${slotStatus(d)==='Cooking'?'run':slotStatus(d)==='Ready to publish'?'you':slotStatus(d)==='Live'?'ok':''}">${slotStatus(d)}</span></div>`).join('')}</div></div>`;
  },
  pull(k,c){
    if(k==='empty') return seat(c);
    const done=k==='running'?3:k==='limited'?5:5;
    const rowState=(i)=>{
      if(k==='running') return i<3?['ok','Just now']:i===3?['run','Pulling']:['','Waits its turn'];
      if(k==='long') return i<1?['run','Pulling, slow today']:i===1?['ok','Just now']:['','Waits its turn'];
      if(k==='error') return i===1?['err','3 of 13 new, 10 older']:['ok',SOURCES[i][2]];
      if(k==='limited') return i===0||i===1?['lim',i?'5 of 13, rest after 15:00':'Limit reached until 15:00']:['ok',SOURCES[i][2]];
      return ['ok',SOURCES[i][2]];
    };
    return `${head(k==='normal'?'Your numbers are from this morning.':'Your numbers','Pulled when you ask, never on a timer.')}
    ${c?card('pull',c,k):''}
    <div class="rows b" style="--i:1">${SOURCES.map((s,i)=>{const r=rowState(i);return `<div class="rw" data-testid="source-row"><div><div class="t">${s[0]}</div><div class="mut sm">${s[1]}</div></div><span class="pill ${r[0]}">${r[1]}</span></div>`;}).join('')}</div>
    ${k==='normal'?`<div class="acts b" style="--i:2">${btn('Pull everything now','pull-all',1)}</div>`:''}`;

  insight(k,c){

const POSE = {pull:['finding','focused'],insight:['thinking','thinking'],plan:['explaining','focused'],approve:['working','focused'],cook:['working','focused'],publish:['holding','focused'],today:['thinking','thinking']};
function beanSpot(){
  const v=S.view,k=stateOf(v);
  if(S.first) return {seat:true,scale:.82,stop:null};
  if(!S.job&&(k==='empty'||(v==='publish'&&(S.celebrate||S.published||S.scheduled||!S.cookDone)&&k==='normal')||(v==='approve'&&k==='normal'&&S.approved))) return {seat:true,scale:.62,stop:null};
  if(S.job) return {seat:false,stop:S.job};

}
function beanMood(){
  const v=S.view,k=stateOf(v);
  if(S.first) return ['greeting','happy',1];
  if(S.celebrate) return ['cheering','celebrating',1];
  if(S.job){ const js=stateOf(S.job);
    if(js==='error') return ['hugging','worried',.8];
    if(js==='limited') return ['floating','sleeping',.8];
    const p=POSE[S.job]; return [p[0],p[1],js==='long'?.5:1];
  }
  if(k==='empty') return ['finding','curious',1];
  if(v==='publish'&&S.scheduled) return ['floating','happy',1];
  if(v==='approve'&&S.approved) return ['floating','happy',1];
  if(needYou().includes(v)) return ['holding','happy',1];
  return ['floating','normal',1];
}
const bean = {
  el:$('#bean'),hit:$('#beanhit'),glow:$('#beanglow'),m:null,x:0,y:0,s:.3,hop:null,spotKey:'',ready:false,
  apply(){

  },
  target(){
    const sp=beanSpot();
    if(sp.seat){
      const el=document.querySelector('[data-spot]'); if(!el) return null;
      const r=el.getBoundingClientRect(); const scale=Math.min(sp.scale,r.height/360/.92);
      return {x:r.left+r.width/2,y:r.bottom-4,s:scale,key:'seat'+(S.first?'1':'')};
    }
    const el=document.querySelector(`[data-testid="stop-${sp.stop}"] .d`); if(!el) return null;
    const r=el.getBoundingClientRect(); const ph=innerWidth<=760;
    return {x:r.left+r.width/2,y:r.top+r.height/2,s:ph?.22:.34,key:'stop-'+sp.stop};
  },
  place(){
    const t=this.target(); if(!t) return;
    if(!this.spotKey){ this.x=t.x;this.y=t.y;this.s=t.s;this.spotKey=t.key; }
    else if(t.key!==this.spotKey){
      this.spotKey=t.key;
      if(S.bean==='on'&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
        this.hop={x0:this.x,y0:this.y,s0:this.s,t0:performance.now(),ms:Math.min(720,380+Math.hypot(t.x-this.x,t.y-this.y)*.5)};
        if(this.m&&!['worried','sleeping'].includes(beanMood()[1])) this.m.bounceAt=this.m.now;
      } else { this.x=t.x;this.y=t.y;this.s=t.s; }
    }
    if(this.m){ const [p,e,tempo]=beanMood(); this.m.setPose(p); this.m.setExpr(e); this.m.tempo=tempo; }
  },
  frame(now){
    const t=this.target(); if(!t) return;
    if(this.hop){
      const h=this.hop; const u=Math.min(1,(now-h.t0)/h.ms); const e=1-Math.pow(1-u,3);

      this.y=h.y0+(t.y-h.y0)*e-Math.sin(u*Math.PI)*Math.min(80,Math.hypot(t.x-h.x0,t.y-h.y0)*.22+22);
      if(u>=1) this.hop=null;
    } else { this.x=t.x;this.y=t.y;this.s=t.s; }
    const size=360*this.s, left=this.x-size/2, top=this.y-size*.85;
    this.el.style.transform=`translate(${left}px,${top}px) scale(${this.s})`;
    const hb=size*.62; this.hit.style.cssText=`width:${hb}px;height:${hb*.9}px;transform:translate(${this.x-hb/2}px,${this.y-hb*.95}px)`;
    this.glow.style.transform=`translate(${this.x}px,${this.y+2}px) scale(${Math.max(.5,this.s*2.4)})`;
  },
};
function lookAt(cx,cy){
