<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Studio Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#141216;--panel:#1a181d;--raise:#232026;--ink:#f6f0ea;--muted:#ada5a8;--faint:#776f75;
  --line:rgba(255,238,226,.09);--line2:rgba(255,238,226,.18);--ghost:rgba(255,238,226,.07);
  --peach:#ff9f7c;--peach-ink:#ffb699;--peach-soft:rgba(255,159,124,.14);--on-peach:#2a140b;
  --err:#ff8a84;--err-soft:rgba(255,120,110,.13);--ok:#86dcb0;--shadow:0 16px 48px -18px rgba(0,0,0,.7);
  --stage:#0d0c0f;
  --display:"Bricolage Grotesque","SF Pro Display",-apple-system,sans-serif;
  --body:"Instrument Sans","SF Pro Text",-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#faf6f2;--panel:#fffcfa;--raise:#f2ebe5;--ink:#1f1b29;--muted:#6e6673;--faint:#9c94a0;
  --line:rgba(45,25,50,.09);--line2:rgba(45,25,50,.2);--ghost:rgba(45,25,50,.06);
  --peach:#ff9f7c;--peach-ink:#b44f2c;--peach-soft:rgba(226,110,70,.12);--on-peach:#2a140b;
  --err:#c23b36;--err-soft:rgba(200,60,50,.09);--ok:#237a52;--shadow:0 16px 48px -20px rgba(90,50,40,.35);
  --stage:#efe8e1;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#faf6f2;--panel:#fffcfa;--raise:#f2ebe5;--ink:#1f1b29;--muted:#6e6673;--faint:#9c94a0;
  --line:rgba(45,25,50,.09);--line2:rgba(45,25,50,.2);--ghost:rgba(45,25,50,.06);
  --peach:#ff9f7c;--peach-ink:#b44f2c;--peach-soft:rgba(226,110,70,.12);--on-peach:#2a140b;
  --err:#c23b36;--err-soft:rgba(200,60,50,.09);--ok:#237a52;--shadow:0 16px 48px -20px rgba(90,50,40,.35);
  --stage:#efe8e1;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;transition:transform .12s var(--ease),background .16s,color .16s,border-color .16s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--peach);outline-offset:2px;border-radius:4px}
h1,h2,p{margin:0}
.tc{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:-.01em}

/* prototype band: not part of the app */
.band{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--stage);border-bottom:1px solid var(--line);font-size:13px;min-width:0;flex-wrap:wrap}
.band select{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:3px 6px;max-width:190px}
.b-play{height:28px;padding:0 12px 0 10px;border-radius:7px;background:var(--ink);color:var(--bg);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.b-step{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);color:var(--muted);font-size:16px;line-height:1}
.dots{display:flex;gap:4px;align-items:center}
.dots button{width:7px;height:7px;border-radius:9px;background:var(--line2)}
.dots button.on{background:var(--peach);width:18px}
.cap{flex:1;min-width:200px;color:var(--ink);line-height:1.3}
.b-ghost{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.b-ghost:hover{color:var(--ink);border-color:var(--line2)}
.matrix{position:fixed;z-index:90;top:48px;right:12px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:none;max-width:calc(100vw - 24px);overflow:auto}
.matrix.on{display:block}
.matrix table{border-collapse:collapse;font-size:12.5px}
.matrix th{font-weight:500;color:var(--muted);padding:3px 8px;text-align:left}
.matrix td{padding:2px}
.matrix td button{width:26px;height:22px;border-radius:5px;background:var(--raise)}
.matrix td button:hover,.matrix td button.on{background:var(--peach);}

/* top bar: the 6 steps */
.top{display:flex;align-items:center;gap:6px;padding:0 14px;height:48px;border-bottom:1px solid var(--line);min-width:0}
.brand{font:700 15px/1 var(--display);letter-spacing:-.02em;padding:6px 10px 6px 2px;white-space:nowrap}
.steps{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.step{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:8px;color:var(--muted);white-space:nowrap;position:relative}
.step:hover{color:var(--ink);background:var(--ghost)}
.step[aria-current="true"]{color:var(--ink);background:var(--raise);font-weight:600}
.step i{width:6px;height:6px;border-radius:9px;background:var(--line2);flex:none}
.step.w8 i{background:var(--peach)}
.step.run i{background:var(--peach);animation:breathe 1.6s ease-in-out infinite}
.step.err i{background:var(--err)}
.step.done i{background:var(--ok)}
.sep{width:10px;height:1px;background:var(--line2);flex:none}
@keyframes breathe{50%{opacity:.25}}
.tool{height:30px;padding:0 10px;border-radius:7px;color:var(--muted);white-space:nowrap}
.tool:hover{color:var(--ink);background:var(--ghost)}

/* bench: monitor, desk, note */
.bench{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) 332px;min-height:0}
.mon{padding:16px 0 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;container-type:size}
.frame{position:relative;flex:none;width:min(100%,calc((100cqh - 34px)*9/16));aspect-ratio:9/16;background:#17151a;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.frame svg.doodle{position:absolute;inset:0;width:100%;height:100%;transition:opacity .2s}
.frame .capn{position:absolute;left:8%;right:8%;bottom:18%;text-align:center;font:800 clamp(15px,2.1vh,22px)/1.14 var(--display);letter-spacing:-.01em;color:#fffdf8;text-shadow:0 1px 0 #000,0 0 12px rgba(0,0,0,.65);text-wrap:balance}
.frame.dim svg.doodle{opacity:.22}
.frame.draft svg.doodle{filter:saturate(.6) contrast(.85)}
.frame .tag{position:absolute;top:9px;left:9px;font:600 11px/1 var(--body);padding:4px 7px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff}
.frame .blank{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 16%;text-align:center;color:var(--muted);font-size:13px}
.mctl{display:flex;align-items:center;gap:8px;width:100%;max-width:240px}
.mctl button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink)}
.mctl button:hover{background:var(--ghost)}
.scrub{flex:1;height:18px;position:relative;cursor:pointer}
.scrub::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line2);border-radius:2px}
.scrub b{position:absolute;left:0;top:8px;height:2px;background:var(--peach);border-radius:2px}
.desk{padding:22px 30px 26px;overflow:auto;min-width:0}
.desk h1{font:700 clamp(24px,2.5vw,32px)/1.08 var(--display);letter-spacing:-.025em;margin-bottom:6px;text-wrap:balance}
.desk .lead{color:var(--muted);max-width:60ch;margin-bottom:18px}
.note{position:relative;border-left:1px solid var(--line);padding:20px 22px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0}
.note h2{font:700 19px/1.18 var(--display);letter-spacing:-.015em;text-wrap:pretty}
.note .sub{color:var(--muted);font-size:13.5px}
.note.err h2{color:var(--err)}
.mslot{display:block;flex:none}
.mslot.away{position:absolute;right:22px;top:16px;visibility:hidden}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:36px;padding:0 14px;border-radius:9px;font-weight:600;background:var(--raise);white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--peach);color:var(--on-peach)}
.btn.pri:hover{background:#ffb092}
.btn[disabled]{opacity:.45;cursor:default}
.rows{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;font-size:13.5px;border-top:1px solid var(--line);padding-top:12px}
.rows dt{font:500 10.5px/1.7 var(--mono);letter-spacing:.06em;color:var(--faint);white-space:nowrap}
.rows dd{margin:0}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:11.5px;color:var(--faint)}
.strip span{display:block}
.strip span::before{content:"";display:block;height:3px;border-radius:3px;background:var(--line2);margin-bottom:5px;transition:background .3s}
.strip .d{color:var(--muted)}.strip .d::before{background:var(--ink)}
.strip .c{color:var(--ink);font-weight:600}.strip .c::before{background:var(--peach);animation:breathe 1.6s ease-in-out infinite}
.strip .x{color:var(--err);font-weight:600}.strip .x::before{background:var(--err)}

/* desk parts */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);min-height:44px}
.row b{font-weight:600}
.row .m{color:var(--muted);font-size:13.5px}
.bar{height:3px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:var(--peach);transition:width .3s var(--ease)}
.pill{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--ghost);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.err{color:var(--err);background:var(--err-soft)}.pill.warm{color:var(--peach-ink);background:var(--peach-soft)}
.nums{display:flex;flex-wrap:wrap;gap:6px 30px;margin:0 0 20px}
.nums div b{display:block;font:700 24px/1.1 var(--display);letter-spacing:-.02em}
.nums div span{color:var(--muted);font-size:12.5px}
.nums .bad b{color:var(--err)}
.tabs{display:flex;gap:2px;margin:0 0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:6px 11px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--peach);font-weight:600}
.moment{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 8px;border-bottom:1px solid var(--line);width:100%;text-align:left;border-radius:0}
.moment:hover{background:var(--ghost)}
.moment .tc{color:var(--peach-ink)}
.moment p{color:var(--muted);font-size:13.5px;margin-top:1px}
.field{display:grid;grid-template-columns:82px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.field label{color:var(--muted);font-size:13px}
.field input,.field textarea{width:100%;background:none;border:0;padding:3px 6px;margin-left:-6px;border-radius:6px;resize:none;outline:0}
.field input:hover,.field textarea:hover{background:var(--ghost)}
.field input:focus,.field textarea:focus{background:var(--raise)}
.field.gap input{border:1px dashed var(--line2)}
.field.gap input::placeholder{color:var(--peach-ink)}
.beat{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:2px 6px 2px 0;border-radius:6px;cursor:pointer}
.beat:hover{background:var(--ghost)}
.beat .tc{color:var(--faint);line-height:1.8}
.beat.on .tc{color:var(--peach-ink)}
.swap{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.swap .was{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.swap .now{font-weight:600}
.swap .why{color:var(--muted);font-size:13px;grid-column:1}
.swap .where{font-size:12px;color:var(--muted);margin-bottom:3px}
.seg{display:inline-flex;background:var(--ghost);border-radius:8px;padding:2px}
.seg button{height:24px;padding:0 9px;border-radius:6px;color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.14)}
.check{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.check i{font-style:normal;width:15px;flex:none;text-align:center;color:var(--ok)}
.check.no i{color:var(--err)}
.check span{color:var(--muted);font-size:13.5px;margin-left:auto;text-align:right}
.pin{display:flex;gap:8px;margin-top:14px}
.pin input{flex:1;min-width:0;background:var(--raise);border:1px solid transparent;border-radius:9px;padding:7px 11px;outline:0}
.pin input:focus{border-color:var(--line2)}
.pinned{display:flex;gap:9px;padding:8px 0;font-size:13.5px}
.pinned .tc{color:var(--peach-ink);line-height:1.8}
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.todo p{color:var(--muted);font-size:13.5px}
.bars{display:flex;align-items:flex-end;gap:3px;height:68px;margin:0 0 18px}
.bars i{flex:1;background:var(--line2);border-radius:2px 2px 0 0;min-width:2px}
.bars i.hi{background:var(--peach)}
.kw{width:100%;border-collapse:collapse;font-size:13.5px}
.kw th{font-weight:500;color:var(--muted);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.kw td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kw th:first-child,.kw td:first-child{text-align:left}
.tw{overflow-x:auto}
.rv{padding:12px 0;border-bottom:1px solid var(--line)}
.rv .k{font-size:12px;font-weight:600;color:var(--peach-ink)}
.rv p{color:var(--muted);font-size:13.5px}

/* ghost: reserved shape, then fill */
.ghosting [data-f]{color:transparent!important;background:var(--ghost)!important;border-color:transparent!important;border-radius:6px}
.ghosting [data-f] *{visibility:hidden}
.filling [data-f]{animation:fill .22s var(--ease) both;animation-delay:calc(var(--i,0)*14ms)}
@keyframes fill{from{opacity:.25;transform:translateY(3px)}}

/* first open */
.first{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.first h1{font:800 clamp(34px,5vw,58px)/1.02 var(--display);letter-spacing:-.035em}
.first p{color:var(--muted);max-width:44ch}

/* timeline */
.tl{border-top:1px solid var(--line);background:var(--panel);min-width:0;user-select:none}
.tl-h{display:flex;align-items:center;gap:12px;padding:6px 14px;min-height:38px}
.tl-h .hint{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
.tl-h .what{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b{position:relative;height:150px;overflow:hidden;margin:0 14px 10px;touch-action:pan-y}
.ruler{position:absolute;left:0;right:0;top:0;height:20px;color:var(--faint);font-size:11px}
.ruler span{position:absolute;top:2px;white-space:nowrap;padding-left:4px;border-left:1px solid var(--line)}
.ruler span.tod{color:var(--peach-ink)}
.clip{position:absolute;top:24px;height:86px;border-radius:8px;background:var(--raise);overflow:hidden;cursor:pointer;border:1px solid transparent;will-change:left,width,height}
.clip.sel{border-color:var(--line2)}
.clip.plan{background:none;border:1px dashed var(--line2)}
.clip.wait{border:1.5px solid var(--peach);background:var(--peach-soft)}
.clip.cook{background:var(--raise)}
.clip.err{border:1.5px solid var(--err);background:var(--err-soft)}
.clip.slot{background:none;border:1px dashed var(--line);color:var(--faint);display:grid;place-items:center;font-size:12px}
.clip.slot:hover{border-color:var(--line2);color:var(--muted)}
.c-w{position:absolute;inset:0;padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;pointer-events:none}
.c-w .t{font-weight:600;font-size:12.5px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-w .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.wait .c-w .s{color:var(--peach-ink);font-weight:600}
.clip.err .c-w .s{color:var(--err);font-weight:600}
.c-m{position:absolute;left:0;right:0;bottom:0;height:3px}
.c-r{position:absolute;inset:0;pointer-events:none;opacity:0}
.c-r .beats{position:absolute;left:0;right:0;top:0;height:38px;display:flex;gap:1px;padding:1px}
.c-r .beats div{flex:var(--w) 1 0;min-width:0;padding:4px 7px;font-size:11.5px;line-height:1.25;background:var(--ghost);border-radius:5px;overflow:hidden}
.c-r .beats div.on{background:var(--peach-soft);color:var(--peach-ink)}
.c-r svg{position:absolute;left:0;right:0;top:40px;bottom:0;width:100%;height:calc(100% - 40px)}
.c-r .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--peach);left:0}
.c-r .ph b{position:absolute;bottom:2px;left:4px;font:500 10.5px/1.3 var(--mono);color:var(--peach-ink);background:var(--panel);padding:0 3px;border-radius:3px}
.render{position:absolute;left:0;bottom:0;height:3px;background:repeating-linear-gradient(115deg,var(--peach) 0 8px,#ffc4ad 8px 16px);background-size:200% 100%;animation:slide 1.4s linear infinite;transition:width .4s var(--ease)}
.render.stop{animation:none;background:var(--err)}
@keyframes slide{to{background-position:-68px 0}}
.tail{position:absolute;top:24px;height:126px;padding:2px 2px 2px 14px;opacity:0;pointer-events:none;overflow:hidden}
.tail h3{font:600 12px/1.3 var(--body);margin:0 0 4px;color:var(--muted)}
.tail div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.55;border-bottom:1px solid var(--line)}
.tail div b{font-variant-numeric:tabular-nums}
.tail .gapn{color:var(--peach-ink)}
.rtrack{position:absolute;left:0;right:0;top:114px;height:32px}
.rv-c{position:absolute;height:32px;border-radius:6px;background:var(--ghost);font-size:11.5px;padding:3px 7px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:26px}
.todayl{position:absolute;top:0;height:20px;width:1.5px;background:var(--peach);opacity:.7;pointer-events:none}

/* mascot */
#mate{position:fixed;left:0;top:0;width:360px;height:360px;z-index:40;pointer-events:none;transform-origin:0 0;opacity:0;transition:opacity .25s}
#mate.fallback{display:none}
.say{position:fixed;z-index:41;left:0;top:0;max-width:230px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.3;font-weight:500;padding:6px 10px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .22s;box-shadow:var(--shadow)}
.say.on{opacity:1}

/* drawers */
.sheet{position:fixed;z-index:70;right:0;top:0;bottom:0;width:min(480px,100vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:var(--shadow);padding:22px;overflow:auto;transform:translateX(102%);transition:transform .26s var(--ease);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet h2{font:700 22px/1.15 var(--display);letter-spacing:-.02em;margin-bottom:6px}
.sheet .x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:7px;color:var(--muted);font-size:18px}
.sheet .sub{color:var(--muted);margin-bottom:14px}
.hood{position:fixed;z-index:60;left:0;right:0;bottom:0;height:min(290px,46vh);background:#0f0e11;color:#d8d2cf;border-top:1px solid var(--line2);transform:translateY(102%);transition:transform .26s var(--ease);visibility:hidden;display:flex;flex-direction:column}
.hood.on{transform:none;visibility:visible}
.hood header{display:flex;gap:10px;align-items:center;padding:8px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.09)}
.hood header button{margin-left:auto;color:#a49e9c}
.hood pre{margin:0;padding:12px 14px;font:12px/1.55 var(--mono);overflow:auto;flex:1;white-space:pre-wrap}

/* fake cursor */

const POSES = [['floating','Floating'],['greeting','Greeting'],['thinking','Thinking'],['explaining','Explaining'],['working','Working'],['finding','Finding answers'],['cheering','Cheering']];
const POSE_EXPR = { floating:'normal', greeting:'happy', thinking:'thinking', explaining:'happy', working:'focused', finding:'curious', cheering:'celebrating' };
const ANGLES = [['front','Front',0],['three','3/4 view',0.62],['side','Side view',1.25]];
const STEPS = [
  { pose:'greeting', expr:'happy',       title:'Greeting',    say:'Hi Kai! Ready to help today?' },

// ---------- shared geometry ----------
const B = 0.86; // distance from body centre to its flat-ish bottom
function withDir(g) { g.setAttribute('dir', g.attributes.normal.clone()); return g; }
function blobGeometry() {
  const g = new THREE.SphereGeometry(1, 112, 80);
  const p = g.attributes.position, dir = new Float32Array(p.count * 3), v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    dir.set([v.x, v.y, v.z], i * 3);
    let { x, y, z } = v;
    const s = 1 + 0.08 * (1 - ss(-0.7, 0.45, y)) - 0.045 * ss(0.1, 1, y);   // narrow top, soft wide bottom
    x *= s * 1.03; z *= s * 0.94;
    y = y < 0 ? -0.86 * (-y) * (1.14 - 0.14 * y * y) : 1.0 * y;            // squat, rounded-flat underside
    x += 0.055 * y;                                                        // top leans right, belly bulges left
    p.setXYZ(i, x, y, z);
  }
  g.setAttribute('dir', new THREE.BufferAttribute(dir, 3));
  g.computeVertexNormals();
  return g;
}
const GEO = {
  body: blobGeometry(),
  nub: withDir(new THREE.SphereGeometry(0.2, 40, 28)),
  orb: withDir(new THREE.SphereGeometry(0.155, 40, 28)),
  conf: new THREE.PlaneGeometry(0.05, 0.085),
  shadow: new THREE.PlaneGeometry(1, 1),
};

const VS = `
attribute vec3 dir;
uniform float uTime, uWobble;
varying vec3 vDir, vN, vV;
void main(){
  vDir = dir;
  float w = sin(dir.y*3.1 + uTime*1.6) * sin(dir.x*2.3 + uTime*1.1);
  vec4 mv = modelViewMatrix * vec4(position + normal * w * uWobble, 1.0);
  vV = -mv.xyz;
  vN = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * mv;
}`;
const FS = `
uniform vec3 uTop, uMid, uBottom, uRim;
uniform sampler2D uFace;
uniform float uFaceOn, uGlow;
varying vec3 vDir, vN, vV;
void main(){
  vec3 N = normalize(vN), V = normalize(vV);
  float h = vDir.y;
  vec3 base = mix(uBottom, uMid, smoothstep(-0.95, 0.05, h));
  base = mix(base, uTop, smoothstep(0.1, 0.95, h));
  float wash = smoothstep(0.15, 1.1, -0.55*vDir.x - 0.75*vDir.y + 0.1*vDir.z);
  base = mix(base, uBottom, 0.42*wash);
  vec3 L = normalize(vec3(-0.5, 0.8, 0.6));
  float wrap = clamp((dot(N, L) + 0.8) / 1.8, 0.0, 1.0);
  vec3 col = base * (0.86 + 0.2 * wrap);
  float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.3);
  col = mix(col, uRim, fres * (0.5 + 0.3*uGlow));
  col += uBottom * 0.10 * smoothstep(-0.2, -1.0, N.y);
  vec3 H = normalize(L + V);
  float nh = max(dot(N, H), 0.0);
  vec3 spec = vec3(1.0, 0.98, 0.95) * (pow(nh, 14.0) * 0.06 + pow(nh, 70.0) * 0.08);
  col += spec;
  // sample outside any branch so mip selection stays smooth; mask to the front half
  vec2 uv = vec2(atan(vDir.x, vDir.z) * 0.5 + 0.5, asin(clamp(vDir.y, -1.0, 1.0)) + 0.5);
  vec4 f = texture2D(uFace, uv) * uFaceOn * smoothstep(0.05, 0.25, vDir.z);
  col = col * (1.0 - f.a) + f.rgb + spec * 1.6 * f.a;
  gl_FragColor = vec4(col, 1.0);
}`;

// ---------- shared sprite textures ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const FONT = '"SF Pro Rounded",ui-rounded,"Nunito","Varela Round",system-ui,sans-serif';
const TEX = {
  q: canvasTex(128, 128, (x) => { x.fillStyle = '#8b87f3'; x.font = `800 112px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', 64, 70); }),
  z: canvasTex(128, 128, (x) => { x.fillStyle = '#7f8bf2'; x.font = `800 104px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('z', 64, 62); }),
  shadow: canvasTex(128, 128, (x) => { const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); }),
};
const dashTex = {};
function dash(color) {
  return dashTex[color] ||= canvasTex(128, 32, (x) => { x.strokeStyle = color; x.lineWidth = 15; x.lineCap = 'round'; x.beginPath(); x.moveTo(14, 16); x.lineTo(114, 16); x.stroke(); });
}

// ---------- shared prop materials ----------
const MAT = {
  lap: new THREE.MeshStandardMaterial({ color: '#626a96', roughness: 0.38, metalness: 0.2 }),
  lapDark: new THREE.MeshStandardMaterial({ color: '#434a72', roughness: 0.55 }),
  logo: new THREE.MeshStandardMaterial({ color: '#9aa1cc', roughness: 0.3 }),
  ring: new THREE.MeshStandardMaterial({ color: '#2d355c', roughness: 0.3, metalness: 0.3 }),
  glass: new THREE.MeshBasicMaterial({ color: '#e4f2ff', transparent: true, opacity: 0.32, depthWrite: false }),
  bulb: new THREE.MeshStandardMaterial({ color: '#ffe08a', emissive: '#ffbe3d', emissiveIntensity: 0.65, roughness: 0.25 }),
  neck: new THREE.MeshStandardMaterial({ color: '#c9c2d9', roughness: 0.4, metalness: 0.2 }),
  conf: new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }),
};
const CONF_COLORS = ['#ff9f6e', '#9b8cf5', '#5ccfa0', '#ffc94d', '#ff7ea1', '#6aa5ff'].map(c => new THREE.Color(c));

function sprite(tex, w, h = w) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(w, h, 1); return s;
}
// little radiating dashes, like the "!" marks on the boards
function burst(color, cx, cy, pts) {
  const g = new THREE.Group();
  for (const [x, y, len = 0.17] of pts) {
    const s = sprite(dash(color), len, len / 4);
    s.material.rotation = Math.atan2(y - cy, x - cx);
    s.position.set(x, y, 0.3); s.userData.base = [x, y, cx, cy]; g.add(s);
  }
  return g;
}

let THEME_DARK = false;
const allMascots = new Set();

// ---------- the mascot ----------
class Mascot {
  constructor({ faceSize = 512, hero = false, faceless = false } = {}) {
    this.hero = hero; this.faceless = faceless;
    this.group = new THREE.Group();
    this.root = new THREE.Group(); this.group.add(this.root);
    this.squash = new THREE.Group(); this.squash.position.y = -B; this.root.add(this.squash);
    this.turn = new THREE.Group(); this.turn.position.y = B; this.squash.add(this.turn);

    this.fc = document.createElement('canvas'); this.fc.width = faceSize; this.fc.height = faceSize / 2;
    this.fx = this.fc.getContext('2d');
    this.faceTex = new THREE.CanvasTexture(this.fc);
    this.faceTex.premultiplyAlpha = true; this.faceTex.colorSpace = THREE.NoColorSpace;
    if (hero) { this.faceTex.generateMipmaps = false; this.faceTex.minFilter = THREE.LinearFilter; }
    else this.faceTex.anisotropy = 4;

    const U = this.u = {
      uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() }, uRim: { value: new THREE.Vector3() },
      uFace: { value: this.faceTex }, uFaceOn: { value: faceless ? 0 : 1 }, uGlow: { value: 0 }, uTime: { value: 0 }, uWobble: { value: 0.012 },
    };
    const mat = u => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: FS });
    this.body = new THREE.Mesh(GEO.body, mat(U)); this.turn.add(this.body);

    const nubU = { ...U, uFace: { value: null }, uFaceOn: { value: 0 }, uWobble: { value: 0 } };
    const nubMat = mat(nubU);
    this.nubR = new THREE.Mesh(GEO.nub, nubMat); this.nubL = new THREE.Mesh(GEO.nub, nubMat);
    this.nubR.scale.set(1, 0.86, 0.9); this.nubL.scale.copy(this.nubR.scale);
    this.turn.add(this.nubR, this.nubL);

    this.ou = { ...U, uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() }, uFace: { value: null }, uFaceOn: { value: 0 }, uWobble: { value: 0 } };
    this.orb = new THREE.Mesh(GEO.orb, mat(this.ou)); this.group.add(this.orb);

    this.shadowMat = new THREE.MeshBasicMaterial({ map: TEX.shadow, transparent: true, depthWrite: false, opacity: 0.5 });
    this.shadow = new THREE.Mesh(GEO.shadow, this.shadowMat);
    this.shadow.rotation.x = -Math.PI / 2; this.shadow.position.y = -B - 0.06; this.group.add(this.shadow);

    this.buildProps();
    this.buildDecor();

    this.s = { expr: 'normal', pose: 'floating', color: 'peach' };
    this.yaw = 0; this.yawTarget = 0; this.tilt = 0;
    this.gaze = { x: 0, y: 0 }; this.gazeTarget = { x: 0, y: 0 };
    this.seed = Math.random() * 100;
    this.nextBlink = 1 + Math.random() * 3; this.blinkAt = -9;
    this.bounceAt = -9; this.popAt = -9; this.happyUntil = -9;
    this.now = 0; this.faceKey = '';
    this.setColor('peach');
    allMascots.add(this);
  }

  buildProps() {
    const lap = this.laptop = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.045, 0.56), MAT.lapDark);
    const lid = new THREE.Group(); lid.position.set(0, 0.02, 0.28); lid.rotation.x = 0.22;
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.56, 0.035), MAT.lap); panel.position.y = 0.28;
    const logo = new THREE.Mesh(new THREE.CircleGeometry(0.045, 24), MAT.logo); logo.position.set(0, 0.3, 0.019);
    lid.add(panel, logo); lap.add(base, lid);
    lap.position.set(0.34, -0.74, 0.98); lap.rotation.y = -0.38;

    const mag = this.magnifier = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.045, 18, 56), MAT.ring);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.25, 40), MAT.glass);
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.36, 18), MAT.ring);
    const d = new THREE.Vector2(0.5, -0.86).normalize();
    handle.position.set(d.x * 0.45, d.y * 0.45, 0); handle.rotation.z = -Math.atan2(d.x, d.y) + Math.PI;
    mag.add(ring, glass, handle);
    mag.position.set(-1.08, 0.18, 0.42); mag.rotation.y = 0.35;

    const bulb = this.bulb = new THREE.Group();
    const glassB = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 24), MAT.bulb);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.07, 0.11, 20), MAT.neck); neck.position.y = -0.17;
    bulb.add(glassB, neck, burst('#ffc14d', 0, 0, [[0, 0.3, 0.13], [-0.25, 0.2, 0.13], [0.25, 0.2, 0.13], [-0.32, -0.02, 0.12], [0.32, -0.02, 0.12]]));
    bulb.position.set(-0.8, 1.12, 0.2);
    this.turn.add(lap, mag); this.root.add(bulb);
  }

  buildDecor() {
    const r = this.root;
    this.q = sprite(TEX.q, 0.36); this.q.position.set(0.98, 1.08, 0.25);
    this.z1 = sprite(TEX.z, 0.2); this.z2 = sprite(TEX.z, 0.32);
    this.sparkR = burst('#ff9f62', 0.62, 0.58, [[0.98, 1.02], [1.16, 0.84], [1.24, 0.6]]);
    this.sparkV = burst('#9d8df6', 0.6, 0.6, [[0.9, 1.08, 0.15], [1.12, 0.92, 0.15]]);
    this.sparkL = burst('#ff9f62', -0.62, 0.58, [[-0.98, 1.0], [-1.18, 0.78], [-1.24, 0.55]]);
    this.wave = burst('#4b5a9e', 0.7, 0.35, [[1.08, 0.72, 0.15], [1.22, 0.52, 0.15]]);
    r.add(this.q, this.z1, this.z2, this.sparkR, this.sparkV, this.sparkL, this.wave);
  }

  initConfetti() {
    const n = 40;
    this.conf = new THREE.InstancedMesh(GEO.conf, MAT.conf, n);
    this.cp = [];
    for (let i = 0; i < n; i++) {
      this.conf.setColorAt(i, CONF_COLORS[i % CONF_COLORS.length]);
      const c = { p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3() };
      this.spawn(c, true); this.cp.push(c);
    }
    this.confDummy = new THREE.Object3D();
    this.group.add(this.conf);
  }
  spawn(c, scatter) {
    const R = Math.random;
    if (scatter) c.p.set((R() - 0.5) * 2.8, R() * 1.9 - 0.4, (R() - 0.5) * 0.8 + 0.2);
    else c.p.set((R() - 0.5) * 0.5, 0.95, 0.2);
    c.v.set((R() - 0.5) * 2.6, 1.8 + R() * 1.8, (R() - 0.5) * 0.9);
    c.r.set(R() * TAU, R() * TAU, R() * TAU);
    c.w.set((R() - 0.5) * 9, (R() - 0.5) * 9, (R() - 0.5) * 9);
  }

  setColor(name) {
    const P = PALETTES[name]; this.s.color = name;
    this.u.uTop.value.copy(v3(P.top)); this.u.uMid.value.copy(v3(P.mid)); this.u.uBottom.value.copy(v3(P.bottom)); this.u.uRim.value.copy(v3(P.rim));
    this.ou.uTop.value.copy(v3(P.orbTop)); this.ou.uMid.value.copy(v3(P.orbTop)).lerp(v3(P.orbBottom), 0.5); this.ou.uBottom.value.copy(v3(P.orbBottom));
    this.shadowMat.color.set(P.shadow);
    this.blush = P.blush; this.faceKey = '';
  }
  setExpr(e) { if (e !== this.s.expr) { this.s.expr = e; this.popAt = this.now; } }
  setPose(p) { if (p !== this.s.pose) { this.s.pose = p; this.popAt = this.now; } }
  bounce() { this.bounceAt = this.now; this.happyUntil = this.now + 1.2; }

  update(t, dt) {
    this.now = t;
    const R = REDUCED, s = this.s;
    const expr = t < this.happyUntil && !['excited', 'celebrating'].includes(s.expr) ? 'happy' : s.expr;
    const pose = s.pose;
    const sleeping = expr === 'sleeping';
    const ft = R ? 0 : t + this.seed;
    this.u.uTime.value = ft;
    this.u.uGlow.value = this.glow ?? (THEME_DARK ? 1 : 0);

    let y = R ? 0 : Math.sin(ft * (sleeping ? 0.8 : 1.5)) * (sleeping ? 0.03 : 0.065);
    let sy = 1 + (R ? 0 : Math.sin(ft * (sleeping ? 1.1 : 2.2)) * (sleeping ? 0.03 : 0.022));
    if (!R && (expr === 'excited' || expr === 'celebrating' || pose === 'cheering')) {
      const hop = Math.abs(Math.sin(ft * 4.2));
      y += hop * 0.11; sy *= 1 + 0.035 * hop - 0.07 * (1 - ss(0, 0.3, hop));
    }
    const bp = (t - this.bounceAt) / 0.9;
    if (!R && bp >= 0 && bp < 1) {
      if (bp < 0.15) sy *= 1 - 0.15 * Math.sin(bp / 0.15 * Math.PI / 2);
      else if (bp < 0.72) { const q = (bp - 0.15) / 0.57; y += Math.sin(q * Math.PI) * 0.42; sy *= 1 + 0.13 * (1 - 2 * q) ** 2; }
      else { const r = (bp - 0.72) / 0.28; sy *= 1 - 0.14 * Math.sin(r * Math.PI) * (1 - 0.4 * r); }
    }
    const pp = (t - this.popAt) / 0.35;
    if (!R && pp >= 0 && pp < 1) sy *= 1 + 0.07 * Math.sin(pp * Math.PI) * (1 - pp);
    const sx = 1 / Math.sqrt(sy);
    this.squash.scale.set(sx, sy, sx);
    this.root.position.y = y;

    // gaze + turn
    const gt = expr === 'thinking' ? { x: 0.6, y: 0.75 } : sleeping ? { x: 0, y: -0.2 } : pose === 'finding' ? { x: -0.55, y: 0.05 } : pose === 'working' ? { x: 0.2, y: -0.55 } : this.gazeTarget;
    const kg = R ? 1 : 1 - Math.exp(-dt * 10);
    this.gaze.x = lerp(this.gaze.x, gt.x, kg); this.gaze.y = lerp(this.gaze.y, gt.y, kg);
    const ky = R ? 1 : 1 - Math.exp(-dt * 6);
    this.yaw = lerp(this.yaw, this.yawTarget + this.gaze.x * 0.26, ky);
    this.turn.rotation.y = this.yaw;
    this.turn.rotation.x = lerp(this.turn.rotation.x, -this.gaze.y * 0.12, ky);
    const tiltT = expr === 'curious' ? 0.13 : expr === 'thinking' ? -0.07 : sleeping ? 0.06 : 0;
    this.tilt = lerp(this.tilt, tiltT, ky); this.root.rotation.z = this.tilt;

    // blink
    if (!R && !STILL && t > this.nextBlink) { this.blinkAt = t; this.nextBlink = t + (Math.random() < 0.2 ? 0.25 : 2.4 + Math.random() * 3); }
    const bt = (t - this.blinkAt) / 0.15;
    const blink = bt >= 0 && bt < 1 ? Math.sin(bt * Math.PI) : 0;

    if (!this.faceless) {
      const key = `${expr}|${this.gaze.x.toFixed(2)}|${this.gaze.y.toFixed(2)}|${blink.toFixed(2)}|${this.blush}`;
      if (key !== this.faceKey) { this.faceKey = key; drawFace(this.fx, this.fc.width, this.fc.height, expr, this.gaze, blink, this.blush); this.faceTex.needsUpdate = true; }
    }

    // orb companion
    const fl = this.faceless;
    this.orb.position.set(fl ? 0.72 : 0.98 + 0.04 * Math.sin(ft * 0.9), (fl ? -0.38 : 0.98) + 0.06 * Math.sin(ft * 1.7 + 1), fl ? 0.75 : 0.15);
    this.orb.scale.setScalar(fl ? 1.9 : 1);
    this.orb.visible = fl || !['curious', 'sleeping', 'surprised', 'excited'].includes(expr) && pose !== 'greeting';

    // shadow
    const sh = 1 - y * 0.55;
    this.shadow.scale.set(2.0 * sh, 1.25 * sh, 1);
    this.shadowMat.opacity = (THEME_DARK && !this.glow ? 0.32 : 0.5) * (1 - y * 0.9);

    // props
    const wave = R ? 0 : Math.sin(ft * 9);
    this.laptop.visible = pose === 'working';
    this.magnifier.visible = pose === 'finding';
    if (this.magnifier.visible) this.magnifier.position.y = 0.18 + (R ? 0 : 0.04 * Math.sin(ft * 1.3));
    this.bulb.visible = pose === 'explaining';
    if (this.bulb.visible) this.bulb.position.y = 1.12 + (R ? 0 : 0.04 * Math.sin(ft * 2));
    this.nubR.visible = pose === 'greeting' || pose === 'thinking' || pose === 'cheering';
    this.nubL.visible = pose === 'cheering';
    if (pose === 'greeting') this.nubR.position.set(0.98 + 0.02 * wave, -0.22 + 0.09 * wave, 0.32);
    if (pose === 'thinking') this.nubR.position.set(0.3, -0.55 + (R ? 0 : 0.015 * Math.sin(ft * 2)), 0.86);
    if (pose === 'cheering') {
      const c = R ? 0.5 : (Math.sin(ft * 8.4) + 1) / 2;
      this.nubR.position.set(0.98, 0.08 + 0.12 * c, 0.26); this.nubL.position.set(-1.0, 0.08 + 0.12 * (1 - c), 0.26);
    }

    // decor
    this.q.visible = expr === 'curious';
    if (this.q.visible) { this.q.position.y = 1.08 + (R ? 0 : 0.05 * Math.sin(ft * 2.2)); this.q.material.rotation = R ? 0.15 : 0.15 + 0.1 * Math.sin(ft * 1.7); }
    this.z1.visible = this.z2.visible = sleeping;
    if (sleeping) {
      [this.z1, this.z2].forEach((z, i) => {
        const ph = R ? 0.35 + i * 0.3 : (ft * 0.3 + i * 0.5) % 1;
        z.position.set(0.66 + ph * 0.42 + i * 0.05, 0.78 + ph * 0.55, 0.3);
        z.material.opacity = R ? 1 : Math.sin(ph * Math.PI);
        z.material.rotation = -0.2;
      });
    }
    const celebrate = expr === 'celebrating' || pose === 'cheering';
    this.sparkR.visible = expr === 'excited' || celebrate;
    this.sparkL.visible = celebrate;
    this.sparkV.visible = expr === 'surprised';
    this.wave.visible = pose === 'greeting';
    const pulse = R ? 1 : 1 + 0.08 * Math.sin(ft * 6);
    for (const g of [this.sparkR, this.sparkL, this.sparkV, this.wave]) if (g.visible) for (const d of g.children) {
      const [x, yy, cx, cy] = d.userData.base;
      d.position.set(cx + (x - cx) * pulse, cy + (yy - cy) * pulse, 0.3);
    }

    // confetti
    if (celebrate && !this.conf) this.initConfetti();
    if (this.conf) {
      this.conf.visible = celebrate;
      if (celebrate && !R) {
        const D = this.confDummy;
        this.cp.forEach((c, i) => {
          c.v.y -= 3.4 * dt; c.v.x *= 0.985; c.v.z *= 0.985; if (c.v.y < -0.9) c.v.y = -0.9;
          c.p.addScaledVector(c.v, dt);
          c.r.x += c.w.x * dt; c.r.y += c.w.y * dt; c.r.z += c.w.z * dt;
          if (c.p.y < -1.0) this.spawn(c, false);
          D.position.copy(c.p); D.rotation.copy(c.r); D.updateMatrix(); this.conf.setMatrixAt(i, D.matrix);
        });
        this.conf.instanceMatrix.needsUpdate = true;
      } else if (celebrate && !this.confStill) {
        const D = this.confDummy; this.confStill = true;
        this.cp.forEach((c, i) => { D.position.copy(c.p); D.rotation.copy(c.r); D.updateMatrix(); this.conf.setMatrixAt(i, D.matrix); });
        this.conf.instanceMatrix.needsUpdate = true;
      }
    }
  }
}

// ---------- the face, painted in angle space (1 canvas px row = same angle both axes) ----------
const INK = '#1b1520';
function drawFace(x, W, H, expr, gaze, blink, blush) {
  const S = W / 2, cx = W / 2, cy = H / 2;
  const P = (ax, ay) => [cx + ax * S, cy - ay * S];
  x.clearRect(0, 0, W, H);
  x.lineCap = 'round'; x.lineJoin = 'round';

  const strong = expr === 'celebrating' || expr === 'excited' || expr === 'happy' || expr === 'sleeping';
  for (const sd of [-1, 1]) {
    const [bx, by] = P(sd * 0.56, -0.03), r = 0.15 * S;
    const g = x.createRadialGradient(bx, by, 0, bx, by, r);
    g.addColorStop(0, `rgba(${blush},${strong ? 0.62 : 0.54})`); g.addColorStop(0.55, `rgba(${blush},${strong ? 0.3 : 0.25})`); g.addColorStop(1, `rgba(${blush},0)`);
    x.fillStyle = g; x.beginPath(); x.ellipse(bx, by, r, r * 0.78, 0, 0, TAU); x.fill();
  }

  const ox = gaze.x * 0.05, oy = gaze.y * 0.035;
  const rx = 0.088 * S, ry = 0.136 * S, lw = 0.032 * S;
  x.strokeStyle = INK; x.fillStyle = INK; x.lineWidth = lw;
  for (const sd of [-1, 1]) {
    const [ex, ey] = P(sd * 0.37 + ox, 0.14 + oy);
    let k = 1 - blink * 0.94;
    const big = expr === 'curious' && sd === 1 ? 1.12 : 1;
    if (expr === 'happy' || expr === 'celebrating') arc(x, ex, ey + ry * 0.2, rx * 1.15, -ry * 0.95);
    else if (expr === 'sleeping') arc(x, ex, ey - ry * 0.05, rx * 1.15, ry * 0.75);
    else if (expr === 'excited') {
      x.beginPath(); x.moveTo(ex + sd * rx * 0.85, ey - ry * 0.62); x.lineTo(ex - sd * rx * 0.75, ey); x.lineTo(ex + sd * rx * 0.85, ey + ry * 0.62); x.stroke();
    } else if (k < 0.3) arc(x, ex, ey, rx * 1.05, ry * 0.3);
    else if (expr === 'surprised') eye(x, ex, ey, rx * 1.15, rx * 1.2 * k, 0, null, true);
    else if (expr === 'focused') eye(x, ex, ey + ry * 0.08, rx, ry * 0.92 * k, 0, sd);
    else eye(x, ex, ey, rx * big, ry * big * k, sd * 0.08);
  }

  const m = (ax, ay) => P((ax + ox * 0.6) * 1.25, (ay + oy * 0.5) * 1.25 + 0.02);
  x.lineWidth = lw * 0.95;
  x.beginPath();
  if (expr === 'happy') { x.moveTo(...m(-0.08, -0.02)); x.quadraticCurveTo(...m(0, -0.11), ...m(0.08, -0.02)); x.stroke(); }
  else if (expr === 'excited' || expr === 'celebrating') {
    x.moveTo(...m(-0.085, -0.02)); x.quadraticCurveTo(...m(0, -0.005), ...m(0.085, -0.02)); x.quadraticCurveTo(...m(0, -0.15), ...m(-0.085, -0.02)); x.closePath();
    x.fillStyle = '#3a1a28'; x.fill(); x.save(); x.clip(); x.fillStyle = '#ff7f96'; x.beginPath(); x.ellipse(...m(0, -0.115), 0.06 * S, 0.04 * S, 0, 0, TAU); x.fill(); x.restore();
    x.fillStyle = INK;
  } else if (expr === 'surprised') { x.ellipse(...m(0, -0.06), 0.028 * S, 0.036 * S, 0, 0, TAU); x.fillStyle = '#3a1a28'; x.fill(); x.fillStyle = INK; }
  else if (expr === 'thinking') { x.moveTo(...m(0.0, -0.045)); x.quadraticCurveTo(...m(0.035, -0.06), ...m(0.07, -0.035)); x.stroke(); }
  else if (expr === 'focused') { x.moveTo(...m(-0.035, -0.05)); x.lineTo(...m(0.035, -0.05)); x.stroke(); }
  else if (expr === 'sleeping') { x.moveTo(...m(-0.035, -0.04)); x.quadraticCurveTo(...m(0, -0.075), ...m(0.035, -0.04)); x.stroke(); }
  else if (expr === 'curious') { x.moveTo(...m(-0.055, -0.03)); x.quadraticCurveTo(...m(0, -0.085), ...m(0.05, -0.04)); x.stroke(); }
  else { x.moveTo(...m(-0.068, -0.025)); x.quadraticCurveTo(...m(0, -0.1), ...m(0.068, -0.025)); x.stroke(); }
}
function arc(x, cx, cy, hw, bend) { x.beginPath(); x.moveTo(cx - hw, cy); x.quadraticCurveTo(cx, cy + bend, cx + hw, cy); x.stroke(); }
function eye(x, cx, cy, rx, ry, rot, lidSide, round) {
  x.save(); x.translate(cx, cy); x.rotate(rot);
  if (lidSide) { // determined lids: inner corner lower
    x.beginPath(); x.moveTo(lidSide * rx * 1.4, -ry * 0.62); x.lineTo(-lidSide * rx * 1.4, -ry * 0.05); x.lineTo(-lidSide * rx * 1.4, ry * 2); x.lineTo(lidSide * rx * 1.4, ry * 2); x.closePath(); x.clip();
  }
  const g = x.createRadialGradient(-rx * 0.3, -ry * 0.35, ry * 0.08, 0, 0, Math.max(rx, ry) * 1.1);
  g.addColorStop(0, '#2c2432'); g.addColorStop(1, '#0d0910');
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,255,255,.96)';
  x.beginPath(); x.ellipse(-rx * 0.3, -ry * (round ? 0.38 : 0.42), rx * (round ? 0.3 : 0.34), Math.max(1, ry * (round ? 0.3 : 0.24)), -0.5, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,255,255,.5)';
  x.beginPath(); x.ellipse(rx * 0.32, ry * 0.42, rx * 0.13, Math.max(1, ry * 0.09), 0, 0, TAU); x.fill();
  x.restore(); x.fillStyle = INK;
}

// ---------- scenes ----------
function makeScene(m) {
  const scene = new THREE.Scene();
  scene.add(m.group, new THREE.HemisphereLight('#fff4ec', '#ead8ff', 1.3));
  const d = new THREE.DirectionalLight('#ffffff', 1.7); d.position.set(-2, 3, 5); scene.add(d);
  return scene;
}
function makeCam(z = 6.4, ty = 0.14) {
  const c = new THREE.PerspectiveCamera(30, 1, 0.1, 50); c.position.set(0, 0.42, z); c.lookAt(0, ty, 0); return c;
}

// One mascot, one canvas. It flies to whichever slot the app names, and tracks that slot every frame.
const canvas = document.getElementById('mate');
const BASE = 360;
const heroR = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
heroR.setPixelRatio(Math.min(devicePixelRatio, 2));
heroR.setSize(BASE, BASE, false);
canvas.style.width = canvas.style.height = BASE + 'px';
const hero = new Mascot({ faceSize: 1024, hero: true });
const scene = makeScene(hero), cam = makeCam(5.7, 0.2);
const say = document.getElementById('say');
const cur = { x: innerWidth / 2, y: innerHeight / 2, s: 80 };
let target = null, want = { slot: null }, placed = false, sayUntil = 0, last = performance.now() / 1000;
const syncDark = () => {
  const a = document.documentElement.dataset.theme;
  THEME_DARK = a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
};
const K = 0.68; // the body fills about this share of the canvas
window.Mate = {
  go(o) {
    const sameSay = want.say === o.say;
    want = o;
    if (o.expr) hero.setExpr(o.expr);
    if (o.pose) hero.setPose(o.pose);
    if (o.say && !sameSay) { say.textContent = o.say; say.classList.add('on'); sayUntil = performance.now() + 4200; }
    if (!o.say) { say.classList.remove('on'); }
  },
  bounce() { hero.bounce(); },
  state: () => ({ expr: hero.s.expr, pose: hero.s.pose, visible: canvas.style.opacity === '1', x: cur.x, y: cur.y, s: cur.s }),
  syncDark,
};
addEventListener('pointermove', e => {
  const dx = (e.clientX - cur.x) / 300, dy = (e.clientY - cur.y) / 300;
  hero.gazeTarget = { x: Math.max(-1, Math.min(1, dx)), y: Math.max(-1, Math.min(1, -dy)) };
});
addEventListener('pointerdown', e => { if (Math.hypot(e.clientX - cur.x, e.clientY - cur.y) < cur.s * .5) hero.bounce(); });
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const now = performance.now() / 1000, dt = Math.min(0.1, now - last); last = now;
  syncDark();
  let el = null;
  for (const sel of want.slot || []) {
    const c = document.querySelector(sel);
    if (!c) continue;
    const r = c.getBoundingClientRect();
    if (r.width && r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight) { el = c; target = { x: r.left + r.width / 2, y: r.top + r.height / 2, s: r.width }; break; }
  }
  canvas.style.opacity = el ? '1' : '0';
  if (!el) { say.classList.remove('on'); }
  if (target) {
    const k = REDUCED || !placed ? 1 : 1 - Math.exp(-dt * 7);
    cur.x = lerp(cur.x, target.x, k); cur.y = lerp(cur.y, target.y, k); cur.s = lerp(cur.s, target.s, k);
    placed = true;
    const css = cur.s / K, sc = css / BASE;
    canvas.style.transform = `translate(${cur.x - css / 2}px,${cur.y - css / 2}px) scale(${sc})`;
    if (say.classList.contains('on')) {
      const w = say.offsetWidth, h = say.offsetHeight;
      const x = Math.max(8, Math.min(innerWidth - w - 8, cur.x - w / 2));
      let y = cur.y - cur.s * .62 - h - (el && el.id === 'm-clip' ? 62 : 0);
      if (y < 8) y = cur.y + cur.s * .62;
      say.style.transform = `translate(${x}px,${y}px)`;
    }
  }
  if (sayUntil && performance.now() > sayUntil) { say.classList.remove('on'); sayUntil = 0; }
  hero.update(now, dt);
  heroR.render(scene, cam);
}
frame();
window.dispatchEvent(new Event('mate-ready'));

}).catch(err => { document.getElementById('mate').classList.add('fallback'); console.warn('Mascot could not load', err); });
</script>
