*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Geist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3,p{margin:0}
.lab{font:500 10.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
#app{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 14px;border-radius:9px;white-space:nowrap;font-weight:500;border:1px solid var(--line);background:var(--surface);transition:background .15s,transform .12s var(--ease),opacity .15s}
.btn:hover{background:var(--raise)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:transparent;font-weight:600}.btn.pri:hover{background:var(--pri-h)}
.btn.ghost{border-color:transparent;background:none;color:var(--mut)}.btn.ghost:hover{background:var(--raise);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.h1{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.018em}
.h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sub{color:var(--mut);margin-top:3px}
.enter{animation:rise .24s var(--ease) both}
.fresh{animation:fadein .34s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sk{display:block;background:var(--skel);border-radius:6px;animation:breathe 1.5s ease-in-out infinite;color:transparent!important;user-select:none}
@keyframes breathe{50%{opacity:.5}}
.say{display:grid;grid-template-columns:82px 1fr;gap:4px 12px;margin-top:10px}
.say .lab{padding-top:3px}
.note{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.note.warn{background:var(--warn-b);border-color:transparent}.note.bad{background:var(--bad-b);border-color:transparent}.note.ok{background:var(--ok-b);border-color:transparent}
.note b{font-weight:600;display:block}.note.warn b{color:var(--warn)}.note.bad b{color:var(--bad)}.note.ok b{color:var(--ok)}
.note .btns{margin-top:10px}.note p{color:var(--ink);opacity:.86}
.waitrow{display:flex;gap:14px;align-items:flex-start}

.m3d .mas{background-image:none}
.waitrow .grow{min-width:0;flex:1}
.pulse{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:15px;background:var(--raise);font-size:12.5px;max-width:100%;text-align:left}.pulse span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse:hover{background:var(--line)}
.first{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}.first .btns{margin-top:12px;justify-content:center}.first p{max-width:420px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 16px}
.empty .mas{width:112px;height:112px;margin-bottom:2px}.empty .btns{margin-top:10px;justify-content:center}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}.row .grow{flex:1;min-width:0}
.tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;background:var(--ok-b);color:var(--ok)}
.tick.w{background:var(--warn-b);color:var(--warn)}.tick.b{background:var(--bad-b);color:var(--bad)}.tick.n{background:var(--raise);color:var(--faint)}
.pips{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}.pips i{width:22px;height:8px;border-radius:3px;background:var(--raise);transition:background .25s}.pips i.on{background:var(--rib1)}.pips i.bad{background:var(--bad)}
.pgh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rib{display:grid;grid-template-columns:minmax(96px,132px) 1fr 62px;gap:10px;align-items:center;padding:7px 0}
.rib .bar{height:18px;border-radius:5px;background:linear-gradient(90deg,var(--rib1),var(--rib2));min-width:3px}
.rib .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rib .nm small{display:block;color:var(--faint);font-size:11px;line-height:1.2}
.rib.dim .bar{opacity:.45}.rib.dim .val{color:var(--mut)}
.drop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:10px;background:var(--raise);margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tbl td,.tbl th{padding:8px 8px 8px 0;border-top:1px solid var(--line);text-align:right;font-weight:400}.tbl th{border:0;font-weight:500;color:var(--faint);font-size:12px}.tbl td:first-child,.tbl th:first-child{text-align:left}
.tblwrap{overflow-x:auto}
.tla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tla h3{font-size:13px;font-weight:600;margin-bottom:6px}.tla p{margin-bottom:8px}.tla small{display:block;color:var(--mut);font-size:12px;line-height:1.4}
.chg{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.chg:first-child{border-top:0}
.chg .sym{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;font-weight:600;font-size:13px}
.sym.add{background:var(--ok-b);color:var(--ok)}.sym.cut{background:var(--bad-b);color:var(--bad)}.sym.edit{background:var(--warn-b);color:var(--warn)}
.chg .grow{flex:1;min-width:0}.chg small{display:block;color:var(--mut);font-size:12.5px}.chg.off .grow{opacity:.42}.chg s{text-decoration-thickness:1px}
.sw{width:36px;height:21px;border-radius:11px;background:var(--raise);position:relative;flex:none;transition:background .18s var(--ease);border:1px solid var(--line)}
.sw::after{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:var(--mut);transition:transform .18s var(--ease),background .18s}
.sw[aria-checked=true]{background:var(--pri);border-color:transparent}.sw[aria-checked=true]::after{transform:translateX(15px);background:var(--pri-ink)}
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}

</style></head><body><div id="app"></div>
<script>const MJOB={happy:'happy|greeting',sleeping:'sleeping|floating',focused:'focused|working',surprised:'surprised|floating',cheer:'celebrating|cheering'};
const STATES=[['normal','Bình thường'],['running','Đang chạy'],['long','Chạy lâu'],['error','Lỗi'],['empty','Trống'],['limited','Bị giới hạn']];
const STEPS=[['first','0 Mở lần đầu'],['pull','1 Pull'],['insight','2 Insight'],['plan','3 Plan'],['gate1','4 Gate 1'],['cook','5 Cook'],['gate2','6 Gate 2 + đăng']];
const baseline=()=>({st:{pull:'normal',insight:'normal',plan:'normal',gate1:'normal',cook:'normal',gate2:'empty'},prog:{},focus:'insight',view:'',sw:[1,1,1,1],approved:false,cookDone:false,ask:false,note:'',noteSent:false,okN:4,when:'Fri, Oct 30 at 7:30 PM',stopAt:4,planAt:3,pub:0,stopped:false,first:false,open:null,x:{}});
let S=baseline();
const pl=(n,w,p)=>n+' '+(n===1?w:(p||w+'s'));
const mascot=(n,c='')=>`<canvas class="mas st-${n==='cheer'?'happy':n==='surprised'?'focused':n} ${c}" data-mascot="${MJOB[n]}" aria-hidden="true"></canvas>`;
const btn=(label,act,o={})=>`<button class="btn ${o.k||''}" data-act="${act}" ${o.arg!=null?`data-arg="${o.arg}"`:''} data-testid="${o.id||act}" ${o.off?'disabled':''}>${label}</button>`;
const say=(you,wait)=>`<div class="say"><span class="lab">You can</span><span>${you}</span><span class="lab">If you wait</span><span>${wait}</span></div>`;
const NOTEM={bad:'surprised',warn:'sleeping',ok:'cheer'};
const note=(k,t,b,btns='')=>`<div class="note ${k} ${NOTEM[k]?'waitrow':''}">${NOTEM[k]?mascot(NOTEM[k]):''}<div class="grow"><b>${t}</b><p>${b}</p>${btns?`<div class="btns">${btns}</div>`:''}</div></div>`;
const empty=(m,t,b,btns='')=>`<div class="empty">${mascot(m)}<div class="h2">${t}</div><p class="mut">${b}</p>${btns?`<div class="btns">${btns}</div>`:''}</div>`;
const longNote=(t,b)=>`<div class="note waitrow">${mascot('focused')}<div><b>${t}</b><p class="mut">${b}</p></div></div>`;
const brand=()=>`<span class="mark"></span>`;
const workBtn=()=>V.work?btn("See Claude's work",'work',{k:'ghost',id:'cook-work'}):'';
const WORK=`<div class="term">claude  make-reel hooks-in-one-picture
step 3 of 6: chapters
  chapter 1 done
  chapter 2 done
  chapter 3 building</div><div class="lab" style="margin-top:20px">Files</div><div class="term">script.json
voice.mp3
chapters/
draft.mp4</div>`;
const wrap=(step,html,c='')=>`<div class="stack ${c}" data-testid="step-${step}" data-state="${S.st[step]}">${html}</div>`;

/* ---------- 1 Pull ---------- */
const RIV=['@nocodealex','@devtool.daily','@shipfast.dev','@agentdaily','@vibecode.lab'];
const SRC=[['Instagram','Your channel: reels, reach, follows','today 7:12 AM'],['Instagram rivals','13 rivals, public numbers','today 7:14 AM'],['ChatbotX','Keyword comments and gift DMs','today 7:12 AM'],['Umami','Gift page visits and checkout clicks','today 7:12 AM'],['Polar','Purchases','today 7:12 AM']];
function pullBody(){
  const s=S.st.pull,n=S.prog.pull??4;
  const rows=(lim)=>`<div class="card" style="padding:4px 16px">${SRC.map((r,i)=>{
    const bad=lim&&i===1;return `<div class="row"><span class="tick ${bad?(s==='error'?'b':'w'):''}">${bad?'!':'✓'}</span><div class="grow"><div>${r[0]}</div><div class="mut" style="font-size:12.5px">${r[1]}</div></div><span class="mut num" style="font-size:12.5px;white-space:nowrap">${bad?'3 of 13':r[2]}</span></div>`}).join('')}</div>`;
  const pips=(k,bad)=>`<div class="pips">${Array.from({length:13},(_,i)=>`<i class="${i<k?'on':(bad&&i===k?'bad':'')}"></i>`).join('')}</div>`;
  const mm=(x)=>{const m=Math.floor(x/60),t=x%60;return m+':'+String(t).padStart(2,'0')};
  if(s==='empty')return wrap('pull',`<div class="card">${empty('happy','Nothing connected yet.','Connect Instagram and your first numbers come in. Lead Studio pulls only when you ask.',btn('Connect Instagram','connect',{k:'pri',id:'pull-connect'}))}</div>`);
  if(s==='normal')return wrap('pull',`<div class="pgh"><p class="mut">Pulled when you ask, never on a timer.</p>${btn('Pull everything','pull',{k:'pri',id:'pull-go'})}</div>${rows()}`);
  if(s==='running'||s==='long')return wrap('pull',`<div class="card"><div class="pgh"><div class="waitrow" style="align-items:center">${mascot('focused','sm')}<div class="h2">Pulling rivals</div></div><span class="mut num">${s==='long'?'2:04':mm(n*6)}</span></div>${pips(n)}<div class="pgh"><span><span class="num">${n} of 13 rivals</span> <span class="mut">· next ${RIV[n%5]}</span></span>${btn('Stop','pullstop',{k:'ghost',id:'pull-stop'})}</div>${say('Leave this screen. The pull keeps going.','New numbers show up on their own. Rivals you have not reached keep their older numbers.')}</div>${s==='long'?longNote('Taking longer than usual (2:00).','Instagram is answering slowly, so Lead Studio waits between rivals to avoid a limit. You can leave; the pull keeps going.'):''}${rows()}`);
  if(s==='error')return wrap('pull',S.stopped?note('',`You stopped the pull at ${S.stopAt} of 13.`,`${S.stopAt===1?'1 rival has':S.stopAt+' rivals have'} new numbers. The other ${13-S.stopAt} keep their older numbers.`,btn(`Pull the rest (${13-S.stopAt})`,'pullrest',{k:'pri',id:'pull-rest',arg:S.stopAt})):note('bad','Could not reach Instagram.','3 rivals have new numbers. The other 10 keep their older numbers.',btn('Pull the rest (10)','pullrest',{k:'pri',id:'pull-rest',arg:3}))+rows(1));
  return wrap('pull',note('warn','Instagram is limiting requests. The pull stopped at 3 of 13.','3 rivals have new numbers. The other 10 keep their older numbers. You can pull the rest after 11:20 PM.',btn('Pull the rest (10) · after 11:20 PM','noop',{off:1,id:'pull-later'}))+rows(1));
}

/* ---------- 2 Insight ---------- */
const F=[['Reel views',48200,'Instagram'],['Keyword comments',612,'Instagram'],['Gift DMs',388,'ChatbotX'],['Gift page visits',141,'Umami'],['Checkout clicks',23,'Umami'],['Purchases',3,'Polar']];
const KW=[['hooks',18400,214,139,52,9,2],['coding',21300,290,171,63,11,1],['kit',6100,74,52,19,2,0],['audit',2400,34,26,7,1,0]];
const REELS=[['Your first hook in 30 seconds','Oct 15',18400,'hooks'],['Cursor deleted my repo','Oct 9',14900,'coding'],['Claude Code, first look','Oct 17',8600,'coding'],['3 free repos to start with','Oct 24',6300,'kit']];
const ribW=v=>Math.max(1.5,Math.log10(v+1)/Math.log10(48201)*100);
function funnelRows(o={}){return F.map((r,i)=>{
  const gone=o.missing&&i>=3, sk=o.skel&&i>=(o.skelFrom||0);
  return `<div class="rib ${o.dim?'dim':''}"><div class="nm">${r[0]}<small>${r[2]}</small></div><div>${sk?'<span class="sk" style="height:18px;width:'+ribW(r[1])+'%"></span>':gone?'':`<div class="bar" style="width:${ribW(r[1])}%"></div>`}</div><div class="val">${sk?'<span class="sk">000</span>':gone?'<span class="mut">—</span>':r[1].toLocaleString('en-US')}</div></div>`}).join('')+'<p class="mut" style="font-size:12px;margin-top:6px">Bars use a log scale, so the small steps stay visible.</p>'}
const DROP=`<div class="drop"><div><span class="lab">Biggest drop</span><div class="h2" style="margin-top:2px">Gift page to checkout: 16% go on</div></div></div>`;
function funnelBody(){
  const s=S.st.insight;
  if(s==='empty')return wrap('insight',empty('sleeping','No numbers yet.','One pull fills this in, from first view to last purchase.',btn('Pull my numbers','gopull',{k:'pri',id:'insight-pull'})));
  if(s==='running')return wrap('insight',`<div class="drop"><div><span class="lab">Biggest drop</span><div class="h2 sk" style="margin-top:4px">Gift page to checkout: 16% go on</div></div></div><div>${funnelRows({skel:1})}</div>`);
  if(s==='long')return wrap('insight',longNote('Polar is taking longer than usual (0:48).','The other numbers are ready. Purchases fill in when Polar answers.')+DROP+`<div>${funnelRows({skel:1,skelFrom:5})}</div>`);
  if(s==='error')return wrap('insight',note('bad','Instagram pull failed.','These numbers are from yesterday, 10:00 PM. Everything else is current.',btn('Pull again','insightretry',{k:'pri',id:'insight-retry'}))+`<div>${funnelRows({dim:1})}</div>`);
  if(s==='limited')return wrap('insight',note('warn','Missing 2 sources.','Umami and Polar are not connected, so the last three steps are blank. The rest is complete.',btn('Connect them','gosources',{id:'insight-connect'}))+`<div>${funnelRows({missing:1})}</div>`);
  return wrap('insight',`${DROP}<div>${funnelRows()}</div>`);
}
const kwTable=()=>`<div class="tblwrap"><table class="tbl"><tr><th>Keyword</th><th>Views</th><th>Comments</th><th>DMs</th><th>Visits</th><th>Clicks</th><th>Buys</th></tr>${KW.map(k=>`<tr>${k.map((v,i)=>`<td>${i?v.toLocaleString('en-US'):v}</td>`).join('')}</tr>`).join('')}</table></div>`;
const reelsTable=()=>`<div class="tblwrap"><table class="tbl"><tr><th>Reel</th><th>Posted</th><th>Keyword</th><th>Views</th></tr>${REELS.map(r=>`<tr><td>${r[0]}</td><td class="mut">${r[1]}</td><td class="mut">${r[3]}</td><td>${r[2].toLocaleString('en-US')}</td></tr>`).join('')}</table></div>`;
const TLA=[['Take','Keyword in the first line of the caption','@nocodealex does it on 33 of 34 reels. You: 0 of 16.'],['Learn','A real error on screen','4.6 times the median on 4 channels. Open on the error itself.'],['Avoid','Asking for a follow before the gift','@agentdaily loses about 38% at that step.']];
function rivalsBody(){
  const s=S.st.insight;
  if(s==='empty')return `<div>${empty('sleeping','No rivals yet.','Add one rival and Lead Studio tells you what to take, learn and avoid.',btn('Add a rival','insightretry',{id:'rival-add'}))}</div>`;
  if(s==='running')return `<div class="tla">${TLA.map(t=>`<div class="card"><h3 class="sk">${t[0]}</h3><p class="sk">${t[1]}</p><small class="sk">${t[2]}</small></div>`).join('')}</div>`;
  const pre=s==='error'?note('bad','Rival numbers are from yesterday.','Instagram did not answer. Take, Learn and Avoid still use yesterday\'s numbers.'):s==='limited'?note('warn','3 of 13 rivals have new numbers.','The other 10 keep older numbers until you pull the rest after 11:20 PM.'):s==='long'?longNote('Still reading rivals (2:04).','You can leave. These three lines update when it finishes.'):'';
  return `<div class="stack">${pre}<div class="tla">${TLA.map(t=>`<div class="card"><h3>${t[0]}</h3><p>${t[1]}</p><small>${t[2]}</small></div>`).join('')}</div></div>`;
}

/* ---------- 3 Plan ---------- */
const WEEK0=[['Mon','Oct 26','Cursor deleted my repo','Posted','g'],['Tue','Oct 27','5 MCP servers worth installing','Cooked',''],['Wed','Oct 28','Hooks in one picture','Ready',''],['Thu','Oct 29','','',''],['Fri','Oct 30','','',''],['Sat','Oct 31','Claude Code in 60 seconds','Ready',''],['Sun','Nov 1','Week 44 in numbers','Ready','']];
const WEEK1=[['Mon','Oct 26','Cursor deleted my repo','Posted','g'],['Tue','Oct 27','','',''],['Wed','Oct 28','Hooks in one picture','Ready to cook',''],['Thu','Oct 29','Sales reel: 0 to 2 orders','New',''],['Fri','Oct 30','3 MCP mistakes','New',''],['Sat','Oct 31','Claude Code in 60 seconds','Ready',''],['Sun','Nov 1','Week 44 in numbers','Ready','']];
const week=()=>{let w=(S.approved?WEEK1:WEEK0).map(d=>[...d]);if(S.cookDone){w[2][3]=S.pub===2?'Scheduled':'Draft ready'}if(S.st.plan==='limited'){w[3][2]='Sales reel: 0 to 2 orders';w[3][3]='Needs a gift';w[3][4]='w';w[4][2]='3 MCP mistakes';w[4][3]='Needs an offer';w[4][4]='w'}return w};
function planNote(){
  const s=S.st.plan,n=S.prog.plan??3;
  if(s==='running')return `<div class="note"><div class="pgh"><b>Claude is writing next week</b><span class="mut num">${n} of 7 days</span></div>${say('Leave. The days appear here as Claude writes them.','You get a list of changes to approve. Nothing goes live before that.')}${btn('Stop','planstop',{k:'ghost',id:'plan-stop'})}</div>`;
  if(s==='long')return longNote('Taking longer than usual (4:10).','Claude is reading 5 rivals before it writes. The 3 days done so far are saved. You can leave.');
  if(s==='error'){const a=S.planAt;return note('bad',a?`Claude stopped at ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][a]}.`:'Claude stopped before writing a day.',a?`The ${a===1?'day':a+' days'} it wrote ${a===1?'is':'are'} saved.`:'Nothing was lost.',btn(`Write the rest (${7-a})`,'planrest',{k:'pri',id:'plan-rest'}))}
  if(s==='limited')return note('warn','2 of 7 reels cannot post yet.','Thursday needs a gift and Friday needs an offer. They can still cook; they just cannot post.',btn('Add the gift','giftok',{id:'plan-gift'}));
  return '';
}
const planEmpty=()=>empty('sleeping','No plan for this week.','Ask Claude for one. It reads your numbers and your rivals first.',btn('Ask Claude for a plan','planask',{k:'pri',id:'plan-ask'}));

/* ---------- engine ---------- */

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k)S[k]=e.target.value});
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
let J=0,I=0,playing=false,runId=0;
function setStep(i){const st=V.journeys[J].steps[i];I=i;clearInterval(simT);S=baseline();Object.assign(S,JSON.parse(JSON.stringify(st.set||{})));S.st={...baseline().st,...(st.st||{})};go(st.go,st.goArg);if(st.fn)st.fn(S);render();syncDemo();$('#cap').textContent=st.cap;
  const t=st.click?$(`[data-testid="${st.click}"]`):null;if(t)t.scrollIntoView({block:'center',behavior:'instant'});moveCursor(t);if(st.scrollTo){const s=$(`[data-testid="${st.scrollTo}"]`);if(s)s.scrollIntoView({block:'center'})}}

// ---------- shared geometry ----------

function withDir(g) { g.setAttribute('dir', g.attributes.normal.clone()); return g; }
function blobGeometry() {
  const g = new THREE.SphereGeometry(1, 112, 80);
  const p = g.attributes.position, dir = new Float32Array(p.count * 3), v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {

attribute vec3 dir;

uniform vec3 uTop, uMid, uBottom, uRim;
uniform sampler2D uFace;

const CONF_COLORS = ['#ff9f6e', '#9b8cf5', '#5ccfa0', '#ffc94d', '#ff7ea1', '#6aa5ff'].map(c => new THREE.Color(c));

function sprite(tex, w, h = w) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(w, h, 1); return s;
}
// little radiating dashes, like the "!" marks on the boards
function burst(color, cx, cy, pts) {
  const g = new THREE.Group();
  for (const [x, y, len = 0.17] of pts) {
    const s = sprite(dash(color), len, len / 4);
    s.material.rotation = Math.atan2(y - cy, x - cx);
    s.position.set(x, y, 0.3); s.userData.base = [x, y, cx, cy]; g.add(s);

let THEME_DARK = false;
const allMascots = new Set();

// ---------- the mascot ----------
class Mascot {
  constructor({ faceSize = 512, hero = false, faceless = false } = {}) {
    this.hero = hero; this.faceless = faceless;
    this.group = new THREE.Group();
    this.root = new THREE.Group(); this.group.add(this.root);
    this.squash = new THREE.Group(); this.squash.position.y = -B; this.root.add(this.squash);
    this.turn = new THREE.Group(); this.turn.position.y = B; this.squash.add(this.turn);

    this.fc = document.createElement('canvas'); this.fc.width = faceSize; this.fc.height = faceSize / 2;
    this.fx = this.fc.getContext('2d');
    this.faceTex = new THREE.CanvasTexture(this.fc);
    this.faceTex.premultiplyAlpha = true; this.faceTex.colorSpace = THREE.NoColorSpace;
    if (hero) { this.faceTex.generateMipmaps = false; this.faceTex.minFilter = THREE.LinearFilter; }
    else this.faceTex.anisotropy = 4;

    const U = this.u = {
      uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() }, uRim: { value: new THREE.Vector3() },
      uFace: { value: this.faceTex }, uFaceOn: { value: faceless ? 0 : 1 }, uGlow: { value: 0 }, uTime: { value: 0 }, uWobble: { value: 0.012 },
    };
    const mat = u => new THREE.ShaderMaterial({ uniforms: u, vertexShader: VS, fragmentShader: FS });
    this.body = new THREE.Mesh(GEO.body, mat(U)); this.turn.add(this.body);

    const nubU = { ...U, uFace: { value: null }, uFaceOn: { value: 0 }, uWobble: { value: 0 } };
    const nubMat = mat(nubU);
    this.nubR = new THREE.Mesh(GEO.nub, nubMat); this.nubL = new THREE.Mesh(GEO.nub, nubMat);
    this.nubR.scale.set(1, 0.86, 0.9); this.nubL.scale.copy(this.nubR.scale);
    this.turn.add(this.nubR, this.nubL);

    this.ou = { ...U, uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBottom: { value: new THREE.Vector3() }, uFace: { value: null }, uFaceOn: { value: 0 }, uWobble: { value: 0 } };
    this.orb = new THREE.Mesh(GEO.orb, mat(this.ou)); this.group.add(this.orb);

    this.shadowMat = new THREE.MeshBasicMaterial({ map: TEX.shadow, transparent: true, depthWrite: false, opacity: 0.5 });
    this.shadow = new THREE.Mesh(GEO.shadow, this.shadowMat);
    this.shadow.rotation.x = -Math.PI / 2; this.shadow.position.y = -B - 0.06; this.group.add(this.shadow);

    this.buildProps();
    this.buildDecor();

    this.s = { expr: 'normal', pose: 'floating', color: 'peach' };
    this.yaw = 0; this.yawTarget = 0; this.tilt = 0;
    this.gaze = { x: 0, y: 0 }; this.gazeTarget = { x: 0, y: 0 };
    this.seed = Math.random() * 100;
    this.nextBlink = 1 + Math.random() * 3; this.blinkAt = -9;
    this.bounceAt = -9; this.popAt = -9; this.happyUntil = -9;
    this.now = 0; this.faceKey = '';

  }

  buildProps() {
    const lap = this.laptop = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.045, 0.56), MAT.lapDark);
    const lid = new THREE.Group(); lid.position.set(0, 0.02, 0.28); lid.rotation.x = 0.22;
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.56, 0.035), MAT.lap); panel.position.y = 0.28;
    const logo = new THREE.Mesh(new THREE.CircleGeometry(0.045, 24), MAT.logo); logo.position.set(0, 0.3, 0.019);
    lid.add(panel, logo); lap.add(base, lid);
    lap.position.set(0.34, -0.74, 0.98); lap.rotation.y = -0.38;

    const mag = this.magnifier = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.045, 18, 56), MAT.ring);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.25, 40), MAT.glass);
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.36, 18), MAT.ring);
    const d = new THREE.Vector2(0.5, -0.86).normalize();
    handle.position.set(d.x * 0.45, d.y * 0.45, 0); handle.rotation.z = -Math.atan2(d.x, d.y) + Math.PI;
    mag.add(ring, glass, handle);
    mag.position.set(-1.08, 0.18, 0.42); mag.rotation.y = 0.35;

    const bulb = this.bulb = new THREE.Group();
    const glassB = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 24), MAT.bulb);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.07, 0.11, 20), MAT.neck); neck.position.y = -0.17;
    bulb.add(glassB, neck, burst('#ffc14d', 0, 0, [[0, 0.3, 0.13], [-0.25, 0.2, 0.13], [0.25, 0.2, 0.13], [-0.32, -0.02, 0.12], [0.32, -0.02, 0.12]]));
    bulb.position.set(-0.8, 1.12, 0.2);
    this.turn.add(lap, mag); this.root.add(bulb);
  }

  buildDecor() {
    const r = this.root;
    this.q = sprite(TEX.q, 0.36); this.q.position.set(0.98, 1.08, 0.25);
    this.z1 = sprite(TEX.z, 0.2); this.z2 = sprite(TEX.z, 0.32);
    this.sparkR = burst('#ff9f62', 0.62, 0.58, [[0.98, 1.02], [1.16, 0.84], [1.24, 0.6]]);
    this.sparkV = burst('#9d8df6', 0.6, 0.6, [[0.9, 1.08, 0.15], [1.12, 0.92, 0.15]]);
    this.sparkL = burst('#ff9f62', -0.62, 0.58, [[-0.98, 1.0], [-1.18, 0.78], [-1.24, 0.55]]);
    this.wave = burst('#4b5a9e', 0.7, 0.35, [[1.08, 0.72, 0.15], [1.22, 0.52, 0.15]]);
    r.add(this.q, this.z1, this.z2, this.sparkR, this.sparkV, this.sparkL, this.wave);
  }

  initConfetti() {
    const n = 40;
    this.conf = new THREE.InstancedMesh(GEO.conf, MAT.conf, n);
    this.cp = [];
    for (let i = 0; i < n; i++) {
      this.conf.setColorAt(i, CONF_COLORS[i % CONF_COLORS.length]);
      const c = { p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3() };

  }
  spawn(c, scatter) {
    const R = Math.random;

    else c.p.set((R() - 0.5) * 0.5, 0.95, 0.2);
    c.v.set((R() - 0.5) * 2.6, 1.8 + R() * 1.8, (R() - 0.5) * 0.9);
    c.r.set(R() * TAU, R() * TAU, R() * TAU);
    c.w.set((R() - 0.5) * 9, (R() - 0.5) * 9, (R() - 0.5) * 9);
  }

  setColor(name) {
    const P = PALETTES[name]; this.s.color = name;
    this.u.uTop.value.copy(v3(P.top)); this.u.uMid.value.copy(v3(P.mid)); this.u.uBottom.value.copy(v3(P.bottom)); this.u.uRim.value.copy(v3(P.rim));
    this.ou.uTop.value.copy(v3(P.orbTop)); this.ou.uMid.value.copy(v3(P.orbTop)).lerp(v3(P.orbBottom), 0.5); this.ou.uBottom.value.copy(v3(P.orbBottom));
    this.shadowMat.color.set(P.shadow);
    this.blush = P.blush; this.faceKey = '';
  }
  setExpr(e) { if (e !== this.s.expr) { this.s.expr = e; this.popAt = this.now; } }
  setPose(p) { if (p !== this.s.pose) { this.s.pose = p; this.popAt = this.now; } }
  bounce() { this.bounceAt = this.now; this.happyUntil = this.now + 1.2; }

  update(t, dt) {
    this.now = t;
    const R = REDUCED, s = this.s;
    const expr = t < this.happyUntil && !['excited', 'celebrating'].includes(s.expr) ? 'happy' : s.expr;
    const pose = s.pose;
    const sleeping = expr === 'sleeping';
    const ft = R ? 0 : t + this.seed;
    this.u.uTime.value = ft;
    this.u.uGlow.value = this.glow ?? (THEME_DARK ? 1 : 0);

    let y = R ? 0 : Math.sin(ft * (sleeping ? 0.8 : 1.5)) * (sleeping ? 0.03 : 0.065);
    let sy = 1 + (R ? 0 : Math.sin(ft * (sleeping ? 1.1 : 2.2)) * (sleeping ? 0.03 : 0.022));
    if (!R && (expr === 'excited' || expr === 'celebrating' || pose === 'cheering')) {
      const hop = Math.abs(Math.sin(ft * 4.2));

    }
    const pp = (t - this.popAt) / 0.35;
    if (!R && pp >= 0 && pp < 1) sy *= 1 + 0.07 * Math.sin(pp * Math.PI) * (1 - pp);
    const sx = 1 / Math.sqrt(sy);
    this.squash.scale.set(sx, sy, sx);

    // gaze + turn
    const gt = expr === 'thinking' ? { x: 0.6, y: 0.75 } : sleeping ? { x: 0, y: -0.2 } : pose === 'finding' ? { x: -0.55, y: 0.05 } : pose === 'working' ? { x: 0.2, y: -0.55 } : this.gazeTarget;

    this.turn.rotation.y = this.yaw;
    this.turn.rotation.x = lerp(this.turn.rotation.x, -this.gaze.y * 0.12, ky);
    const tiltT = expr === 'curious' ? 0.13 : expr === 'thinking' ? -0.07 : sleeping ? 0.06 : 0;

    if (!R && !STILL && t > this.nextBlink) { this.blinkAt = t; this.nextBlink = t + (Math.random() < 0.2 ? 0.25 : 2.4 + Math.random() * 3); }

    if (!this.faceless) {
      const key = `${expr}|${this.gaze.x.toFixed(2)}|${this.gaze.y.toFixed(2)}|${blink.toFixed(2)}|${this.blush}`;
      if (key !== this.faceKey) { this.faceKey = key; drawFace(this.fx, this.fc.width, this.fc.height, expr, this.gaze, blink, this.blush); this.faceTex.needsUpdate = true; }

    // orb companion
    const fl = this.faceless;
    this.orb.position.set(fl ? 0.72 : 0.98 + 0.04 * Math.sin(ft * 0.9), (fl ? -0.38 : 0.98) + 0.06 * Math.sin(ft * 1.7 + 1), fl ? 0.75 : 0.15);
    this.orb.scale.setScalar(fl ? 1.9 : 1);
    this.orb.visible = fl || !['curious', 'sleeping', 'surprised', 'excited'].includes(expr) && pose !== 'greeting';

    // shadow
    const sh = 1 - y * 0.55;
    this.shadow.scale.set(2.0 * sh, 1.25 * sh, 1);
    this.shadowMat.opacity = (THEME_DARK && !this.glow ? 0.32 : 0.5) * (1 - y * 0.9);

    // props
    const wave = R ? 0 : Math.sin(ft * 9);
    this.laptop.visible = pose === 'working';
    this.magnifier.visible = pose === 'finding';
    if (this.magnifier.visible) this.magnifier.position.y = 0.18 + (R ? 0 : 0.04 * Math.sin(ft * 1.3));
    this.bulb.visible = pose === 'explaining';
    if (this.bulb.visible) this.bulb.position.y = 1.12 + (R ? 0 : 0.04 * Math.sin(ft * 2));
    this.nubR.visible = pose === 'greeting' || pose === 'thinking' || pose === 'cheering';
    this.nubL.visible = pose === 'cheering';
    if (pose === 'greeting') this.nubR.position.set(0.98 + 0.02 * wave, -0.22 + 0.09 * wave, 0.32);
    if (pose === 'thinking') this.nubR.position.set(0.3, -0.55 + (R ? 0 : 0.015 * Math.sin(ft * 2)), 0.86);
    if (pose === 'cheering') {
      const c = R ? 0.5 : (Math.sin(ft * 8.4) + 1) / 2;
      this.nubR.position.set(0.98, 0.08 + 0.12 * c, 0.26); this.nubL.position.set(-1.0, 0.08 + 0.12 * (1 - c), 0.26);
    }

    // decor
    this.q.visible = expr === 'curious';
    if (this.q.visible) { this.q.position.y = 1.08 + (R ? 0 : 0.05 * Math.sin(ft * 2.2)); this.q.material.rotation = R ? 0.15 : 0.15 + 0.1 * Math.sin(ft * 1.7); }
    this.z1.visible = this.z2.visible = sleeping;
    if (sleeping) {
      [this.z1, this.z2].forEach((z, i) => {
        const ph = R ? 0.35 + i * 0.3 : (ft * 0.3 + i * 0.5) % 1;
        z.position.set(0.66 + ph * 0.42 + i * 0.05, 0.78 + ph * 0.55, 0.3);
        z.material.opacity = R ? 1 : Math.sin(ph * Math.PI);
        z.material.rotation = -0.2;
      });
    }
    const celebrate = expr === 'celebrating' || pose === 'cheering';
    this.sparkR.visible = expr === 'excited' || celebrate;
    this.sparkL.visible = celebrate;
    this.sparkV.visible = expr === 'surprised';
    this.wave.visible = pose === 'greeting';
    const pulse = R ? 1 : 1 + 0.08 * Math.sin(ft * 6);
    for (const g of [this.sparkR, this.sparkL, this.sparkV, this.wave]) if (g.visible) for (const d of g.children) {
      const [x, yy, cx, cy] = d.userData.base;
      d.position.set(cx + (x - cx) * pulse, cy + (yy - cy) * pulse, 0.3);
    }

    // confetti
    if (celebrate && !this.conf) this.initConfetti();
    if (this.conf) {
      this.conf.visible = celebrate;
      if (celebrate && !R) {
        const D = this.confDummy;
        this.cp.forEach((c, i) => {
          c.v.y -= 3.4 * dt; c.v.x *= 0.985; c.v.z *= 0.985; if (c.v.y < -0.9) c.v.y = -0.9;
          c.p.addScaledVector(c.v, dt);
          c.r.x += c.w.x * dt; c.r.y += c.w.y * dt; c.r.z += c.w.z * dt;
          if (c.p.y < -1.0) this.spawn(c, false);
          D.position.copy(c.p); D.rotation.copy(c.r); D.updateMatrix(); this.conf.setMatrixAt(i, D.matrix);
        });
        this.conf.instanceMatrix.needsUpdate = true;
      } else if (celebrate && !this.confStill) {
        const D = this.confDummy; this.confStill = true;
        this.cp.forEach((c, i) => { D.position.copy(c.p); D.rotation.copy(c.r); D.updateMatrix(); this.conf.setMatrixAt(i, D.matrix); });
        this.conf.instanceMatrix.needsUpdate = true;
      }
    }
  }
}

// ---------- the face, painted in angle space (1 canvas px row = same angle both axes) ----------
const INK = '#1b1520';
function drawFace(x, W, H, expr, gaze, blink, blush) {
  const S = W / 2, cx = W / 2, cy = H / 2;
  const P = (ax, ay) => [cx + ax * S, cy - ay * S];
  x.clearRect(0, 0, W, H);
  x.lineCap = 'round'; x.lineJoin = 'round';

  const strong = expr === 'celebrating' || expr === 'excited' || expr === 'happy' || expr === 'sleeping';
  for (const sd of [-1, 1]) {
    const [bx, by] = P(sd * 0.56, -0.03), r = 0.15 * S;
    const g = x.createRadialGradient(bx, by, 0, bx, by, r);
    g.addColorStop(0, `rgba(${blush},${strong ? 0.62 : 0.54})`); g.addColorStop(0.55, `rgba(${blush},${strong ? 0.3 : 0.25})`); g.addColorStop(1, `rgba(${blush},0)`);
    x.fillStyle = g; x.beginPath(); x.ellipse(bx, by, r, r * 0.78, 0, 0, TAU); x.fill();
  }

  const ox = gaze.x * 0.05, oy = gaze.y * 0.035;
  const rx = 0.088 * S, ry = 0.136 * S, lw = 0.032 * S;
  x.strokeStyle = INK; x.fillStyle = INK; x.lineWidth = lw;
  for (const sd of [-1, 1]) {
    const [ex, ey] = P(sd * 0.37 + ox, 0.14 + oy);
    let k = 1 - blink * 0.94;
    const big = expr === 'curious' && sd === 1 ? 1.12 : 1;
    if (expr === 'happy' || expr === 'celebrating') arc(x, ex, ey + ry * 0.2, rx * 1.15, -ry * 0.95);
    else if (expr === 'sleeping') arc(x, ex, ey - ry * 0.05, rx * 1.15, ry * 0.75);
    else if (expr === 'excited') {
      x.beginPath(); x.moveTo(ex + sd * rx * 0.85, ey - ry * 0.62); x.lineTo(ex - sd * rx * 0.75, ey); x.lineTo(ex + sd * rx * 0.85, ey + ry * 0.62); x.stroke();
    } else if (k < 0.3) arc(x, ex, ey, rx * 1.05, ry * 0.3);
    else if (expr === 'surprised') eye(x, ex, ey, rx * 1.15, rx * 1.2 * k, 0, null, true);
    else if (expr === 'focused') eye(x, ex, ey + ry * 0.08, rx, ry * 0.92 * k, 0, sd);
    else eye(x, ex, ey, rx * big, ry * big * k, sd * 0.08);
  }

  const m = (ax, ay) => P((ax + ox * 0.6) * 1.25, (ay + oy * 0.5) * 1.25 + 0.02);
  x.lineWidth = lw * 0.95;
  x.beginPath();
  if (expr === 'happy') { x.moveTo(...m(-0.08, -0.02)); x.quadraticCurveTo(...m(0, -0.11), ...m(0.08, -0.02)); x.stroke(); }
  else if (expr === 'excited' || expr === 'celebrating') {
    x.moveTo(...m(-0.085, -0.02)); x.quadraticCurveTo(...m(0, -0.005), ...m(0.085, -0.02)); x.quadraticCurveTo(...m(0, -0.15), ...m(-0.085, -0.02)); x.closePath();
    x.fillStyle = '#3a1a28'; x.fill(); x.save(); x.clip(); x.fillStyle = '#ff7f96'; x.beginPath(); x.ellipse(...m(0, -0.115), 0.06 * S, 0.04 * S, 0, 0, TAU); x.fill(); x.restore();
    x.fillStyle = INK;
  } else if (expr === 'surprised') { x.ellipse(...m(0, -0.06), 0.028 * S, 0.036 * S, 0, 0, TAU); x.fillStyle = '#3a1a28'; x.fill(); x.fillStyle = INK; }
  else if (expr === 'thinking') { x.moveTo(...m(0.0, -0.045)); x.quadraticCurveTo(...m(0.035, -0.06), ...m(0.07, -0.035)); x.stroke(); }
  else if (expr === 'focused') { x.moveTo(...m(-0.035, -0.05)); x.lineTo(...m(0.035, -0.05)); x.stroke(); }
  else if (expr === 'sleeping') { x.moveTo(...m(-0.035, -0.04)); x.quadraticCurveTo(...m(0, -0.075), ...m(0.035, -0.04)); x.stroke(); }
  else if (expr === 'curious') { x.moveTo(...m(-0.055, -0.03)); x.quadraticCurveTo(...m(0, -0.085), ...m(0.05, -0.04)); x.stroke(); }
  else { x.moveTo(...m(-0.068, -0.025)); x.quadraticCurveTo(...m(0, -0.1), ...m(0.068, -0.025)); x.stroke(); }
}
function arc(x, cx, cy, hw, bend) { x.beginPath(); x.moveTo(cx - hw, cy); x.quadraticCurveTo(cx, cy + bend, cx + hw, cy); x.stroke(); }
function eye(x, cx, cy, rx, ry, rot, lidSide, round) {
  x.save(); x.translate(cx, cy); x.rotate(rot);
  if (lidSide) { // determined lids: inner corner lower
    x.beginPath(); x.moveTo(lidSide * rx * 1.4, -ry * 0.62); x.lineTo(-lidSide * rx * 1.4, -ry * 0.05); x.lineTo(-lidSide * rx * 1.4, ry * 2); x.lineTo(lidSide * rx * 1.4, ry * 2); x.closePath(); x.clip();
  }
  const g = x.createRadialGradient(-rx * 0.3, -ry * 0.35, ry * 0.08, 0, 0, Math.max(rx, ry) * 1.1);
  g.addColorStop(0, '#2c2432'); g.addColorStop(1, '#0d0910');
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,255,255,.96)';
  x.beginPath(); x.ellipse(-rx * 0.3, -ry * (round ? 0.38 : 0.42), rx * (round ? 0.3 : 0.34), Math.max(1, ry * (round ? 0.3 : 0.24)), -0.5, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,255,255,.5)';
  x.beginPath(); x.ellipse(rx * 0.32, ry * 0.42, rx * 0.13, Math.max(1, ry * 0.09), 0, 0, TAU); x.fill();
  x.restore(); x.fillStyle = INK;
}

/* ---------- run the mascot: one offscreen renderer, one Mascot per job, drawn into every visible canvas ---------- */
const pool=new Map();
const sceneOf=m=>{const scene=new THREE.Scene();scene.add(m.group,new THREE.HemisphereLight('#fff4ec','#ead8ff',1.3));const d=new THREE.DirectionalLight('#ffffff',1.7);d.position.set(-2,3,5);scene.add(d);return scene};
const camOf=(z,ty)=>{const c=new THREE.PerspectiveCamera(30,1,.1,50);c.position.set(0,.42,z);c.lookAt(0,ty,0);return c};
function job(key){if(pool.has(key))return pool.get(key);const [expr,pose]=key.split('|');const m=new Mascot({faceSize:512});m.setColor('peach');m.s.expr=expr;m.s.pose=pose;const j={m,scene:sceneOf(m),cam:camOf(pose==='floating'?5.2:5.9,.16),last:0};pool.set(key,j);return j}
const gl=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});gl.setPixelRatio(1);gl.setClearColor(0,0);let bw=1,bh=1,tNow=0;const updated=new Set();
function draw(){
  THEME_DARK=document.documentElement.dataset.theme==='dark';updated.clear();
  const dpr=Math.min(devicePixelRatio,2);
  document.querySelectorAll('canvas[data-mascot]').forEach(el=>{
    const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||r.width<2)return;
    const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(el.width!==w||el.height!==h){el.width=w;el.height=h}
    if(w>bw||h>bh){bw=Math.max(bw,w);bh=Math.max(bh,h);gl.setSize(bw,bh,false)}
    const j=job(el.dataset.mascot);if(!updated.has(j)){j.m.update(tNow,Math.min(.1,tNow-(j.last||tNow)));j.last=tNow;updated.add(j)}
    j.cam.aspect=w/h;j.cam.updateProjectionMatrix();gl.setViewport(0,0,w,h);gl.render(j.scene,j.cam);
    const x=el.getContext('2d');x.clearRect(0,0,w,h);x.drawImage(gl.domElement,0,bh-h,w,h,0,0,w,h);window.__m3d.frames++});
  window.__m3d.jobs=pool.size;
}
window.__m3d={frames:0,jobs:0};window.__m3dDraw=draw;document.body.classList.add('m3d');
let fr=0;(function loop(now){requestAnimationFrame(loop);tNow=now/1000;if((fr++&1)===0)draw()})(performance.now());

</script></body></html>
