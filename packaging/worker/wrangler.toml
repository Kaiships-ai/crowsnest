# crowsnest download gate. Deploy: wrangler deploy
# One-time setup after `wrangler login`:
#   wrangler r2 bucket create crowsnest-releases
#   wrangler secret put TOKEN_SECRET      # paste any long random string
#   (optional) wrangler kv namespace create RATE_LIMIT  then paste the id below
name = "crowsnest-gate"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "crowsnest-releases"

[vars]
POLAR_API = "https://sandbox-api.polar.sh"
POLAR_ORG_ID = "f66a6080-81b7-4cab-966a-a9225bac4f45"

# Optional per-key throttle. Create the namespace, then uncomment and paste the id:
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "PASTE_KV_ID_HERE"
