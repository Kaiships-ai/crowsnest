name: verify

# Runs the Lead Studio verify journeys in dev mode on the boards lane (fake sidecar, Umami and Polar; no
# real-service keys). Journeys come from the feature files the PR changes (ci-journeys.mjs), shell-01 when
# none. Linux (Xvfb) runs on PRs that touch the renderer, server or verify skill; macOS (arm64) runs on PRs
# that touch src/main, src/preload, native modules or the lockfile, and on every push to main; a manual run
# does both. Screenshots and transcripts go up as one artifact per platform (Linux also a video), and each
# platform comments its link on the PR. Not a required check.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=""
          [ "$GITHUB_EVENT_NAME" = pull_request ] && changed=$(git diff --name-only "origin/$BASE...HEAD")
          linux='{"name":"linux","os":"ubuntu-latest"}'
          macos='{"name":"macos","os":"macos-latest"}'
          m=()
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              grep -qE '^(src/renderer/|src/server/|\.claude/skills/verify/|\.github/workflows/verify\.yml$)' <<<"$changed" && m+=("$linux")
              grep -qE '^(src/main/|src/preload/|native/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/verify\.yml$)' <<<"$changed" && m+=("$macos") ;;
            push) m+=("$macos") ;;
            *) m+=("$linux" "$macos") ;;
          esac
          echo "matrix=[$(IFS=,; echo "${m[*]}")]" >> "$GITHUB_OUTPUT"

  journeys:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: journeys (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - name: Display, recorder and sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The cook journeys write their fixture videos with ffmpeg.
      - name: Fixture videos
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Pick the journeys
        id: pick
        run: echo "journeys=$(node .claude/skills/verify/scripts/ci-journeys.mjs origin/${{ github.base_ref || 'main' }})" >> "$GITHUB_OUTPUT"

      - name: Run the journeys (macOS)
        if: runner.os == 'macOS'
        run: .claude/skills/verify/scripts/ci-run.sh ci ${{ steps.pick.outputs.journeys }}

      - name: Run the journeys (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "journeys: ${{ steps.pick.outputs.journeys }}"
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp &
          for _ in $(seq 1 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          DISPLAY=:99 .claude/skills/verify/scripts/ci-run.sh ci ${{ steps.pick.outputs.journeys }}

      - name: Upload evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ matrix.name }}
          path: data/verify/evidence/ci/
          if-no-files-found: warn

      - name: Comment the evidence link
        if: always() && github.event_name == 'pull_request' && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "**Verify journeys (CI, ${{ matrix.name }}, fakes only): $STATUS**"
            echo
            cat data/verify/evidence/ci/summary.md 2>/dev/null || echo "No summary: the run stopped before the journeys."
            echo
            echo "Evidence (screenshots, transcripts, run.mp4): $URL"
            echo "Run: $RUN_URL"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
