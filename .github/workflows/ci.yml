name: ci

# Every run tests only what changed (vitest --changed, by module graph), split in four shards,
# and nothing for a docs-only change. No run executes the full suite: one took about 90 minutes.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Testid audit
        run: bash scripts/testid-audit.sh

      - name: Skill lint
        run: bash scripts/skill-lint.sh

      - name: Migration journal
        run: node scripts/check-migrations.mjs

      - name: Doc paths
        run: node scripts/check-doc-paths.mjs

      - name: Verify coverage (G-03)
        if: github.event_name == 'pull_request'
        run: |
          node --test scripts/check-verify-coverage.test.mjs
          node scripts/check-verify-coverage.mjs origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the tests
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) since="origin/$BASE" ;;
            push) since="$BEFORE" ;;
            *) since=origin/main ;;
          esac
          code="$(git diff --name-only "$since"...HEAD | grep -vE '\.md$|^documents/|^docs/|^\.claude/|^\.agents/|^mkdocs\.yml$' || true)"
          if [ -z "$code" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "args=--changed $since" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.skip != '1'

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.skip != '1'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.skip != '1'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.scope.outputs.skip != '1'
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
        run: pnpm test --shard=${{ matrix.shard }}/4 --passWithNoTests ${{ steps.scope.outputs.args }}
