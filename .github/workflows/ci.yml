name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-verify-coverage diffs against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Testid audit
        run: bash scripts/testid-audit.sh

      - name: Skill lint
        run: bash scripts/skill-lint.sh

      - name: Migration journal
        run: node scripts/check-migrations.mjs

      - name: Doc paths
        run: node scripts/check-doc-paths.mjs

      - name: Verify coverage (G-03)
        if: github.event_name == 'pull_request'
        run: |
          node --test scripts/check-verify-coverage.test.mjs
          node scripts/check-verify-coverage.mjs origin/${{ github.base_ref }}
