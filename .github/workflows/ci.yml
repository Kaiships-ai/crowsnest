name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Testid audit
        run: bash scripts/testid-audit.sh

      - name: Skill lint
        run: bash scripts/skill-lint.sh

      - name: Migration journal
        run: node scripts/check-migrations.mjs

      - name: Doc paths
        run: node scripts/check-doc-paths.mjs

      - name: Verify coverage (G-03)
        if: github.event_name == 'pull_request'
        run: |
          node --test scripts/check-verify-coverage.test.mjs
          node scripts/check-verify-coverage.mjs origin/${{ github.base_ref }}
