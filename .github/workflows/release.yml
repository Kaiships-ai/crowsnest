name: release

# Cut a crowsnest release by pushing a tag:
#   git tag v0.2.1 && git push origin v0.2.1
#
# Builds the arm64 bundle, bakes install.sh, and uploads the tarball + install.sh +
# latest.json to R2. The version is the tag minus its leading "v".
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers R2 Storage:Edit on this account
#   CLOUDFLARE_ACCOUNT_ID  8745b6916d47f1b2411136b18c77333a

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    # Apple Silicon runner: native modules (better-sqlite3, node-pty) and the arm64
    # wheelhouse must be built on arm64 macOS, matching what buyers run.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Changelog has an entry for this version
        run: |
          grep -q "^## ${{ steps.ver.outputs.version }}\$" packaging/CHANGELOG.md \
            || { echo "No CHANGELOG.md entry for ${{ steps.ver.outputs.version }}"; exit 1; }

      - name: Test gate (npm ci, typecheck, test)
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build the bundle
        run: bash packaging/build-bundle.sh "${{ steps.ver.outputs.version }}" darwin-arm64 dist

      - name: Generate install.sh
        run: bash packaging/gen-install.sh "${{ steps.ver.outputs.version }}" "dist/crowsnest-v${{ steps.ver.outputs.version }}-darwin-arm64.tar.gz" > dist/install.sh

      - name: Fresh-HOME Kit smoke
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          PLATFORM="darwin-arm64"
          TARBALL="$PWD/dist/crowsnest-v$V-$PLATFORM.tar.gz"

          FAKE_HOME="$(mktemp -d)"
          export HOME="$FAKE_HOME"
          APPS="$FAKE_HOME/.kai/app"
          STATE="$FAKE_HOME/.kai/state"
          BIN="$FAKE_HOME/.local/bin"
          APP="$APPS/v$V"
          IG="$APP/app/services/ig"

          echo "==> extracting the built tarball into a fresh HOME ($FAKE_HOME)"
          mkdir -p "$APP" "$STATE" "$BIN"
          tar xzf "$TARBALL" -C "$APP" --strip-components=1
          ln -sfn "$APP" "$APPS/current"
          ln -sfn "$APPS/current/bin/kai" "$BIN/kai"
          export PATH="$BIN:$PATH"

          echo "==> fixture entitlement (skips the real Polar login)"
          printf '{"key":"SMOKE-TEST-KEY","activation_id":"smoke-test-activation","customer_id":null,"validated_at":"2026-01-01T00:00:00.000Z"}\n' \
            > "$STATE/entitlement.json"

          echo "==> building the ig sidecar venv offline (mirrors install.sh)"
          "$APP/bin/uv" venv --python "$APP/runtime/python/bin/python3" "$IG/.venv" >/dev/null
          REQ="$(mktemp)"
          ( cd "$IG" && "$APP/bin/uv" export --no-hashes --no-dev --no-emit-project 2>/dev/null ) \
            | grep -E '^[a-zA-Z0-9]' | sed 's/ ;.*//' > "$REQ"
          VIRTUAL_ENV="$IG/.venv" "$APP/bin/uv" pip install --python "$IG/.venv/bin/python" \
            --no-index --find-links "$APP/wheelhouse" -r "$REQ" >/dev/null

          echo "==> kai kit init (fresh HOME, piped answers)"
          # kit init writes .env.local and migrates the db before it tries to bring the
          # dashboard up via launchd; that launchd step is not what this smoke tests (a
          # headless runner's launchd session is unreliable), so its own exit code is not
          # fatal here -- the assertions below are what actually gate the job.
          printf 'smoketest\nsmokepass\n\n\n' | kai kit init || true

          ENV_LOCAL="$APP/app/.env.local"
          echo "==> asserting .env.local and the db"
          [ -f "$ENV_LOCAL" ] || { echo "FAIL: no .env.local written"; exit 1; }
          grep -qE '^IG_PASSWORD=.+' "$ENV_LOCAL" || { echo "FAIL: IG_PASSWORD is empty"; exit 1; }
          grep -qE '^IG_SERVICE_TOKEN=.+' "$ENV_LOCAL" || { echo "FAIL: IG_SERVICE_TOKEN is empty"; exit 1; }
          if grep -qE '^IG_SERVICE_TOKEN=change-me' "$ENV_LOCAL"; then
            echo "FAIL: IG_SERVICE_TOKEN was not generated"; exit 1
          fi
          [ -f "$APP/app/data/crowsnest.db" ] || { echo "FAIL: db was not migrated"; exit 1; }
          echo "OK: .env.local + db"

          echo "==> starting the ig sidecar directly and checking /health"
          TOKEN="$(sed -n 's/^IG_SERVICE_TOKEN=//p' "$ENV_LOCAL")"
          ( cd "$IG" && "$IG/.venv/bin/python" -m crowsnest_ig >"$FAKE_HOME/ig-sidecar.log" 2>&1 & echo $! > "$FAKE_HOME/ig.pid" )
          IG_PID="$(cat "$FAKE_HOME/ig.pid")"

          CODE=""
          for _ in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "X-IG-Token: $TOKEN" http://127.0.0.1:8765/health || true)"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 1
          done
          kill "$IG_PID" 2>/dev/null || true

          if [ "$CODE" != "200" ]; then
            echo "FAIL: sidecar /health returned '$CODE', not 200"
            cat "$FAKE_HOME/ig-sidecar.log" || true
            exit 1
          fi
          echo "OK: sidecar /health -> 200"

      - name: Upload to R2
        working-directory: packaging/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-audit --no-fund
          V="${{ steps.ver.outputs.version }}"
          npx wrangler r2 object put "crowsnest-releases/releases/v$V/crowsnest-v$V-darwin-arm64.tar.gz" \
            --file "../../dist/crowsnest-v$V-darwin-arm64.tar.gz" --content-type application/gzip
          npx wrangler r2 object put "crowsnest-releases/install.sh" \
            --file "../../dist/install.sh" --content-type text/x-shellscript
          printf '{"version":"%s"}' "$V" > /tmp/latest.json
          npx wrangler r2 object put "crowsnest-releases/latest.json" \
            --file /tmp/latest.json --content-type application/json
